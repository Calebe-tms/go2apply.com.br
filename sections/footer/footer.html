<!-- ==========================================================================
   Section / Dobra: Footer
   Minimalista: logo, copyright e redes sociais em uma única linha.
   ========================================================================== -->
<style>
    .footer {
        position: relative;
        padding: var(--space-md) 2rem;
        background-color: var(--color-dark-surface);
        border-top: 1px solid var(--color-border);
    }

    .footer__inner {
        max-width: 1400px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: var(--space-md);
    }

    .footer__brand {
        justify-self: start;
    }

    .footer__logo {
        height: 24px;
        width: auto;
        display: block;
    }

    .footer__copy {
        justify-self: center;
        color: rgba(var(--color-white-rgb), 0.4);
        font-size: var(--font-size-xs);
        white-space: nowrap;
    }

    .footer__social {
        justify-self: end;
        display: flex;
        gap: var(--space-xs);
    }

    .footer__social a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: var(--radius-btn);
        color: var(--color-white-muted);
        transition: var(--transition-smooth);
    }

    .footer__social a:hover {
        color: var(--color-orange);
        background-color: rgba(var(--color-white-rgb), 0.06);
    }

    @media (max-width: 600px) {
        .footer {
            padding: var(--space-md) 1.25rem;
        }

        .footer__inner {
            grid-template-columns: 1fr;
            justify-items: center;
            gap: var(--space-sm);
        }

        .footer__brand,
        .footer__copy,
        .footer__social {
            justify-self: center;
        }

        .footer__copy {
            white-space: normal;
            text-align: center;
        }
    }
</style>

<footer class="footer" id="footer">
    <div class="footer__inner">
        <div class="footer__brand">
            <img src="assets/imagens/go2apply-logo-colorido.png" alt="go2apply" class="footer__logo" loading="lazy">
        </div>

        <p class="footer__copy">© 2026 go2apply. Todos os direitos reservados.</p>

        <div class="footer__social">
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                </svg>
            </a>
            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
                    <rect x="2" y="9" width="4" height="12"></rect>
                    <circle cx="4" cy="4" r="2"></circle>
                </svg>
            </a>
            <a href="https://wa.me" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                </svg>
            </a>
        </div>
    </div>
</footer>
