<!-- ==========================================================================
   Section / Dobra: Footer
   Minimalista: logo, copyright e redes sociais em uma única linha.
   ========================================================================== -->
<style>
    .footer {
        position: relative;
        padding: var(--space-md) 2rem;
        background-color: var(--color-dark-surface);
        border-top: 1px solid var(--color-border);
    }

    .footer__inner {
        max-width: 1400px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: var(--space-md);
    }

    .footer__brand {
        justify-self: start;
    }

    .footer__logo {
        height: 24px;
        width: auto;
        display: block;
    }

    .footer__copy {
        justify-self: center;
        color: rgba(var(--color-white-rgb), 0.4);
        font-size: var(--font-size-xs);
        white-space: nowrap;
    }

    .footer__social {
        justify-self: end;
    }

    @media (max-width: 600px) {
        .footer {
            padding: var(--space-md) 1.25rem;
        }

        .footer__inner {
            grid-template-columns: 1fr;
            justify-items: center;
            gap: var(--space-sm);
        }

        .footer__brand,
        .footer__copy,
        .footer__social {
            justify-self: center;
        }

        .footer__copy {
            white-space: normal;
            text-align: center;
        }
    }
</style>

<footer class="footer" id="footer">
    <div class="footer__inner">
        <div class="footer__brand">
            <img src="assets/imagens/go2apply-logo-colorido.png" alt="go2apply" class="footer__logo" loading="lazy">
        </div>

        <p class="footer__copy">© 2026 go2apply. Todos os direitos reservados.</p>

        <div class="footer__social">
            <div data-component="components/social-links/social-links.html"></div>
        </div>
    </div>
</footer>
