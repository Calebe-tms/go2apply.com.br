<!-- ==========================================================================
   Component: Hero Background
   Carrossel contínuo de vídeos Cloudinary com Radar Circular Interativo e Telemetria
   ========================================================================== -->
<style>
    .hero-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        overflow: hidden;
    }

    .bg-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 1;
        z-index: 1;
        pointer-events: none;
        /* Vibrance simulada: aumenta saturação e contraste sem estourar os brilhos */
        filter: saturate(1.35) contrast(1.08);
    }

    /* Overlay Gradiente Suave do DS */
    .hero-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--hero-overlay-gradient);
        z-index: 3;
        pointer-events: none;
    }

    /* Retícula: grade discreta de pontos sobre o vídeo, dando textura de tela */
    .hero-grid-overlay {
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
        background-image: radial-gradient(circle at center, var(--color-white) 35%, transparent 36%);
        background-size: 6px 6px;
        mix-blend-mode: overlay;
        opacity: 0.1;
    }

    .hero-canvas {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 6;
        pointer-events: none;
    }

    @media (max-width: 600px) {
        .hero-canvas {
            display: none;
        }
    }
</style>

<div class="hero-bg" id="hero-bg">
    <video id="bg-video-1" class="bg-video" muted playsinline autoplay
        poster="https://res.cloudinary.com/vdgkx5jc/video/upload/so_0,w_960,q_50,f_jpg/v1788029484/bg-1.jpg"></video>
    <div class="hero-overlay"></div>
    <div class="hero-grid-overlay" aria-hidden="true"></div>
    <canvas id="hero-mesh-canvas" class="hero-canvas"></canvas>
</div>

<script>
    // Constantes de configuração

    const HERO_VIDEOS = [
        'https://res.cloudinary.com/vdgkx5jc/video/upload/v1788230093/Tk-3-0988.webm',
        'https://res.cloudinary.com/vdgkx5jc/video/upload/v1788230096/Tk-2-0615-P1.webm',
        'https://res.cloudinary.com/vdgkx5jc/video/upload/v1788230093/Tk-1.webm',
        'https://res.cloudinary.com/vdgkx5jc/video/upload/v1788230094/Tk-4-0615-P1.webm',
    ];
    // --- 1. Carrossel de Vídeos: motor compartilhado (js/video-carousel.js) ---
    function initVideoCarousel() {
        if (!window.createVideoCarousel) return;
        window.createVideoCarousel({
            videoId: 'bg-video-1',
            urls: HERO_VIDEOS,
            onFirstFrame: () => window.dispatchEvent(new CustomEvent('hero:first-video-ready'))
        });
    }

    // --- 2. Motor do Radar: motor compartilhado (js/radar-canvas-engine.js) ---
    function initRadarCanvas() {
        if (!window.createRadarCanvasEngine) return;
        window.createRadarCanvasEngine({
            canvasId: 'hero-mesh-canvas',
            sectionId: 'hero',
            obstacleSelector: 'a, button, .header, .btn-cta, .nav-toggle, .social-link, h1, h2, h3, .hero-title, .main-logo, .hero-footer, .diff-card, p, input, select, textarea',
            alpha: { base: 0.80, idle: 0.20, active: 0.65, obstacle: 0.35 },
            visibilityThreshold: 0.1,
            resizeOnComponentsReady: true,
            initialMouseYFactor: 0.38,
            getWidth: () => window.innerWidth,
            getCanvasHeight: () => Math.max(document.documentElement.scrollHeight || 0, document.body.scrollHeight || 0, window.innerHeight * 2.5),
            getRefHeight: (section) => section.offsetHeight,
            computePhoneY: (refHeight, phoneDim, isMobile) => isMobile ? refHeight - 118 : refHeight - 156
        });
    }

    initVideoCarousel();
    initRadarCanvas();
</script>
