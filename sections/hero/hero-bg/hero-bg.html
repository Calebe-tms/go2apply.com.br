<!-- ==========================================================================
   Component: Hero Background
   Carrossel contínuo de vídeos Cloudinary com Radar Circular Interativo e Telemetria
   ========================================================================== -->
<style>
    .hero-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        overflow: hidden;
    }

    .bg-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 1;
        z-index: 1;
        pointer-events: none;
        /* Vibrance simulada: aumenta saturação e contraste sem estourar os brilhos */
        filter: saturate(1.35) contrast(1.08);
    }

    /* Overlay Gradiente Suave do DS */
    .hero-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--hero-overlay-gradient);
        z-index: 3;
        pointer-events: none;
    }

    /* Retícula: grade discreta de pontos sobre o vídeo, dando textura de tela */
    .hero-grid-overlay {
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
        background-image: radial-gradient(circle at center, var(--color-white) 35%, transparent 36%);
        background-size: 6px 6px;
        mix-blend-mode: overlay;
        opacity: 0.1;
    }

</style>

<div class="hero-bg" id="hero-bg">
    <video id="bg-video-1" class="bg-video" muted playsinline autoplay
        poster="https://res.cloudinary.com/vdgkx5jc/video/upload/so_0,w_960,q_50,f_jpg/v1788029484/bg-1.jpg"></video>
    <div class="hero-overlay"></div>
    <div class="hero-grid-overlay" aria-hidden="true"></div>
</div>

<script>
    // Public IDs do Cloudinary; as transformações de formato/resolução são
    // aplicadas por window.videoSources (js/video-carousel.js)
    const HERO_VIDEO_IDS = [
        'v1788230093/Tk-3-0988.webm',
        'v1788230096/Tk-2-0615-P1.webm',
        'v1788230093/Tk-1.webm',
        'v1788230094/Tk-4-0615-P1.webm',
    ];

    function initVideoCarousel() {
        if (!window.createVideoCarousel || !window.videoSources) return;
        window.createVideoCarousel({
            videoId: 'bg-video-1',
            urls: window.videoSources(HERO_VIDEO_IDS),
            onFirstFrame: () => window.dispatchEvent(new CustomEvent('hero:first-video-ready'))
        });
    }

    initVideoCarousel();
</script>
