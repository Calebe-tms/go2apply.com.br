<!-- ==========================================================================
   Section / Dobra: Hero (Orquestrador)
   ========================================================================== -->
<style>
    .hero {
        position: relative;
        width: 100%;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .hero-content {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100dvh;
        width: 100%;
        padding: clamp(0rem, 10vh, 7.5rem) 1.5rem clamp(6.5rem, 12vh, 8.5rem);
        pointer-events: none;
    }

    .hero-content a,
    .hero-content button,
    .hero-content h1,
    .hero-content p,
    .hero-content img {
        pointer-events: auto;
    }

    .hero-inner {
        position: relative;
        width: 100%;
        max-width: 1100px;
        margin: auto 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        gap: 1.35rem;
        padding: 0.5rem 1rem;
    }

    .hero-inner::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(94vw, 960px);
        height: 120%;
        background: radial-gradient(ellipse 65% 60% at 50% 50%,
                rgba(var(--color-dark-surface-rgb), 0.62) 0%,
                rgba(var(--color-dark-rgb), 0.32) 48%,
                rgba(var(--color-dark-rgb), 0) 85%);
        pointer-events: none;
        z-index: -1;
        border-radius: 50%;
        filter: blur(24px);
    }

    @media (max-width: 992px) {
        .hero-content {
            padding-top: clamp(4.5rem, 8vh, 6rem);
            padding-bottom: clamp(5.5rem, 10vh, 7.5rem);
            padding-left: 1.25rem;
            padding-right: 1.25rem;
        }
    }

    @media (max-width: 600px) {
        .hero {
            min-height: 100dvh;
        }

        .hero-content {
            padding-top: max(4.2rem, 11dvh);
            padding-bottom: max(5.5rem, 17dvh);
            padding-left: 1.15rem;
            padding-right: 1.15rem;
            min-height: 100dvh;
            justify-content: flex-start;
        }

        .hero-inner {
            margin: auto 0;
            gap: 1.15rem;
            padding: 0.5rem 0.25rem;
            transform: translateY(-2.5vh);
        }

        .hero-inner::before {
            width: 100%;
            height: 100%;
            filter: blur(16px);
        }
    }
</style>

<section class="hero" id="hero">
    <!-- Subcomponente exclusivo 1: Fundo com carrossel de vídeos -->
    <div data-component="sections/hero/hero-bg/hero-bg.html"></div>

    <!-- Conteúdo central da dobra Hero -->
    <div class="hero-content" id="hero-content">
        <div class="hero-inner">
            <!-- Subcomponente exclusivo 2: Logo e título -->
            <div data-component="sections/hero/hero-cta/hero-cta.html"></div>

            <!-- Componente Global Reutilizável: Botão CTA -->
            <div data-component="components/btn-cta/btn-cta.html"></div>
        </div>

        <!-- Subcomponente exclusivo 3: Indicador de rolagem -->
        <div data-component="sections/hero/hero-scroll-indicator/hero-scroll-indicator.html"></div>

        <!-- Subcomponente exclusivo 4: Ticker técnico deslizante -->
        <div data-component="sections/hero/hero-ticker/hero-ticker.html"></div>
    </div>
</section>
