<style>
    .hero-scroll-indicator {
        position: absolute;
        left: 50%;
        bottom: calc(36px + clamp(1.25rem, 2.5vh, 2.25rem));
        z-index: 20;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--color-white, #fefcf8);
        text-decoration: none;
        cursor: pointer;
        pointer-events: auto;
        opacity: 0;
        transform: translateX(-50%);
        transition: var(--transition-smooth, all 0.35s cubic-bezier(0.16, 1, 0.3, 1));
        animation: heroScrollFadeIn 1.2s ease 1s forwards;
    }

    .hero-scroll-icon {
        font-size: 2.2rem;
        color: var(--color-white, #fefcf8);
        opacity: 0.85;
        filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.6));
        animation: heroArrowBounce 2s ease-in-out infinite;
        transition: var(--transition-smooth, all 0.3s ease);
    }

    .hero-scroll-indicator:hover .hero-scroll-icon {
        color: var(--color-orange, #f28e13);
        opacity: 1;
        filter: drop-shadow(0 4px 14px var(--color-orange-glow, rgba(242, 142, 19, 0.6)));
        transform: translateY(4px) scale(1.15);
        animation-play-state: paused;
    }

    @keyframes heroScrollFadeIn {
        from {
            opacity: 0;
            transform: translateX(-50%) translateY(-10px);
        }

        to {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    }

    @keyframes heroArrowBounce {
        0%, 100% {
            transform: translateY(0);
            opacity: 0.6;
        }

        50% {
            transform: translateY(10px);
            opacity: 1;
        }
    }

    @media (max-width: 600px) {
        .hero-scroll-indicator {
            bottom: calc(30px + 1rem);
        }

        .hero-scroll-icon {
            font-size: 1.75rem;
        }
    }
</style>

<a href="#objection-breaker" class="hero-scroll-indicator" id="hero-scroll-indicator" aria-label="Rolar para a próxima seção">
    <i class="ph ph-caret-down hero-scroll-icon" aria-hidden="true"></i>
</a>
