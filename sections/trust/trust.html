<!-- ==========================================================================
   Seção: Trust
   Dobra de autoridade da empresa: selo de confiança + números em hierarquia
   assimétrica (não em cards iguais) + carrossel contínuo de parceiros.
   Fundo com foto de campo de pesquisa + animação de radar com o mockup de
   celular (mesma linguagem visual do canvas de fundo da Hero).
   ========================================================================== -->
<style>
    .trust {
        position: relative;
        z-index: 2;
        width: 100%;
        margin-top: -90px;
        padding: calc(var(--space-2xl) + 90px) 1.5rem var(--space-2xl);
        clip-path: polygon(0 90px, 100% 0, 100% 100%, 0 100%);
        overflow: hidden;
        color: var(--color-white);
    }

    .trust-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
    }

    .trust-bg-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .trust-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
    }

    .trust-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg,
                rgba(var(--color-dark-rgb), 0.88) 0%,
                rgba(var(--color-dark-rgb), 0.8) 50%,
                rgba(var(--color-dark-rgb), 0.9) 100%);
    }

    .trust-inner {
        position: relative;
        z-index: 1;
        max-width: 1200px;
        margin: 0 auto;
    }

    /* --- Selo + números: composição split, não centralizada --- */
    .trust-grid {
        display: grid;
        grid-template-columns: 0.85fr 1.15fr;
        gap: var(--space-2xl);
        align-items: center;
        padding-bottom: var(--space-2xl);
        margin-bottom: var(--space-2xl);
        border-bottom: 1px solid var(--color-border);
    }

    .trust-badge-icon {
        display: flex;
        width: 104px;
        height: 104px;
        color: var(--color-caldas-light);
        margin: 0 0 var(--space-md);
    }

    .trust-title {
        font-family: var(--font-main);
        font-weight: 800;
        font-size: calc(var(--font-size-hero) * 0.95);
        line-height: 1.15;
        text-transform: uppercase;
        margin: 0 0 var(--space-sm);
    }

    .trust-title .highlight {
        color: var(--color-caldas-light);
    }

    .trust-subtitle {
        color: var(--color-white-muted);
        font-size: var(--font-size-md);
        line-height: 1.6;
        max-width: 42ch;
        margin: 0;
    }

    .trust-subtitle .highlight {
        color: var(--color-orange);
        font-weight: 700;
    }

    .trust-credit {
        color: rgba(var(--color-white-rgb), 0.5);
        font-size: var(--font-size-sm);
        max-width: 42ch;
        margin: var(--space-md) 0 0;
    }

    .trust-credit a {
        color: var(--color-caldas-light);
        font-weight: 700;
        transition: color 0.25s ease;
    }

    .trust-credit a:hover {
        color: var(--color-orange);
    }

    .trust-stats-col {
        display: flex;
        align-items: center;
        gap: var(--space-xl);
    }

    .trust-stat {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
    }

    .trust-stat-icon {
        display: flex;
        width: 24px;
        height: 24px;
        color: var(--color-orange);
        margin-bottom: 0.25rem;
    }

    .trust-stat-number {
        font-family: var(--font-main);
        font-weight: 800;
        color: var(--color-white);
        line-height: 1;
    }

    .trust-stat-label {
        color: var(--color-white-muted);
        font-size: var(--font-size-sm);
    }

    /* Hierarquia assimétrica: um número protagonista, dois secundários */
    .trust-stat--featured {
        flex: 1.3;
    }

    .trust-stat--featured .trust-stat-icon {
        width: 26px;
        height: 26px;
    }

    .trust-stat--featured .trust-stat-number {
        font-size: calc(var(--font-size-hero) * 0.9);
    }

    .trust-stat--featured .trust-stat-label {
        font-size: var(--font-size-sm);
    }

    .trust-stat:not(.trust-stat--featured) {
        flex: 1;
    }

    .trust-stat:not(.trust-stat--featured) .trust-stat-number {
        font-size: var(--font-size-xl);
    }

    .trust-stat-divider {
        align-self: stretch;
        width: 1px;
        background-color: var(--color-border);
    }

    /* --- Carrossel de parceiros: só logos, alto, sem texto --- */
    .trust-marquee-wrap {
        position: relative;
        height: 140px;
        overflow: hidden;
        -webkit-mask-image: linear-gradient(90deg,
                transparent 0,
                #000 8%,
                #000 92%,
                transparent 100%);
        mask-image: linear-gradient(90deg,
                transparent 0,
                #000 8%,
                #000 92%,
                transparent 100%);
    }

    .trust-marquee-track {
        --trust-logo-gap: 5rem;
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        align-items: center;
        height: 100%;
        width: max-content;
        gap: var(--trust-logo-gap);
        cursor: grab;
        touch-action: pan-y;
        user-select: none;
        will-change: transform;
    }

    .trust-marquee-track.is-dragging {
        cursor: grabbing;
    }

    .trust-logo {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 140px;
        height: 72px;
        color: var(--color-white);
        filter: grayscale(1) opacity(0.55);
        transition: filter 0.3s ease, transform 0.3s ease;
        -webkit-user-drag: none;
    }

    .trust-logo:hover {
        filter: grayscale(0) opacity(1);
        transform: translateY(-2px);
    }

    .trust-logo svg,
    .trust-logo img {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
        pointer-events: none;
    }

    /* Divisor hiper discreto entre cada logo, centralizado no meio do gap */
    .trust-logo:not(:first-child)::before {
        content: '';
        position: absolute;
        left: calc(var(--trust-logo-gap) / -2);
        top: 50%;
        transform: translateY(-50%);
        width: 1px;
        height: 28px;
        background-color: rgba(var(--color-white-rgb), 0.1);
    }

    @media (prefers-reduced-motion: reduce) {
        .trust-marquee-track {
            transition: none;
        }
    }

    @media (max-width: 992px) {
        .trust-grid {
            grid-template-columns: 1fr;
            gap: var(--space-xl);
        }

        .trust-stats-col {
            flex-wrap: wrap;
        }
    }

    @media (max-width: 600px) {
        .trust {
            margin-top: -48px;
            padding: calc(var(--space-xl) + 48px) 1.25rem var(--space-xl);
            clip-path: polygon(0 48px, 100% 0, 100% 100%, 0 100%);
        }

        .trust-stats-col {
            flex-direction: column;
            align-items: flex-start;
            gap: var(--space-md);
        }

        .trust-stat-divider {
            width: 100%;
            height: 1px;
        }

        .trust-marquee-wrap {
            height: 100px;
        }

        .trust-marquee-track {
            --trust-logo-gap: 3rem;
        }

        .trust-logo {
            width: 100px;
            height: 52px;
        }

        .trust-logo:not(:first-child)::before {
            height: 20px;
        }
    }
</style>

<script>
    (function () {
        // Canvas de radar com mockup de celular e telemetria: motor
        // compartilhado (js/radar-canvas-engine.js), mesma linguagem visual
        // do fundo da Hero, adaptada às dimensões da seção Trust.
        function initTrustRadarCanvas() {
            if (!window.createRadarCanvasEngine) return;
            window.createRadarCanvasEngine({
                canvasId: 'trust-canvas',
                sectionId: 'trust',
                obstacleSelector: 'a, button, .trust-badge-col, .trust-stats-col, h2, p, .trust-marquee-wrap, input, select, textarea',
                alpha: { base: 0.32, idle: 0.08, active: 0.28, obstacle: 0.12 },
                visibilityThreshold: 0.05,
                resizeOnComponentsReady: false,
                initialMouseYFactor: 0.5,
                getWidth: (section) => section.offsetWidth,
                getCanvasHeight: (section) => section.offsetHeight,
                getRefHeight: (section) => section.offsetHeight,
                computePhoneY: (refHeight, phoneDim, isMobile) =>
                    isMobile ? refHeight - phoneDim.height / 2 - 20 : refHeight - phoneDim.height / 2 - 32
            });
        }

        // Carrossel de parceiros: rolagem automática contínua via requestAnimationFrame,
        // que pode ser controlada com o mouse (arrastar) e retoma sozinha ao soltar.
        function initTrustMarquee() {
            const wrap = document.querySelector('.trust-marquee-wrap');
            const track = document.getElementById('trust-marquee-track');
            if (!wrap || !track) return;

            const AUTO_SPEED = 0.5; // px por frame
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            let offset = 0;
            let setWidth = 0;
            let isDragging = false;
            let dragMoved = false;
            let dragStartX = 0;
            let dragStartOffset = 0;

            function measure() {
                setWidth = track.scrollWidth / 2;
            }

            function applyTransform() {
                if (setWidth > 0) {
                    offset = ((offset % setWidth) + setWidth) % setWidth;
                }
                track.style.transform = `translateX(${-offset}px)`;
            }

            function tick() {
                if (!isDragging) {
                    offset += AUTO_SPEED;
                    applyTransform();
                }
                requestAnimationFrame(tick);
            }

            function onPointerDown(e) {
                isDragging = true;
                dragMoved = false;
                dragStartX = e.clientX;
                dragStartOffset = offset;
                track.classList.add('is-dragging');
                track.setPointerCapture(e.pointerId);
            }

            function onPointerMove(e) {
                if (!isDragging) return;
                const dx = e.clientX - dragStartX;
                if (Math.abs(dx) > 4) dragMoved = true;
                offset = dragStartOffset - dx;
                applyTransform();
            }

            function endDrag() {
                if (!isDragging) return;
                isDragging = false;
                track.classList.remove('is-dragging');
            }

            track.addEventListener('pointerdown', onPointerDown);
            track.addEventListener('pointermove', onPointerMove);
            track.addEventListener('pointerup', endDrag);
            track.addEventListener('pointercancel', endDrag);

            // Evita que o clique no link do logo dispare após um arraste real
            track.addEventListener('click', (e) => {
                if (dragMoved) {
                    e.preventDefault();
                    e.stopPropagation();
                }
            }, true);

            window.addEventListener('resize', measure, { passive: true });

            measure();
            if (reduceMotion) return;
            requestAnimationFrame(tick);
        }

        onComponentsReady(() => {
            initTrustRadarCanvas();
            initTrustMarquee();
        });
    })();
</script>
