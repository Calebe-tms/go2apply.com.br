<!-- ==========================================================================
   Seção: Trust
   Dobra de autoridade da empresa: selo de confiança + números em hierarquia
   assimétrica (não em cards iguais) + carrossel contínuo de parceiros.
   Fundo com foto de campo de pesquisa + animação de radar com o mockup de
   celular (mesma linguagem visual do canvas de fundo da Hero).
   ========================================================================== -->
<style>
    .trust {
        position: relative;
        z-index: 2;
        width: 100%;
        margin-top: -90px;
        padding: calc(var(--space-2xl) + 90px) 1.5rem var(--space-2xl);
        clip-path: polygon(0 90px, 100% 0, 100% 100%, 0 100%);
        overflow: hidden;
        color: var(--color-white);
    }

    .trust-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
    }

    .trust-bg-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .trust-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
    }

    .trust-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg,
                rgba(var(--color-dark-rgb), 0.88) 0%,
                rgba(var(--color-dark-rgb), 0.8) 50%,
                rgba(var(--color-dark-rgb), 0.9) 100%);
    }

    .trust-inner {
        position: relative;
        z-index: 1;
        max-width: 1200px;
        margin: 0 auto;
    }

    /* --- Selo + números: composição split, não centralizada --- */
    .trust-grid {
        display: grid;
        grid-template-columns: 0.85fr 1.15fr;
        gap: var(--space-2xl);
        align-items: center;
        padding-bottom: var(--space-2xl);
        margin-bottom: var(--space-2xl);
        border-bottom: 1px solid var(--color-border);
    }

    .trust-badge-icon {
        display: flex;
        width: 104px;
        height: 104px;
        color: var(--color-caldas-light);
        margin: 0 0 var(--space-md);
    }

    .trust-title {
        font-family: var(--font-main);
        font-weight: 800;
        font-size: calc(var(--font-size-hero) * 0.95);
        line-height: 1.15;
        text-transform: uppercase;
        margin: 0 0 var(--space-sm);
    }

    .trust-title .highlight {
        color: var(--color-caldas-light);
    }

    .trust-subtitle {
        color: var(--color-white-muted);
        font-size: var(--font-size-md);
        line-height: 1.6;
        max-width: 42ch;
        margin: 0;
    }

    .trust-subtitle .highlight {
        color: var(--color-orange);
        font-weight: 700;
    }

    .trust-credit {
        color: rgba(var(--color-white-rgb), 0.5);
        font-size: var(--font-size-sm);
        max-width: 42ch;
        margin: var(--space-md) 0 0;
    }

    .trust-credit a {
        color: var(--color-caldas-light);
        font-weight: 700;
        transition: color 0.25s ease;
    }

    .trust-credit a:hover {
        color: var(--color-orange);
    }

    .trust-stats-col {
        display: flex;
        align-items: center;
        gap: var(--space-xl);
    }

    .trust-stat {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
    }

    .trust-stat-icon {
        display: flex;
        width: 24px;
        height: 24px;
        color: var(--color-orange);
        margin-bottom: 0.25rem;
    }

    .trust-stat-number {
        font-family: var(--font-main);
        font-weight: 800;
        color: var(--color-white);
        line-height: 1;
    }

    .trust-stat-label {
        color: var(--color-white-muted);
        font-size: var(--font-size-sm);
    }

    /* Hierarquia assimétrica: um número protagonista, dois secundários */
    .trust-stat--featured {
        flex: 1.3;
    }

    .trust-stat--featured .trust-stat-icon {
        width: 26px;
        height: 26px;
    }

    .trust-stat--featured .trust-stat-number {
        font-size: calc(var(--font-size-hero) * 0.9);
    }

    .trust-stat--featured .trust-stat-label {
        font-size: var(--font-size-sm);
    }

    .trust-stat:not(.trust-stat--featured) {
        flex: 1;
    }

    .trust-stat:not(.trust-stat--featured) .trust-stat-number {
        font-size: var(--font-size-xl);
    }

    .trust-stat-divider {
        align-self: stretch;
        width: 1px;
        background-color: var(--color-border);
    }

    /* --- Carrossel de parceiros: só logos, alto, sem texto --- */
    .trust-marquee-wrap {
        position: relative;
        height: 140px;
        overflow: hidden;
        -webkit-mask-image: linear-gradient(90deg,
                transparent 0,
                #000 8%,
                #000 92%,
                transparent 100%);
        mask-image: linear-gradient(90deg,
                transparent 0,
                #000 8%,
                #000 92%,
                transparent 100%);
    }

    .trust-marquee-track {
        --trust-logo-gap: 5rem;
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        align-items: center;
        height: 100%;
        width: max-content;
        gap: var(--trust-logo-gap);
        cursor: grab;
        touch-action: pan-y;
        user-select: none;
        will-change: transform;
    }

    .trust-marquee-track.is-dragging {
        cursor: grabbing;
    }

    .trust-logo {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 140px;
        height: 72px;
        color: var(--color-white);
        filter: grayscale(1) opacity(0.55);
        transition: filter 0.3s ease, transform 0.3s ease;
        -webkit-user-drag: none;
    }

    .trust-logo:hover {
        filter: grayscale(0) opacity(1);
        transform: translateY(-2px);
    }

    .trust-logo svg,
    .trust-logo img {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
        pointer-events: none;
    }

    /* Divisor hiper discreto entre cada logo, centralizado no meio do gap */
    .trust-logo:not(:first-child)::before {
        content: '';
        position: absolute;
        left: calc(var(--trust-logo-gap) / -2);
        top: 50%;
        transform: translateY(-50%);
        width: 1px;
        height: 28px;
        background-color: rgba(var(--color-white-rgb), 0.1);
    }

    @media (prefers-reduced-motion: reduce) {
        .trust-marquee-track {
            transition: none;
        }
    }

    @media (max-width: 900px) {
        .trust-grid {
            grid-template-columns: 1fr;
            gap: var(--space-xl);
        }

        .trust-stats-col {
            flex-wrap: wrap;
        }
    }

    @media (max-width: 600px) {
        .trust {
            margin-top: -48px;
            padding: calc(var(--space-xl) + 48px) 1.25rem var(--space-xl);
            clip-path: polygon(0 48px, 100% 0, 100% 100%, 0 100%);
        }

        .trust-stats-col {
            flex-direction: column;
            align-items: flex-start;
            gap: var(--space-md);
        }

        .trust-stat-divider {
            width: 100%;
            height: 1px;
        }

        .trust-marquee-wrap {
            height: 100px;
        }

        .trust-marquee-track {
            --trust-logo-gap: 3rem;
        }

        .trust-logo {
            width: 100px;
            height: 52px;
        }

        .trust-logo:not(:first-child)::before {
            height: 20px;
        }
    }
</style>

<script>
    (function () {
        // Canvas de radar com mockup de celular e telemetria — mesma linguagem
        // visual do fundo da Hero, adaptada às dimensões da seção Trust.
        function initTrustRadarCanvas() {
            const canvas = document.getElementById('trust-canvas');
            const section = document.getElementById('trust');
            if (!canvas || !section) return;
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

            const MOBILE_BREAKPOINT = 600;
            const MAX_DPR = 2;
            const rootStyles = getComputedStyle(document.documentElement);
            const RADAR_ACCENT_RGB = rootStyles.getPropertyValue('--color-orange-rgb').trim();
            const PHONE_BG_RGB = rootStyles.getPropertyValue('--color-dark-surface-rgb').trim();
            const RADAR_WHITE_RGB = '255, 255, 255';
            const FIELD_MARKER_FONT = '600 10.5px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            const RADAR_RING_FRACTIONS = [0.0012, 0.25, 0.40, 0.58, 0.76, 0.94, 1.0];
            const RADAR_PULSE_SPEED = 0.0005;
            const RADAR_ALPHA_LERP_FACTOR = 0.04;
            const RADAR_ALPHA_IDLE = 0.08;
            const RADAR_ALPHA_ACTIVE = 0.28;
            const RADAR_ALPHA_OBSTACLE = 0.12;
            const POINTER_LERP_FACTOR = 9.1;
            const POINTER_IDLE_MS = 1000;
            const PHONE_GLOW_DECAY = 9.02;

            const ctx = canvas.getContext('2d');
            let width = 0;
            let height = 0;
            let dpr = window.devicePixelRatio || 1;
            let animationFrameId = null;
            let isCanvasVisible = true;
            let isMobile = false;

            const mouse = { x: null, y: null, targetX: null, targetY: null, isNearObstacle: false, hasMoved: false };

            let phoneCenter = { x: 0, y: 0 };
            let phoneDim = { width: 78, height: 142, radius: 14 };
            let phoneSyncGlow = 0;
            let radarAlpha = 0.32;

            let pulses = [
                { progress: 0.05 },
                { progress: 0.28 },
                { progress: 0.52 },
                { progress: 0.76 }
            ];

            const technicalMetrics = ['6.4', '2.85', '230µm', '215/cm²', '110 L/ha', 'Estável', 'Baixa', '3.0 bar'];
            let metricIndex = 0;

            let phoneTelemetryList = [
                { label: 'pH', value: '6.4' },
                { label: 'Kow', value: '2.85' },
                { label: 'VMD', value: '230µm' },
                { label: 'Vazão', value: '110 L/h' },
                { label: 'Gotas', value: '215/cm²' }
            ];

            let fieldData = [];
            let lastSpawnPos = { x: 0, y: 0 };
            let lastSpawnTime = 0;
            let lastPointerMoveTime = 0;
            let lastWakeGlobalSpawnTime = 0;

            function resizeCanvas() {
                width = section.offsetWidth;
                height = section.offsetHeight;
                isMobile = width <= MOBILE_BREAKPOINT;
                dpr = isMobile ? 1 : Math.min(window.devicePixelRatio || 1, MAX_DPR);

                canvas.style.width = width + 'px';
                canvas.style.height = height + 'px';
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                if (isMobile) {
                    phoneDim = { width: 44, height: 78, radius: 7 };
                    phoneCenter.x = 18 + phoneDim.width / 2;
                    phoneCenter.y = height - phoneDim.height / 2 - 20;
                } else {
                    phoneDim = { width: 78, height: 142, radius: 14 };
                    phoneCenter.x = 42 + phoneDim.width / 2;
                    phoneCenter.y = height - phoneDim.height / 2 - 32;
                }

                if (mouse.x === null) {
                    mouse.x = width * 0.5;
                    mouse.y = height * 0.5;
                    mouse.targetX = mouse.x;
                    mouse.targetY = mouse.y;
                }
            }

            function spawnWaveWakeData(waveX, waveY, waveAngle) {
                const metric = technicalMetrics[metricIndex % technicalMetrics.length];
                metricIndex++;

                fieldData.push({
                    x: waveX,
                    y: waveY,
                    originX: waveX,
                    originY: waveY,
                    vx: Math.cos(waveAngle) * 0.12,
                    vy: -0.25,
                    text: metric,
                    fromWake: true,
                    life: 1.0,
                    decay: 0.0055
                });

                if (fieldData.length > 12) {
                    fieldData.shift();
                }
                phoneSyncGlow = 1.0;
            }

            function spawnFieldData(cursorX, cursorY) {
                const metric = technicalMetrics[metricIndex % technicalMetrics.length];
                metricIndex++;

                const angle = Math.random() * Math.PI * 2;
                const dist = 6 + Math.random() * 14;
                const startX = cursorX + Math.cos(angle) * dist;
                const startY = cursorY + Math.sin(angle) * dist;

                fieldData.push({
                    x: startX,
                    y: startY,
                    originX: startX,
                    originY: startY,
                    vx: (Math.random() - 0.5) * 0.25,
                    vy: -0.30 - Math.random() * 0.20,
                    text: metric,
                    fromWake: false,
                    life: 1.0,
                    decay: 0.007
                });

                if (fieldData.length > 12) {
                    fieldData.shift();
                }
                phoneSyncGlow = 1.0;
            }

            // Desenho do mockup de celular: motor compartilhado (js/radar-phone-widget.js)
            function drawSmartphone(cx, cy, alpha) {
                if (!window.drawRadarPhoneWidget) return;
                window.drawRadarPhoneWidget(ctx, {
                    cx, cy, alpha, phoneDim, phoneSyncGlow, phoneTelemetryList,
                    colors: { accentRgb: RADAR_ACCENT_RGB, bgRgb: PHONE_BG_RGB, whiteRgb: RADAR_WHITE_RGB }
                });
            }

            function updatePointerLerp() {
                if (mouse.targetX === null || mouse.targetY === null) return;
                mouse.x += (mouse.targetX - mouse.x) * POINTER_LERP_FACTOR;
                mouse.y += (mouse.targetY - mouse.y) * POINTER_LERP_FACTOR;
            }

            function updateGlowState() {
                const now = performance.now();
                const isIdle = (now - lastPointerMoveTime > POINTER_IDLE_MS);
                let targetAlpha = isIdle ? RADAR_ALPHA_IDLE : RADAR_ALPHA_ACTIVE;

                if (mouse.isNearObstacle) {
                    targetAlpha = RADAR_ALPHA_OBSTACLE;
                }

                radarAlpha += (targetAlpha - radarAlpha) * RADAR_ALPHA_LERP_FACTOR;

                if (phoneSyncGlow > 0) {
                    phoneSyncGlow = Math.max(0, phoneSyncGlow - PHONE_GLOW_DECAY);
                }
            }

            function drawRadarRings(px, py, radarRadius) {
                for (const frac of RADAR_RING_FRACTIONS) {
                    const r = radarRadius * frac;
                    ctx.beginPath();
                    ctx.arc(px, py, r, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(${RADAR_ACCENT_RGB}, ${0.20 * radarAlpha})`;
                    ctx.lineWidth = 0.8;
                    ctx.setLineDash(frac === 1.0 || frac === 0.58 ? [4, 8] : [2, 6]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }

            function drawRadarPulses(px, py, radarRadius) {
                const now = performance.now();

                for (let i = 0; i < pulses.length; i++) {
                    const p = pulses[i];
                    p.progress += RADAR_PULSE_SPEED;
                    if (p.progress > 1.0) {
                        p.progress = 0;
                    }

                    const pRadius = radarRadius * p.progress;
                    let waveAlpha = (1 - p.progress) * 0.70 * radarAlpha;
                    if (p.progress < 0.06) {
                        waveAlpha *= (p.progress / 0.06);
                    }

                    const bandWidth = Math.max(10, 24 * (1 - p.progress * 0.3));
                    const innerRadius = Math.max(0, pRadius - bandWidth * 0.5);
                    const outerRadius = pRadius + bandWidth * 0.5;

                    ctx.save();
                    const distGrad = ctx.createRadialGradient(px, py, innerRadius, px, py, outerRadius);
                    distGrad.addColorStop(0, `rgba(${RADAR_ACCENT_RGB}, 0)`);
                    distGrad.addColorStop(0.35, `rgba(${RADAR_ACCENT_RGB}, ${0.04 * waveAlpha})`);
                    distGrad.addColorStop(0.5, `rgba(255, 255, 255, ${0.08 * waveAlpha})`);
                    distGrad.addColorStop(0.65, `rgba(${RADAR_ACCENT_RGB}, ${0.02 * waveAlpha})`);
                    distGrad.addColorStop(1, `rgba(${RADAR_ACCENT_RGB}, 0)`);

                    ctx.beginPath();
                    ctx.arc(px, py, outerRadius, 0, Math.PI * 2);
                    ctx.fillStyle = distGrad;
                    ctx.fill();
                    ctx.restore();

                    ctx.beginPath();
                    ctx.arc(px, py, pRadius, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(${RADAR_ACCENT_RGB}, ${waveAlpha * 0.75})`;
                    ctx.lineWidth = Math.max(0.7, 1.3 * (1 - p.progress * 0.5));
                    ctx.stroke();
                }

                if (now - lastWakeGlobalSpawnTime > 1200) {
                    const activePulses = pulses.filter(p => p.progress >= 0.15 && p.progress <= 0.75);
                    if (activePulses.length > 0) {
                        const chosenPulse = activePulses[Math.floor(Math.random() * activePulses.length)];
                        const pRadius = radarRadius * chosenPulse.progress;

                        const angles = [-1.35, -1.10, -0.85, -0.60, -0.35, -0.10, 0.08];
                        const angle = angles[Math.floor(Math.random() * angles.length)] + (Math.random() - 0.5) * 0.12;
                        const spawnX = px + Math.cos(angle) * pRadius;
                        const spawnY = py + Math.sin(angle) * pRadius;

                        if (spawnX > 40 && spawnX < width - 60 && spawnY > 60 && spawnY < height - 40) {
                            spawnWaveWakeData(spawnX, spawnY, angle);
                            lastWakeGlobalSpawnTime = now;
                        }
                    }
                }
            }

            function drawPointerMarker() {
                const markerAlpha = Math.max(0.55, radarAlpha);

                ctx.save();
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, 5.0, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(${RADAR_ACCENT_RGB}, ${0.75 * markerAlpha})`;
                ctx.lineWidth = 1.0;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, 1.6, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${RADAR_ACCENT_RGB}, ${0.90 * markerAlpha})`;
                ctx.fill();
                ctx.restore();
            }

            function drawFieldMarker(item) {
                let itemOpacity = 1.0;
                if (item.life > 0.8) {
                    itemOpacity = (1.0 - item.life) / 0.2;
                } else if (item.life < 0.25) {
                    itemOpacity = item.life / 0.25;
                }

                const currentAlpha = itemOpacity * (mouse.isNearObstacle ? 0.55 : 0.90) * radarAlpha;
                if (currentAlpha <= 0.01) return;

                ctx.save();

                if (item.fromWake && item.originY) {
                    const wakeAge = 1.0 - item.life;
                    if (wakeAge < 0.35) {
                        const pingRadius = 2.5 + wakeAge * 18;
                        const pingAlpha = (1.0 - wakeAge / 0.35) * 0.55 * currentAlpha;
                        ctx.beginPath();
                        ctx.arc(item.originX, item.originY, pingRadius, 0, Math.PI * 2);
                        ctx.strokeStyle = `rgba(${RADAR_ACCENT_RGB}, ${pingAlpha})`;
                        ctx.lineWidth = 0.7;
                        ctx.stroke();
                    }

                    ctx.beginPath();
                    ctx.moveTo(item.originX, item.originY);
                    ctx.lineTo(item.x, item.y);
                    ctx.strokeStyle = `rgba(${RADAR_ACCENT_RGB}, ${0.22 * currentAlpha})`;
                    ctx.lineWidth = 0.5;
                    ctx.setLineDash([2, 2]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                ctx.beginPath();
                ctx.arc(item.x, item.y, 2.4, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${RADAR_ACCENT_RGB}, ${0.90 * currentAlpha})`;
                if (!isMobile) {
                    ctx.shadowColor = `rgba(${RADAR_ACCENT_RGB}, 0.6)`;
                    ctx.shadowBlur = 4;
                }
                ctx.fill();

                ctx.beginPath();
                ctx.arc(item.x, item.y, 5 + (1 - item.life) * 3.5, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(${RADAR_ACCENT_RGB}, ${0.45 * currentAlpha})`;
                ctx.lineWidth = 0.6;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(item.x + 3, item.y);
                ctx.lineTo(item.x + 11, item.y);
                ctx.strokeStyle = `rgba(${RADAR_ACCENT_RGB}, ${0.55 * currentAlpha})`;
                ctx.lineWidth = 0.6;
                ctx.stroke();

                ctx.font = FIELD_MARKER_FONT;
                const textMetrics = ctx.measureText(item.text);
                const textWidth = textMetrics.width;
                const pillPaddingH = 5.5;
                const pillHeight = 17;
                const pillX = item.x + 13;
                const pillY = item.y - pillHeight / 2;

                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(pillX, pillY, textWidth + pillPaddingH * 2, pillHeight, 3);
                } else {
                    ctx.rect(pillX, pillY, textWidth + pillPaddingH * 2, pillHeight);
                }
                ctx.fillStyle = `rgba(${PHONE_BG_RGB}, ${0.75 * currentAlpha})`;
                ctx.fill();
                ctx.strokeStyle = `rgba(${RADAR_ACCENT_RGB}, ${0.45 * currentAlpha})`;
                ctx.lineWidth = 0.7;
                ctx.stroke();

                ctx.fillStyle = `rgba(${RADAR_WHITE_RGB}, ${0.95 * currentAlpha})`;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(item.text, pillX + pillPaddingH, item.y + 0.5);
                ctx.restore();
            }

            function drawFieldMarkers() {
                for (let i = fieldData.length - 1; i >= 0; i--) {
                    const item = fieldData[i];
                    item.x += item.vx || 0;
                    item.y += item.vy || 0;
                    item.life -= item.decay;

                    if (item.life <= 0) {
                        fieldData.splice(i, 1);
                        continue;
                    }

                    drawFieldMarker(item);
                }
            }

            function updateMobileRandomTelemetry() {
                if (width <= MOBILE_BREAKPOINT) {
                    const now = performance.now();
                    if (now - lastSpawnTime > 2800) {
                        const randX = width * (0.15 + Math.random() * 0.7);
                        const randY = height * (0.2 + Math.random() * 0.5);
                        spawnFieldData(randX, randY);
                        lastSpawnPos.x = randX;
                        lastSpawnPos.y = randY;
                        lastSpawnTime = now;
                    }
                }
            }

            function draw() {
                if (!isCanvasVisible) {
                    animationFrameId = requestAnimationFrame(draw);
                    return;
                }

                ctx.clearRect(0, 0, width, height);
                updatePointerLerp();
                updateGlowState();

                const px = phoneCenter.x;
                const py = phoneCenter.y;
                const radarRadius = Math.hypot(width, height) * 1.25;

                if (radarAlpha > 0.01) {
                    drawRadarRings(px, py, radarRadius);
                    drawRadarPulses(px, py, radarRadius);

                    drawSmartphone(px, py, radarAlpha);

                    if (mouse.hasMoved && mouse.x !== null && mouse.y !== null && width > MOBILE_BREAKPOINT) {
                        drawPointerMarker();
                    }
                }

                drawFieldMarkers();
                updateMobileRandomTelemetry();

                animationFrameId = requestAnimationFrame(draw);
            }

            function onPointerMove(e) {
                if (width <= MOBILE_BREAKPOINT || !isCanvasVisible) return;

                const rect = section.getBoundingClientRect();
                const clientX = e.clientX;
                const clientY = e.clientY;

                if (clientY <= rect.bottom && clientY >= rect.top) {
                    lastPointerMoveTime = performance.now();
                    mouse.targetX = clientX - rect.left;
                    mouse.targetY = clientY - rect.top;
                    mouse.hasMoved = true;

                    const targetElement = document.elementFromPoint(clientX, clientY);
                    if (targetElement) {
                        const isObstacle = targetElement.closest('a, button, .trust-badge-col, .trust-stats-col, h2, p, .trust-marquee-wrap, input, select, textarea');
                        mouse.isNearObstacle = !!isObstacle || clientY < 80;
                    }

                    const now = performance.now();
                    const distMoved = Math.hypot(mouse.targetX - lastSpawnPos.x, mouse.targetY - lastSpawnPos.y);

                    if ((distMoved > 55 && now - lastSpawnTime > 400) && !mouse.isNearObstacle) {
                        spawnFieldData(mouse.targetX, mouse.targetY);
                        lastSpawnPos.x = mouse.targetX;
                        lastSpawnPos.y = mouse.targetY;
                        lastSpawnTime = now;
                    }
                }
            }

            window.addEventListener('mousemove', onPointerMove, { passive: true });
            window.addEventListener('resize', resizeCanvas, { passive: true });

            const observer = new IntersectionObserver(([entry]) => {
                isCanvasVisible = entry.isIntersecting;
                if (isCanvasVisible && !animationFrameId) {
                    animationFrameId = requestAnimationFrame(draw);
                }
            }, { threshold: 0.05 });
            observer.observe(section);

            resizeCanvas();
            draw();
        }

        // Carrossel de parceiros: rolagem automática contínua via requestAnimationFrame,
        // que pode ser controlada com o mouse (arrastar) e retoma sozinha ao soltar.
        function initTrustMarquee() {
            const wrap = document.querySelector('.trust-marquee-wrap');
            const track = document.getElementById('trust-marquee-track');
            if (!wrap || !track) return;

            const AUTO_SPEED = 0.5; // px por frame
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            let offset = 0;
            let setWidth = 0;
            let isDragging = false;
            let dragMoved = false;
            let dragStartX = 0;
            let dragStartOffset = 0;

            function measure() {
                setWidth = track.scrollWidth / 2;
            }

            function applyTransform() {
                if (setWidth > 0) {
                    offset = ((offset % setWidth) + setWidth) % setWidth;
                }
                track.style.transform = `translateX(${-offset}px)`;
            }

            function tick() {
                if (!isDragging) {
                    offset += AUTO_SPEED;
                    applyTransform();
                }
                requestAnimationFrame(tick);
            }

            function onPointerDown(e) {
                isDragging = true;
                dragMoved = false;
                dragStartX = e.clientX;
                dragStartOffset = offset;
                track.classList.add('is-dragging');
                track.setPointerCapture(e.pointerId);
            }

            function onPointerMove(e) {
                if (!isDragging) return;
                const dx = e.clientX - dragStartX;
                if (Math.abs(dx) > 4) dragMoved = true;
                offset = dragStartOffset - dx;
                applyTransform();
            }

            function endDrag() {
                if (!isDragging) return;
                isDragging = false;
                track.classList.remove('is-dragging');
            }

            track.addEventListener('pointerdown', onPointerDown);
            track.addEventListener('pointermove', onPointerMove);
            track.addEventListener('pointerup', endDrag);
            track.addEventListener('pointercancel', endDrag);

            // Evita que o clique no link do logo dispare após um arraste real
            track.addEventListener('click', (e) => {
                if (dragMoved) {
                    e.preventDefault();
                    e.stopPropagation();
                }
            }, true);

            window.addEventListener('resize', measure, { passive: true });

            measure();
            if (reduceMotion) return;
            requestAnimationFrame(tick);
        }

        if (window.componentLoader) {
            window.addEventListener('components:ready', () => {
                initTrustRadarCanvas();
                initTrustMarquee();
            }, { once: true });
        } else {
            window.addEventListener('load', () => {
                initTrustRadarCanvas();
                initTrustMarquee();
            });
        }
    })();
</script>
