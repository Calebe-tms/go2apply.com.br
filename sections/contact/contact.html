<!-- ==========================================================================
   Seção: Contact
   Fundo com o mesmo carrossel de vídeo da Hero, rolando normalmente com a
   seção. Dois cartões em vidro: canais de contato e um formulário que
   monta uma mensagem pronta para o WhatsApp.
   ========================================================================== -->
<style>
    .contact {
        position: relative;
        width: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        padding: var(--space-2xl) 1.5rem;
        overflow: hidden;
        color: var(--color-white);
    }

    .contact-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background-color: var(--color-dark);
    }

    .contact-bg-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 1;
        /* Vibrance simulada: aumenta saturação e contraste sem estourar os brilhos */
        filter: saturate(1.35) contrast(1.08);
    }

    .contact-bg-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg,
                rgba(var(--color-dark-rgb), 0.65) 0%,
                rgba(var(--color-dark-rgb), 0.35) 50%,
                rgba(var(--color-dark-rgb), 0.7) 100%);
    }

    .contact-inner {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 0.85fr 1.15fr;
        gap: var(--space-lg);
        align-items: stretch;
    }

    .contact-card {
        position: relative;
        border-radius: var(--radius-lg);
        border: 1px solid var(--color-border-subtle);
        background-color: rgba(var(--color-dark-surface-rgb), 0.7);
        backdrop-filter: var(--blur-glass);
        -webkit-backdrop-filter: var(--blur-glass);
        padding: var(--space-xl);
        box-shadow: var(--shadow-lg);
    }

    .contact-card-title {
        font-family: var(--font-main);
        font-weight: 800;
        font-size: var(--font-size-lg);
        margin: 0 0 var(--space-xs);
    }

    .contact-card-support {
        color: var(--color-white-muted);
        font-size: var(--font-size-sm);
        line-height: 1.55;
        margin: 0 0 var(--space-lg);
    }

    /* --- Cartão: canais de contato --- */
    .contact-card--info {
        display: flex;
        flex-direction: column;
    }

    .contact-info-list {
        display: flex;
        flex-direction: column;
        gap: var(--space-md);
        padding: 0;
        margin: var(--space-sm) 0 var(--space-xl);
        list-style: none;
    }

    .contact-info-list li,
    .contact-info-list a {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        color: var(--color-white-muted);
        font-size: var(--font-size-sm);
        transition: color 0.25s ease;
    }

    .contact-info-list a:hover {
        color: var(--color-orange);
    }

    .contact-info-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        flex-shrink: 0;
        border-radius: var(--radius-btn);
        background-color: rgba(var(--color-white-rgb), 0.06);
        color: var(--color-orange);
    }

    .contact-social {
        display: flex;
        gap: var(--space-xs);
        margin-top: auto;
    }

    .contact-social a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: var(--radius-btn);
        color: var(--color-white-muted);
        background-color: rgba(var(--color-white-rgb), 0.06);
        transition: var(--transition-smooth);
    }

    .contact-social a:hover {
        color: var(--color-dark);
        background-color: var(--color-orange);
        transform: translateY(-2px);
    }

    /* --- Cartão: formulário --- */
    .contact-form {
        display: flex;
        flex-direction: column;
        gap: var(--space-md);
    }

    .contact-field {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
    }

    .contact-field label {
        color: var(--color-white-muted);
        font-size: var(--font-size-xs);
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
    }

    .contact-field input,
    .contact-field textarea {
        font-family: var(--font-main);
        font-size: var(--font-size-base);
        color: var(--color-white);
        background-color: rgba(var(--color-white-rgb), 0.06);
        border: 1px solid var(--color-border-subtle);
        border-radius: var(--radius-btn);
        padding: 0.75rem 1rem;
        transition: var(--transition-fast);
    }

    .contact-field textarea {
        min-height: 96px;
        resize: vertical;
        font-family: inherit;
    }

    .contact-field input::placeholder,
    .contact-field textarea::placeholder {
        color: rgba(var(--color-white-rgb), 0.35);
    }

    .contact-field input:focus,
    .contact-field textarea:focus {
        outline: none;
        border-color: var(--color-orange);
        background-color: rgba(var(--color-white-rgb), 0.1);
    }

    .contact-submit {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        background-color: var(--color-orange);
        color: var(--color-dark);
        font-family: var(--font-main);
        font-weight: 700;
        font-size: var(--font-size-base);
        padding: 0.85rem 1.75rem;
        border: none;
        border-radius: var(--radius-btn);
        cursor: pointer;
        white-space: nowrap;
        transition: var(--transition-smooth);
    }

    .contact-submit:hover {
        background-color: var(--color-orange-hover);
        transform: translateY(-2px);
    }

    .contact-submit:active {
        transform: translateY(0) scale(0.98);
    }

    @media (max-width: 900px) {
        .contact-inner {
            grid-template-columns: 1fr;
        }

        .contact-card--info {
            order: 2;
        }

        .contact-social {
            margin-top: var(--space-lg);
        }
    }

    @media (max-width: 600px) {
        .contact {
            padding: var(--space-xl) 1.25rem;
        }

        .contact-card {
            padding: var(--space-lg);
        }
    }
</style>

<section class="contact" id="contact">
    <div class="contact-bg" id="contact-bg">
        <video id="contact-video-1" class="contact-bg-video" muted playsinline autoplay></video>
        <div class="contact-bg-overlay"></div>
    </div>

    <div class="contact-inner">
        <div class="contact-card contact-card--info">
            <h2 class="contact-card-title">Fale Conosco</h2>
            <p class="contact-card-support">Estamos por perto para tirar dúvidas sobre a plataforma.</p>

            <ul class="contact-info-list">
                <li>
                    <span class="contact-info-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
                            <circle cx="12" cy="10" r="3" />
                        </svg>
                    </span>
                    <span>Brasil</span>
                </li>
                <li>
                    <a href="mailto:contato@go2apply.com.br">
                        <span class="contact-info-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="2" y="4" width="20" height="16" rx="3" />
                                <path d="m3 7 9 6 9-6" />
                            </svg>
                        </span>
                        <span>contato@go2apply.com.br</span>
                    </a>
                </li>
                <li>
                    <a href="https://wa.me/5500000000000" target="_blank" rel="noopener noreferrer">
                        <span class="contact-info-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
                            </svg>
                        </span>
                        <span>+55 00 00000-0000</span>
                    </a>
                </li>
            </ul>

            <div class="contact-social">
                <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                    </svg>
                </a>
                <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
                        <rect x="2" y="9" width="4" height="12"></rect>
                        <circle cx="4" cy="4" r="2"></circle>
                    </svg>
                </a>
                <a href="https://t.me" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 2 11 13"></path>
                        <path d="M22 2 15 22l-4-9-9-4 20-7z"></path>
                    </svg>
                </a>
            </div>
        </div>

        <div class="contact-card contact-card--form">
            <h2 class="contact-card-title">Vamos Conversar</h2>
            <p class="contact-card-support">Preencha os campos abaixo. Vamos abrir o WhatsApp com sua mensagem pronta para enviar.</p>

            <form class="contact-form" id="contact-form">
                <div class="contact-field">
                    <label for="contact-name">Nome</label>
                    <input type="text" id="contact-name" name="nome" placeholder="Seu nome completo" required>
                </div>
                <div class="contact-field">
                    <label for="contact-email">E-mail</label>
                    <input type="email" id="contact-email" name="email" placeholder="seu@email.com" required>
                </div>
                <div class="contact-field">
                    <label for="contact-message">Mensagem</label>
                    <textarea id="contact-message" name="mensagem" placeholder="Como podemos ajudar?" required></textarea>
                </div>
                <button type="submit" class="contact-submit">
                    Enviar
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14M12 5l7 7-7 7" />
                    </svg>
                </button>
            </form>
        </div>
    </div>
</section>

<script>
(function () {
    const CONTACT_VIDEOS = [
        'https://res.cloudinary.com/vdgkx5jc/video/upload/v1788230093/Tk-1.webm',
        'https://res.cloudinary.com/vdgkx5jc/video/upload/v1788230096/Tk-2-0615-P1.webm',
        'https://res.cloudinary.com/vdgkx5jc/video/upload/v1788230093/Tk-3-0988.webm',
        'https://res.cloudinary.com/vdgkx5jc/video/upload/v1788230094/Tk-4-0615-P1.webm'
    ];

    function initContactVideoCarousel() {
        if (!window.createVideoCarousel) return;
        window.createVideoCarousel({
            videoId: 'contact-video-1',
            urls: CONTACT_VIDEOS
        });
    }

    function initWhatsAppForm() {
        const form = document.getElementById('contact-form');
        if (!form) return;

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const nome = form.nome.value.trim();
            const email = form.email.value.trim();
            const mensagem = form.mensagem.value.trim();

            const texto = `Olá! Meu nome é ${nome} (${email}).\n\n${mensagem}`;
            const url = `https://wa.me/5500000000000?text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank', 'noopener,noreferrer');
        });
    }

    function initScrollReveal() {
        if (!window.gsap || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        if (window.ScrollTrigger) gsap.registerPlugin(ScrollTrigger);

        gsap.from('.contact-card--info', {
            opacity: 0,
            x: -30,
            duration: 0.8,
            ease: 'power3.out',
            scrollTrigger: window.ScrollTrigger ? { trigger: '#contact', start: 'top 70%' } : undefined
        });

        gsap.from('.contact-card--form', {
            opacity: 0,
            x: 30,
            duration: 0.8,
            delay: 0.1,
            ease: 'power3.out',
            scrollTrigger: window.ScrollTrigger ? { trigger: '#contact', start: 'top 70%' } : undefined
        });
    }

    initContactVideoCarousel();
    initWhatsAppForm();

    if (window.componentLoader) {
        window.addEventListener('components:ready', initScrollReveal, { once: true });
    } else {
        window.addEventListener('load', initScrollReveal);
    }
})();
</script>
