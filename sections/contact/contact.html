<!-- ==========================================================================
   Seção: Contact
   Fundo com o mesmo carrossel de vídeo da Hero, rolando normalmente com a
   seção. Dois cartões em vidro: canais de contato e um mapa com a
   localização do escritório.
   ========================================================================== -->
<style>
    .contact {
        position: relative;
        width: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        padding: var(--space-2xl) 1.5rem;
        overflow: hidden;
        color: var(--color-white);
    }

    .contact-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background-color: var(--color-dark);
    }

    .contact-bg-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 1;
        /* Vibrance simulada: aumenta saturação e contraste sem estourar os brilhos */
        filter: saturate(1.35) contrast(1.08);
    }

    .contact-bg-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg,
                rgba(var(--color-dark-rgb), 0.65) 0%,
                rgba(var(--color-dark-rgb), 0.35) 50%,
                rgba(var(--color-dark-rgb), 0.7) 100%);
    }

    .contact-inner {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 0.85fr 1.15fr;
        gap: var(--space-lg);
        align-items: stretch;
    }

    .contact-card {
        position: relative;
        border-radius: var(--radius-lg);
        border: 1px solid var(--color-border-subtle);
        background-color: rgba(var(--color-dark-surface-rgb), 0.7);
        backdrop-filter: var(--blur-glass);
        -webkit-backdrop-filter: var(--blur-glass);
        padding: var(--space-xl);
        box-shadow: var(--shadow-lg);
    }

    .contact-card-title {
        font-family: var(--font-main);
        font-weight: 800;
        font-size: var(--font-size-lg);
        margin: 0 0 var(--space-xs);
    }

    .contact-card-support {
        color: var(--color-white-muted);
        font-size: var(--font-size-sm);
        line-height: 1.55;
        margin: 0 0 var(--space-lg);
    }

    /* --- Cartão: canais de contato --- */
    .contact-card--info {
        display: flex;
        flex-direction: column;
    }

    .contact-info-list {
        display: flex;
        flex-direction: column;
        gap: var(--space-md);
        padding: 0;
        margin: var(--space-sm) 0 var(--space-xl);
        list-style: none;
    }

    .contact-info-list li,
    .contact-info-list a {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        color: var(--color-white-muted);
        font-size: var(--font-size-sm);
        transition: color 0.25s ease;
    }

    .contact-info-list a:hover {
        color: var(--color-orange);
    }

    .contact-info-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        flex-shrink: 0;
        border-radius: var(--radius-btn);
        background-color: rgba(var(--color-white-rgb), 0.06);
        color: var(--color-orange);
    }

    .contact-social {
        display: flex;
        gap: var(--space-xs);
        margin-top: auto;
    }

    /* --- Cartão: mapa --- */
    .contact-card--map {
        display: flex;
        flex-direction: column;
    }

    .contact-map-frame {
        flex: 1;
        width: 100%;
        min-height: 260px;
        border: 0;
        border-radius: var(--radius-md);
        filter: grayscale(0.2) contrast(1.05);
    }

    @media (max-width: 992px) {
        .contact-inner {
            grid-template-columns: 1fr;
        }

        .contact-card--info {
            order: 2;
        }

        .contact-social {
            margin-top: var(--space-lg);
        }
    }

    @media (max-width: 600px) {
        .contact {
            padding: var(--space-xl) 1.25rem;
        }

        .contact-card {
            padding: var(--space-lg);
        }
    }
</style>

<section class="contact" id="contact">
    <div class="contact-bg" id="contact-bg">
        <video id="contact-video-1" class="contact-bg-video" muted playsinline autoplay
            poster="https://res.cloudinary.com/vdgkx5jc/video/upload/so_0,w_960,q_50,f_jpg/v1788029484/bg-1.jpg"></video>
        <div class="contact-bg-overlay"></div>
    </div>

    <div class="contact-inner">
        <div class="contact-card contact-card--info">
            <h2 class="contact-card-title">Fale Conosco</h2>
            <p class="contact-card-support">Estamos por perto para tirar dúvidas sobre a plataforma.</p>

            <ul class="contact-info-list">
                <li>
                    <span class="contact-info-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
                            <circle cx="12" cy="10" r="3" />
                        </svg>
                    </span>
                    <span>R. General Osório, 117 - Sala 03 - Centro, Cruz Alta - RS, 98005-150</span>
                </li>
                <li>
                    <a href="mailto:contato@go2apply.com.br">
                        <span class="contact-info-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="2" y="4" width="20" height="16" rx="3" />
                                <path d="m3 7 9 6 9-6" />
                            </svg>
                        </span>
                        <span>contato@go2apply.com.br</span>
                    </a>
                </li>
                <li>
                    <a href="https://wa.me/555533432606" target="_blank" rel="noopener noreferrer">
                        <span class="contact-info-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path
                                    d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
                            </svg>
                        </span>
                        <span>+55 55 3343-2606</span>
                    </a>
                </li>
            </ul>

            <div class="contact-social">
                <div data-component="components/social-links/social-links.html"></div>
            </div>
        </div>

        <div class="contact-card contact-card--map">
            <h2 class="contact-card-title">Nossa Localização</h2>
            <p class="contact-card-support">Visite nosso escritório em Cruz Alta - RS.</p>

            <iframe class="contact-map-frame"
                src="https://www.google.com/maps?q=R.%20General%20Os%C3%B3rio%2C%20117%20-%20Sala%2003%20-%20Centro%2C%20Cruz%20Alta%20-%20RS%2C%2098005-150&output=embed"
                loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen
                title="Mapa com a localização do go2apply"></iframe>
        </div>
    </div>
</section>

<script>
    (function () {
        const CONTACT_VIDEOS = [
            'https://res.cloudinary.com/vdgkx5jc/video/upload/v1788230093/Tk-1.webm',
            'https://res.cloudinary.com/vdgkx5jc/video/upload/v1788230096/Tk-2-0615-P1.webm',
            'https://res.cloudinary.com/vdgkx5jc/video/upload/v1788230093/Tk-3-0988.webm',
            'https://res.cloudinary.com/vdgkx5jc/video/upload/v1788230094/Tk-4-0615-P1.webm'
        ];

        function initContactVideoCarousel() {
            if (!window.createVideoCarousel) return;
            window.createVideoCarousel({
                videoId: 'contact-video-1',
                urls: CONTACT_VIDEOS
            });
        }

        function initScrollReveal() {
            if (!window.gsap || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            if (window.ScrollTrigger) gsap.registerPlugin(ScrollTrigger);

            gsap.from('.contact-card--info', {
                opacity: 0,
                x: -30,
                duration: 0.8,
                ease: 'power3.out',
                scrollTrigger: window.ScrollTrigger ? { trigger: '#contact', start: 'top 70%' } : undefined
            });

            gsap.from('.contact-card--map', {
                opacity: 0,
                x: 30,
                duration: 0.8,
                delay: 0.1,
                ease: 'power3.out',
                scrollTrigger: window.ScrollTrigger ? { trigger: '#contact', start: 'top 70%' } : undefined
            });
        }

        initContactVideoCarousel();

        onComponentsReady(initScrollReveal);
    })();
</script>
