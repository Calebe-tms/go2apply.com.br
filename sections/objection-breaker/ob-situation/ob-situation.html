<!-- ==========================================================================
   Subcomponente: OB — Situation
   Lista de 5 situações de campo com seus respectivos ícones originais.
   ========================================================================== -->
<style>
    .ob-situation {
        position: relative;
        padding-left: var(--space-lg);
        padding-right: var(--space-md);
    }

    .ob-situations-bg {
        position: absolute;
        right: -32%;
        bottom: -10%;
        width: min(450px, 75%);
        aspect-ratio: 383.16275 / 112.35217;
        background-color: var(--color-orange-subtle);
        -webkit-mask-image: url('assets/icos/pulverrizacao-bg.svg');
        mask-image: url('assets/icos/pulverrizacao-bg.svg');
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        pointer-events: none;
        z-index: 0;
    }

    .ob-situations {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 2.25rem;
        margin: 0;
        padding: 0;
        list-style: none;
    }

    .ob-situation {
        display: flex;
        flex-direction: row-reverse;
        align-items: center;
        justify-content: flex-start;
        gap: var(--space-md);
        padding: 0.25rem 0;
        text-align: right;
    }

    .ob-situation-icon {
        display: flex;
        width: 48px;
        height: 48px;
        flex-shrink: 0;
        background-color: var(--color-orange);
        -webkit-mask-image: var(--icon-mask);
        mask-image: var(--icon-mask);
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
    }

    .ob-situation-text {
        color: var(--color-white);
        font-weight: 700;
        font-size: clamp(1.05rem, 1.25vw, 1.35rem);
        line-height: 1.35;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        text-align: right;
        flex: 1;
    }

    @media (max-width: 992px) {
        .ob-situations-bg {
            display: none !important;
        }

        .ob-situation {
            padding: 0;
        }

        .ob-situations {
            gap: 1.15rem;
        }

        .ob-situation {
            flex-direction: row-reverse;
            gap: var(--space-sm);
            padding: 0.15rem 0;
            text-align: right;
        }

        .ob-situation-icon {
            width: 36px;
            height: 36px;
        }

        .ob-situation-text {
            font-size: clamp(0.88rem, 0.95vw, 1.05rem);
            text-align: right;
        }
    }
</style>

<div class="ob-situation" id="ob-situation">
    <div class="ob-situations-bg" aria-hidden="true"></div>
    <ul class="ob-situations">
        
        <!-- 1. Regulagem inadequada (Engrenagens) -->
        <li class="ob-situation">
            <span class="ob-situation-icon" style="--icon-mask: url('assets/icos/ico-situation-engrenagens.svg')"></span>
            <span class="ob-situation-text">Regulagem inadequada.</span>
        </li>

        <!-- 2. Condição ambiental ignorada (Nuvem / Clima) -->
        <li class="ob-situation">
            <span class="ob-situation-icon" style="--icon-mask: url('assets/icos/ico-situation-clima.svg')"></span>
            <span class="ob-situation-text">Condição ambiental ignorada.</span>
        </li>

        <!-- 3. Conta feita às pressas (Calculadora / Prancheta) -->
        <li class="ob-situation">
            <span class="ob-situation-icon" style="--icon-mask: url('assets/icos/ico-situation-calculadora.svg')"></span>
            <span class="ob-situation-text">Conta feita às pressas.</span>
        </li>

        <!-- 4. Incompatibilidade na calda (Frasco de Reativo) -->
        <li class="ob-situation">
            <span class="ob-situation-icon" style="--icon-mask: url('assets/icos/ico-situation-frasco.svg')"></span>
            <span class="ob-situation-text">Incompatibilidade na calda.</span>
        </li>

        <!-- 5. Aplicação que poderia ter sido mais eficiente (Bico/Alvo de Pulverização) -->
        <li class="ob-situation">
            <span class="ob-situation-icon" style="--icon-mask: url('assets/icos/ico-situation-bico-pulverizacao.svg')"></span>
            <span class="ob-situation-text">Aplicação que poderia ter sido mais eficiente.</span>
        </li>

    </ul>
</div>
