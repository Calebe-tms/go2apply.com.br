<!-- ==========================================================================
   Seção Orquestradora: Objection Breaker
   Organiza os subcomponentes em layouts otimizados para Desktop e Mobile.
   Desktop: Headline (Topo Centralizado) -> Grid 50/50 (Situation + Breaker) -> Example
   Mobile:  Headline -> Situation -> Example (3 Cards) -> Breaker
   ========================================================================== -->
<style>
    .objection-breaker {
        position: relative;
        width: 100%;
        padding: var(--space-2xl) 0 calc(var(--space-2xl) + var(--space-lg));
        background-color: var(--color-dark);
        overflow: hidden;
    }

    .ob-inner {
        width: min(var(--container-width), 100%);
        margin: 0 auto;
        padding: 0 1.5rem;
        box-sizing: border-box;
    }

    /* Container flexível principal com ordenação */
    .ob-flex-container {
        display: flex;
        flex-direction: column;
        gap: var(--space-2xl);
    }

    .ob-slot-headline {
        order: 1;
    }

    .ob-slot-grid {
        order: 2;
    }

    .ob-slot-example {
        order: 3;
    }

    /* Grid 50/50 no Desktop */
    .ob-grid-50-50 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--space-2xl);
        align-items: center;
    }

    /* Responsividade Mobile: Ordem Headline -> Situation -> Example -> Breaker */
    @media (max-width: 992px) {
        .objection-breaker {
            padding: var(--space-xl) 0;
        }

        .ob-flex-container {
            gap: var(--space-xl);
        }

        /* Desfaz o container intermediário para colocar situation, example e breaker no mesmo nível de flex */
        .ob-grid-50-50 {
            display: contents;
        }

        .ob-slot-headline {
            order: 1;
        }

        .ob-slot-situation {
            order: 2;
        }

        .ob-slot-example {
            order: 3;
        }

        .ob-slot-breaker {
            order: 4;
        }
    }
</style>

<section class="objection-breaker" id="objection-breaker">
    <div class="ob-inner">
        <div class="ob-flex-container">

            <!-- Headline Centralizada no topo em full width -->
            <div class="ob-slot-headline" data-component="sections/objection-breaker/ob-headline/ob-headline.html">
            </div>

            <!-- Grid 50/50 no Desktop (Situation + Breaker) -->
            <div class="ob-grid-50-50 ob-slot-grid">
                <div class="ob-slot-situation"
                    data-component="sections/objection-breaker/ob-situation/ob-situation.html"></div>
                <div class="ob-slot-breaker" data-component="sections/objection-breaker/ob-breaker/ob-breaker.html">
                </div>
            </div>

        </div>
    </div>
</section>

<script>
    (function () {
        function initObjectionBreakerReveal() {
            if (!window.gsap || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            if (window.ScrollTrigger) gsap.registerPlugin(ScrollTrigger);

            gsap.from('.ob-headline', {
                opacity: 0,
                y: 30,
                duration: 0.8,
                ease: 'power3.out',
                scrollTrigger: window.ScrollTrigger ? { trigger: '#objection-breaker', start: 'top 75%' } : undefined
            });

            gsap.from('#ob-situation .ob-situations li', {
                opacity: 0,
                x: 30,
                duration: 0.6,
                ease: 'power3.out',
                stagger: 0.1,
                scrollTrigger: window.ScrollTrigger ? { trigger: '#ob-situation', start: 'top 80%' } : undefined
            });

            gsap.from('#ob-breaker > *', {
                opacity: 0,
                y: 20,
                duration: 0.7,
                ease: 'power3.out',
                stagger: 0.12,
                scrollTrigger: window.ScrollTrigger ? { trigger: '#ob-breaker', start: 'top 80%' } : undefined
            });
        }

        onComponentsReady(initObjectionBreakerReveal);
    })();
</script>
