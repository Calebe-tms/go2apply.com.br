<!-- ==========================================================================
   Seção Orquestradora: OB (Objection Breaker)
   Organiza os subcomponentes em layouts otimizados para Desktop e Mobile.
   Mobile: Headline -> Situation -> Example -> Break
   Desktop: Headline -> Grid 50/50 (Situation + Break) -> Example
   ========================================================================== -->
<style>
    .ob-section {
        position: relative;
        width: 100%;
        padding: var(--space-2xl) 0;
        background-color: var(--color-dark);
        overflow: hidden;
    }

    .ob-inner {
        width: min(var(--container-width), 100%);
        margin: 0 auto;
        padding: 0 1.5rem;
        box-sizing: border-box;
    }

    /* Container flexível principal com ordenação */
    .ob-flex-container {
        display: flex;
        flex-direction: column;
        gap: var(--space-2xl);
    }

    .ob-slot-headline { order: 1; }
    .ob-slot-grid     { order: 2; }
    .ob-slot-example  { order: 3; }

    /* Grid 50/50 no Desktop */
    .ob-grid-50-50 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--space-2xl);
        align-items: center;
    }

    /* Responsividade Mobile: Ordem Situation -> Example -> Break */
    @media (max-width: 992px) {
        .ob-section {
            padding: var(--space-xl) 0;
        }

        .ob-flex-container {
            gap: var(--space-xl);
        }

        /* Desfaz o container intermediário para colocar situation, example e break no mesmo nível de flex */
        .ob-grid-50-50 {
            display: contents;
        }

        .ob-slot-headline  { order: 1; }
        .ob-slot-situation { order: 2; }
        .ob-slot-example   { order: 3; }
        .ob-slot-break     { order: 4; }
    }
</style>

<section class="ob-section" id="ob">
    <div class="ob-inner">
        <div class="ob-flex-container">
            
            <!-- Slot 1: Headline -->
            <div class="ob-slot-headline" data-component="sections/ob/ob-headline/ob-headline.html"></div>

            <!-- Slot 2 no Desktop / Desmembrado no Mobile via CSS display: contents -->
            <div class="ob-grid-50-50 ob-slot-grid">
                <div class="ob-slot-situation" data-component="sections/ob/ob-situation/ob-situation.html"></div>
                <div class="ob-slot-break" data-component="sections/ob/ob-break/ob-break.html"></div>
            </div>

            <!-- Slot 3: Example (3 Cards) -->
            <div class="ob-slot-example" data-component="sections/ob/ob-example/ob-example.html"></div>

        </div>
    </div>
</section>
