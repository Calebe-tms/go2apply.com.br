<!-- ==========================================================================
   Component: Nav Menu (Header)
   Links centrais de navegação e gaveta lateral (Side Drawer) mobile com logo,
   ícones, redes sociais e animações GSAP
   ========================================================================== -->
<style>
    .nav-menu {
        justify-self: center;
    }

    .nav-menu-backdrop,
    .nav-menu-header,
    .nav-menu-trial-card,
    .nav-menu-footer,
    .nav-link-arrow {
        display: none;
    }

    .nav-links {
        display: flex;
        align-items: center;
        gap: clamp(0.25rem, 1vw, 0.75rem);
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .nav-link-item {
        position: relative;
        text-decoration: none;
        color: var(--color-white);
        font-size: var(--font-size-md);
        font-weight: 600;
        letter-spacing: 0.75px;
        text-transform: uppercase;
        white-space: nowrap;
        transition: var(--transition-smooth);
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        padding: 0.55rem 1.1rem;
        border-radius: var(--radius-btn, 10px);
        border: 1px solid transparent;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
    }

    .nav-link-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        color: var(--color-orange);
        transition: var(--transition-smooth);
    }

    /* Faixa entre a gaveta mobile (992px) e o header com folga total (1210px) */
    @media (min-width: 993px) and (max-width: 1210px) {
        .nav-links {
            gap: 0.3rem;
        }

        .nav-link-item {
            padding: 0.55rem 0.7rem;
            font-size: 0.9rem;
            gap: 0.35rem;
        }

        .nav-link-icon {
            font-size: 14px;
        }
    }

    .nav-link-item:hover {
        color: var(--color-orange);
        background-color: var(--color-orange-subtle);
        border-color: rgba(var(--color-orange-rgb), 0.4);
    }

    .nav-link-item:hover .nav-link-icon {
        transform: scale(1.15);
    }

    .nav-link-item.nav-link-highlight {
        color: var(--color-pulver-light);
    }

    .nav-link-item.nav-link-highlight .nav-link-icon {
        color: var(--color-pulver-light);
    }

    /* Estilos da Gaveta Lateral (Side Drawer) Mobile */
    @media (max-width: 992px) {
        .nav-menu {
            position: fixed;
            inset: 0;
            z-index: 1050;
            pointer-events: none;
            visibility: hidden;
            transition: visibility 0.4s ease;
        }

        .nav-menu.active {
            pointer-events: auto;
            visibility: visible;
        }

        /* Fundo escuro com blur ao abrir o menu */
        .nav-menu-backdrop {
            display: block;
            position: fixed;
            inset: 0;
            background: rgba(8, 12, 8, 0.75);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            opacity: 0;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            z-index: 1051;
        }

        .nav-menu.active .nav-menu-backdrop {
            opacity: 1;
        }

        /* Painel do Side Drawer lateral à direita */
        .nav-menu-drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: min(86vw, 360px);
            height: 100dvh;
            background: rgba(14, 20, 13, 0.96);
            -webkit-backdrop-filter: blur(28px) saturate(160%);
            backdrop-filter: blur(28px) saturate(160%);
            border-left: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: -15px 0 45px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.25rem 1rem;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1052;
            overflow-y: auto;
        }

        .nav-menu.active .nav-menu-drawer {
            transform: translateX(0);
        }

        /* Topo do Side Drawer: Logo à esquerda + Componente Login com folga pro fechar */
        .nav-menu-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding-bottom: 0.85rem;
            padding-right: 48px; /* Evita sobreposição com o botão de fechar #nav-toggle no canto direito */
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 0.65rem;
            width: 100%;
            box-sizing: border-box;
        }

        .nav-menu-brand {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .nav-menu-logo {
            height: 28px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
        }

        /* Banner de Anúncio de 7 Dias de Teste Grátis */
        .nav-menu-trial-card {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            width: 100%;
            box-sizing: border-box;
            padding: 0.75rem 0.95rem;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(242, 142, 19, 0.18) 0%, rgba(91, 140, 69, 0.18) 100%);
            border: 1.2px solid rgba(242, 142, 19, 0.45);
            box-shadow: 0 4px 16px rgba(242, 142, 19, 0.15);
            cursor: pointer;
            text-align: left;
            margin-bottom: 0.65rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .nav-menu-trial-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.18), transparent);
            transition: left 0.6s ease;
        }

        .nav-menu-trial-card:hover::before {
            left: 100%;
        }

        .nav-menu-trial-card:hover {
            transform: translateY(-2px) scale(1.01);
            border-color: var(--color-orange, #f28e13);
            box-shadow: 0 6px 22px rgba(242, 142, 19, 0.35);
        }

        .trial-card-badge {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--color-orange, #f28e13) 0%, #e07d08 100%);
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(242, 142, 19, 0.4);
        }

        .trial-card-content {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .trial-card-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.2px;
        }

        .trial-card-sub {
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.75);
            font-weight: 500;
        }

        .trial-card-arrow {
            font-size: 15px;
            color: var(--color-orange, #f28e13);
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        .nav-menu-trial-card:hover .trial-card-arrow {
            transform: translateX(4px);
            color: #ffffff;
        }

        /* Lista de Links: Botões compactos com 100% de largura */
        .nav-links {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 0.5rem;
            width: 100%;
            padding: 0;
            margin: 0;
            list-style: none;
            box-sizing: border-box;
        }

        .nav-links li {
            width: 100%;
            display: block;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .nav-link-item {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            box-sizing: border-box;
            padding: 0.65rem 0.9rem;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            text-decoration: none;
            color: var(--color-white);
            font-size: 0.88rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            text-shadow: none;
        }

        .nav-link-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--color-orange);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            margin-right: 0.75rem;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .nav-link-text {
            flex-grow: 1;
            text-align: left !important;
        }

        .nav-link-arrow {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            color: rgba(255, 255, 255, 0.35);
            margin-left: auto;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .nav-link-item:hover,
        .nav-link-item:active {
            background: rgba(242, 142, 19, 0.14);
            border-color: rgba(242, 142, 19, 0.4);
            color: #ffffff;
            transform: translateX(-4px);
        }

        .nav-link-item:hover .nav-link-icon {
            background: var(--color-orange);
            color: #ffffff;
            transform: scale(1.08);
        }

        .nav-link-item:hover .nav-link-arrow {
            color: var(--color-orange);
            transform: translateX(4px);
        }

        /* Item em destaque (O RISCO) */
        .nav-links a.nav-link-highlight {
            background: rgba(92, 145, 71, 0.14);
            border-color: rgba(92, 145, 71, 0.35);
            color: var(--color-pulver-light, #78b860);
        }

        .nav-links a.nav-link-highlight .nav-link-icon {
            background: rgba(92, 145, 71, 0.2);
            color: var(--color-pulver-light, #78b860);
        }

        .nav-links a.nav-link-highlight:hover {
            background: rgba(92, 145, 71, 0.25);
            border-color: var(--color-green, #5b8c45);
            color: #ffffff;
        }

        .nav-links a.nav-link-highlight:hover .nav-link-icon {
            background: var(--color-green, #5b8c45);
            color: #ffffff;
        }

        /* Rodapé do Side Drawer: Redes Sociais centralizadas */
        .nav-menu-footer {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            align-items: center;
            text-align: center;
            padding-top: 1.25rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: 1rem;
            width: 100%;
        }

        .nav-menu-footer-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
            text-align: center;
        }

        /* Sobrescreve ocultação das redes sociais no header mobile e centraliza no rodapé */
        #header .nav-menu-social .social-links {
            display: flex !important;
            opacity: 1 !important;
            pointer-events: auto !important;
            transform: none !important;
            gap: 0.75rem;
            justify-content: center;
        }
    }
</style>

<nav class="nav-menu" id="nav-menu" aria-label="Navegação Principal">

    <div class="nav-menu-backdrop" id="nav-menu-backdrop" aria-hidden="true"></div>

    <!-- Painel Lateral (Side Drawer) -->
    <div class="nav-menu-drawer" id="nav-menu-drawer">
        <!-- Cabeçalho com Logo e componente de Login -->
        <div class="nav-menu-header">
            <a href="#hero" class="nav-menu-brand" aria-label="Ir para a Home">
                <img src="assets/imagens/go2apply-logo-colorido.png" alt="go2apply" class="nav-menu-logo" width="160"
                    height="40">
            </a>
            <div data-component="components/btn-login/btn-login.html"></div>

        <!-- Banner de Anúncio: 7 Dias de Teste Grátis -->

        <!-- Links de navegação com ícones -->
        <ul class="nav-links">
            <li>
                <a href="#hero" class="nav-link-item">

        <!-- Rodapé com Redes Sociais -->
        <div class="nav-menu-footer">
            <span class="nav-menu-footer-label"></span>
            <div data-component="components/social-links/social-links.html" class="nav-menu-social"></div>
        </div>
    </div>
</nav>

<script>
    (function () {
        // Inicializa o controle do menu mobile imediatamente e reforça no onComponentsReady
        function setupNavMenu() {
            const mobileNav = document.getElementById('nav-menu');
            const backdrop = document.getElementById('nav-menu-backdrop');
            const closeBtn = document.getElementById('nav-menu-close');
            const toggleBtn = document.getElementById('nav-toggle');
            const navLinks = mobileNav ? mobileNav.querySelectorAll('.nav-links a') : [];

            if (!mobileNav) return;

            function openNav() {
                mobileNav.classList.add('active');
                if (toggleBtn) {
                    toggleBtn.classList.add('active');
                    toggleBtn.setAttribute('aria-expanded', 'true');
                }
                document.body.style.overflow = 'hidden';

                // Animação stagger leve dos itens internos via GSAP
                if (window.gsap && window.innerWidth <= 992) {
                    const headerEl = mobileNav.querySelector('.nav-menu-header');
                    const trialCardEl = mobileNav.querySelector('.trial-banner');
                    const items = mobileNav.querySelectorAll('.nav-link-item');
                    const footerEl = mobileNav.querySelector('.nav-menu-footer');

                    gsap.killTweensOf([headerEl, trialCardEl, items, footerEl]);

                    if (headerEl) {
                        gsap.fromTo(headerEl, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.3, delay: 0.08, ease: 'power2.out' });
                    }
                    if (trialCardEl) {
                        gsap.fromTo(trialCardEl, { opacity: 0, scale: 0.95 }, { opacity: 1, scale: 1, duration: 0.3, delay: 0.1, ease: 'power2.out' });
                    }
                    if (items.length) {
                        gsap.fromTo(items,
                            { opacity: 0, x: 22 },
                            { opacity: 1, x: 0, duration: 0.3, stagger: 0.04, delay: 0.14, ease: 'power2.out' }
                        );
                    }
                    if (footerEl) {
                        gsap.fromTo(footerEl, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, delay: 0.24, ease: 'power2.out' });
                    }
                }
            }

            function closeNav() {
                mobileNav.classList.remove('active');
                if (toggleBtn) {
                    toggleBtn.classList.remove('active');
                    toggleBtn.setAttribute('aria-expanded', 'false');
                }
                document.body.style.overflow = '';

                // Limpa propriedades inline do GSAP ao fechar
                if (window.gsap) {
                    const headerEl = mobileNav.querySelector('.nav-menu-header');
                    const trialCardEl = mobileNav.querySelector('.trial-banner');
                    const items = mobileNav.querySelectorAll('.nav-link-item');
                    const footerEl = mobileNav.querySelector('.nav-menu-footer');
                    gsap.set([headerEl, trialCardEl, items, footerEl], { clearProps: 'all' });
                }
            }

            function toggleNav() {
                if (mobileNav.classList.contains('active')) {
                    closeNav();
                } else {
                    openNav();
                }
            }

            // Expõe o controller globalmente para chamada a partir do header-actions
            window.go2applyNav = {
                open: openNav,
                close: closeNav,
                toggle: toggleNav
            };

            if (backdrop) {
                backdrop.onclick = closeNav;
            }

            if (closeBtn) {
                closeBtn.onclick = closeNav;
            }

            navLinks.forEach(link => {
                link.onclick = function () {
                    if (window.innerWidth <= 992) {
                        closeNav();
                    }
                };
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && mobileNav.classList.contains('active')) {
                    closeNav();
                }
            });
        }

        // Executa imediatamente ao carregar o componente
        setupNavMenu();

        // Garante a re-associação quando todos os componentes terminarem de carregar
        if (typeof onComponentsReady === 'function') {
            onComponentsReady(setupNavMenu);
        }
    })();
</script>
