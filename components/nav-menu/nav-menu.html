<!-- ==========================================================================
   Component: Nav Menu (Header)
   Links centrais de navegação com destaque no hover e gaveta mobile limpa
   ========================================================================== -->
<style>
    .nav-menu {
        justify-self: center;
    }

    .nav-links {
        display: flex;
        align-items: center;
        gap: clamp(0.25rem, 1vw, 0.75rem);
    }

    .nav-links a {
        position: relative;
        text-decoration: none;
        color: var(--color-white);
        font-size: var(--font-size-md);
        font-weight: 600;
        letter-spacing: 0.75px;
        text-transform: uppercase;
        transition: var(--transition-smooth);
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        padding: 0.55rem 1.1rem;
        border-radius: var(--radius-btn, 10px);
        border: 1px solid transparent;
        display: inline-block;
    }

    .nav-links a:hover {
        color: var(--color-orange);
        background-color: var(--color-orange-subtle);
        border-color: rgba(var(--color-orange-rgb), 0.4);
    }

    .nav-links a.nav-link-highlight {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        color: var(--color-pulver-light);
    }

    @media (max-width: 992px) {
        .nav-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100dvh;
            background: rgba(12, 17, 11, 0.82);
            -webkit-backdrop-filter: blur(24px) saturate(140%);
            backdrop-filter: blur(24px) saturate(140%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 3rem;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-20px);
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                        visibility 0.35s ease;
            z-index: 1050;
        }

        .nav-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .nav-links {
            flex-direction: column;
            gap: 2.2rem;
            text-align: center;
        }

        .nav-links a {
            font-size: 1.5rem;
            letter-spacing: 1.5px;
        }
    }
</style>

<nav class="nav-menu" id="nav-menu">
    <ul class="nav-links">
        <li><a href="#solucoes">PLATAFORMA</a></li>
        <li>
            <a href="#objection-breaker" class="nav-link-highlight">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z" />
                </svg>
                O RISCO
            </a>
        </li>
        <li><a href="#diferenciais">RECURSOS</a></li>
        <li><a href="#">PARA QUEM É</a></li>
        <li><a href="#planos">PLANOS</a></li>
        <li><a href="#faq">FAQ</a></li>
    </ul>
</nav>

<script>
    // Fecha o menu mobile ao clicar em um link interno
    const mobileNav = document.getElementById('nav-menu');
    const navLinks = mobileNav ? mobileNav.querySelectorAll('.nav-links a') : [];

    navLinks.forEach(link => {
        link.addEventListener('click', () => {
            if (mobileNav && mobileNav.classList.contains('active')) {
                mobileNav.classList.remove('active');
                const toggle = document.getElementById('nav-toggle');
                if (toggle) {
                    toggle.classList.remove('active');
                    toggle.setAttribute('aria-expanded', 'false');
                }
                document.body.style.overflow = '';
            }
        });
    });
</script>
