<style>
    .whatsapp-float {
        position: fixed;
        right: 42px;
        bottom: 82px;
        z-index: 9999;
        display: flex;
        align-items: center;
        flex-direction: row-reverse;
        gap: 0.75rem;
        pointer-events: none;
        will-change: transform, bottom, right;
        transition: bottom 0.75s cubic-bezier(0.16, 1, 0.3, 1),
            right 0.75s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .whatsapp-float.is-detached {
        bottom: 28px;
        right: 32px;
    }

    .whatsapp-float-btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--color-green, #5b8c45);
        text-decoration: none;
        pointer-events: auto;
        cursor: pointer;
        filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 14px var(--color-green-glow, rgba(91, 140, 69, 0.45)));
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
            filter 0.3s ease,
            color 0.3s ease;
    }

    .whatsapp-icon {
        font-size: 48px;
        flex-shrink: 0;
        transition: transform 0.25s ease;
    }

    .whatsapp-float.just-detached .whatsapp-float-btn {
        animation: whatsappDetachPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .whatsapp-float-btn:hover {
        color: #72b956;
        transform: scale(1.12) rotate(-4deg);
        filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.8)) drop-shadow(0 0 24px rgba(91, 140, 69, 0.85));
    }

    .whatsapp-tooltip {
        position: relative;
        background: rgba(var(--color-dark-surface-rgb, 18, 24, 16), 0.94);
        color: var(--color-white, #fefcf8);
        border: 1.2px solid var(--color-green, #5b8c45);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        padding: 0.42rem 0.8rem;
        border-radius: var(--radius-btn, 10px);
        font-family: var(--font-main, sans-serif);
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.2px;
        white-space: nowrap;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        opacity: 0;
        transform: translateX(8px);
        transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1),
            transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: auto;
    }

    .whatsapp-float:hover .whatsapp-tooltip {
        opacity: 1;
        transform: translateX(0);
    }

    @keyframes whatsappDetachPop {
        0% {
            transform: scale(0.92);
        }

        50% {
            transform: scale(1.18);
        }

        100% {
            transform: scale(1);
        }
    }

    @media (max-width: 600px) {
        .whatsapp-float {
            display: none;
        }

        .whatsapp-float.just-detached .whatsapp-float-btn {
            animation: none;
        }

        .whatsapp-tooltip {
            display: none;
        }

        .whatsapp-icon {
            font-size: 36px;
        }
    }
</style>

<div class="whatsapp-float" id="whatsapp-float" aria-label="Atendimento via WhatsApp">
    <a href="https://wa.me/555533432606?text=Ol%C3%A1%21%20Vim%20atrav%C3%A9s%20do%20site%20da%20go2apply%20e%20gostaria%20de%20tirar%20d%C3%BAvidas%20sobre%20o%20produto."
        target="_blank" rel="noopener noreferrer" class="whatsapp-float-btn" aria-label="Fale conosco no WhatsApp">
        <i class="ph-fill ph-whatsapp-logo whatsapp-icon" aria-hidden="true"></i>
    </a>
    <div class="whatsapp-tooltip">Fale com um especialista</div>
</div>

<script>
    (function () {
        const container = document.getElementById('whatsapp-float');
        if (!container) return;

        let floatTime = 0;
        let lastScrollY = window.scrollY || 0;
        let scrollVelocity = 0;
        let currentOffset = 0;
        let isDetached = false;
        let rafId = null;
        const DETACH_THRESHOLD = 90;
        // Mesmo breakpoint do CSS: o botão é display:none no mobile, então a
        // animação nem precisa rodar (evita gastar CPU/bateria à toa)
        const hiddenOnMobileQuery = window.matchMedia('(max-width: 600px)');

        function updateMagneticDock() {
            const scrollY = window.scrollY || 0;
            const delta = scrollY - lastScrollY;
            lastScrollY = scrollY;
            const isMobile = window.innerWidth <= 600;

            if (scrollY > DETACH_THRESHOLD && !isDetached) {
                isDetached = true;
                container.classList.add('is-detached');
                if (!isMobile) {
                    container.classList.add('just-detached');
                    setTimeout(() => container.classList.remove('just-detached'), 600);
                }
            } else if (scrollY <= DETACH_THRESHOLD && isDetached) {
                isDetached = false;
                container.classList.remove('is-detached');
            }

            const inFactor = isMobile ? 0.05 : 0.12;
            const dampFactor = isMobile ? 0.92 : 0.88;
            const maxClamp = isMobile ? 4 : 10;
            const floatAmp = isMobile ? 1.5 : (isDetached ? 3 : 1.8);

            scrollVelocity += (delta * inFactor - scrollVelocity) * 0.1;
            scrollVelocity *= dampFactor;

            floatTime += 0.025;
            const baseFloat = Math.sin(floatTime) * floatAmp;

            currentOffset += (baseFloat + Math.max(-maxClamp, Math.min(maxClamp, -scrollVelocity)) - currentOffset) * (isMobile ? 0.06 : 0.1);
            container.style.transform = `translate3d(0, ${currentOffset.toFixed(2)}px, 0)`;

            rafId = requestAnimationFrame(updateMagneticDock);
        }

        function startLoop() {
            if (rafId === null) rafId = requestAnimationFrame(updateMagneticDock);
        }

        function stopLoop() {
            if (rafId !== null) {
                cancelAnimationFrame(rafId);
                rafId = null;
            }
        }

        hiddenOnMobileQuery.addEventListener('change', (e) => e.matches ? stopLoop() : startLoop());
        if (!hiddenOnMobileQuery.matches) startLoop();
    })();
</script>
