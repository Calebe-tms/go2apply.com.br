<style>
    .header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1000;
        padding: 1.75rem 3.5rem;
        transition: padding 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                    background-color 0.4s ease,
                    backdrop-filter 0.4s ease,
                    box-shadow 0.4s ease,
                    border-color 0.4s ease;
        border-bottom: 1px solid transparent;
    }

    .header::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        background: linear-gradient(to bottom, rgba(var(--color-dark-rgb), 0.65) 0%, rgba(var(--color-dark-rgb), 0) 100%);
        opacity: 1;
        transition: opacity 0.4s ease;
        pointer-events: none;
    }

    .header.scrolled {
        padding: 0.85rem 3.5rem;
        background-color: var(--color-dark-glass);
        -webkit-backdrop-filter: var(--blur-glass);
        backdrop-filter: var(--blur-glass);
        border-bottom: 1px solid var(--color-border);
        box-shadow: var(--shadow-lg);
    }

    .header.scrolled::before {
        opacity: 0;
    }

    .nav-container {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        max-width: 1600px;
        margin: 0 auto;
        width: 100%;
    }

    @media (max-width: 1200px) {
        .header {
            padding: 1.25rem 2rem;
        }

        .header.scrolled {
            padding: 0.75rem 2rem;
        }
    }

    @media (max-width: 992px) {
        .header {
            padding: 1.1rem 1.5rem;
        }

        .header.scrolled {
            padding: 0.75rem 1.5rem;
        }

        .nav-container {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }
    }

    @media (max-width: 600px) {
        .header {
            padding: 0.75rem 1rem;
        }

        .header.scrolled {
            padding: 0.6rem 1rem;
        }
    }
</style>

<header class="header" id="header">
    <div class="nav-container">
        <div data-component="components/social-links/social-links.html"></div>
        <div data-component="components/nav-menu/nav-menu.html"></div>
        <div data-component="components/header-actions/header-actions.html"></div>
    </div>
</header>

<script>
    const headerElement = document.getElementById('header');
    const scrollThreshold = 30;

    const onWindowScroll = () => {
        if (!headerElement) return;
        if (window.scrollY > scrollThreshold) {
            headerElement.classList.add('scrolled');
        } else {
            headerElement.classList.remove('scrolled');
        }
    };

    window.addEventListener('scroll', onWindowScroll, { passive: true });
    onWindowScroll();
</script>
