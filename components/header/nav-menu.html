<!-- ==========================================================================
   Component: Nav Menu (Header)
   Links centrais de navegação com underline dinâmico e gaveta mobile
   ========================================================================== -->
<style>
    .nav-center {
        justify-self: center;
    }

    .nav-links {
        display: flex;
        align-items: center;
        gap: clamp(1.5rem, 2.8vw, 3.5rem);
    }

    .nav-links a {
        position: relative;
        text-decoration: none;
        color: var(--color-white);
        font-size: var(--font-size-md);
        font-weight: 600;
        letter-spacing: 0.75px;
        text-transform: uppercase;
        transition: var(--transition-smooth);
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        padding: 0.35rem 0;
        display: inline-block;
    }

    .nav-links a::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 0%;
        height: 2px;
        background-color: var(--color-orange);
        transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        border-radius: var(--radius-sm);
    }

    .nav-links a:hover {
        color: var(--color-orange);
        transform: translateY(-2px);
    }

    .nav-links a:hover::after {
        width: 100%;
    }

    @media (max-width: 992px) {
        .nav-center {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: var(--color-dark-drawer);
            -webkit-backdrop-filter: var(--blur-drawer);
            backdrop-filter: var(--blur-drawer);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-20px);
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                        visibility 0.35s ease;
            z-index: 1050;
        }

        .nav-center.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .nav-links {
            flex-direction: column;
            gap: 2.2rem;
            text-align: center;
        }

        .nav-links a {
            font-size: 1.5rem;
            letter-spacing: 1.5px;
        }
    }
</style>

<nav class="nav-center" id="nav-center">
    <ul class="nav-links">
        <li><a href="#solucoes">SOLUÇÕES</a></li>
        <li><a href="#base-tecnica">BASE TÉCNICA</a></li>
        <li><a href="#planos">PLANOS</a></li>
    </ul>
</nav>

<script>
    // Fecha o menu mobile ao clicar em um link interno
    const mobileNav = document.getElementById('nav-center');
    const navLinks = mobileNav ? mobileNav.querySelectorAll('.nav-links a') : [];

    navLinks.forEach(link => {
        link.addEventListener('click', () => {
            if (mobileNav && mobileNav.classList.contains('active')) {
                mobileNav.classList.remove('active');
                const toggle = document.getElementById('nav-toggle');
                if (toggle) {
                    toggle.classList.remove('active');
                    toggle.setAttribute('aria-expanded', 'false');
                }
                document.body.style.overflow = '';
            }
        });
    });
</script>
