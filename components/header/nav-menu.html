<!-- ==========================================================================
   Component: Nav Menu (Header)
   Links centrais de navegação com underline dinâmico e gaveta mobile
   ========================================================================== -->
<style>
    .nav-center {
        justify-self: center;
    }

    .nav-links {
        display: flex;
        align-items: center;
        gap: clamp(1.5rem, 2.8vw, 3.5rem);
    }

    .nav-links a {
        position: relative;
        text-decoration: none;
        color: var(--color-white);
        font-size: var(--font-size-md);
        font-weight: 600;
        letter-spacing: 0.75px;
        text-transform: uppercase;
        transition: var(--transition-smooth);
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        padding: 0.35rem 0;
        display: inline-block;
    }

    .nav-links a::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 0%;
        height: 2px;
        background-color: var(--color-orange);
        transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        border-radius: var(--radius-sm);
    }

    .nav-links a:hover {
        color: var(--color-orange);
        transform: translateY(-2px);
    }

    .nav-links a:hover::after {
        width: 100%;
    }

    .drawer-social {
        display: none;
    }

    @media (max-width: 992px) {
        .nav-center {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: var(--color-dark-drawer);
            -webkit-backdrop-filter: var(--blur-drawer);
            backdrop-filter: var(--blur-drawer);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 3rem;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-20px);
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                        visibility 0.35s ease;
            z-index: 1050;
        }

        .nav-center.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .nav-links {
            flex-direction: column;
            gap: 2.2rem;
            text-align: center;
        }

        .nav-links a {
            font-size: 1.5rem;
            letter-spacing: 1.5px;
        }

        .drawer-social {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }

        .drawer-social a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: var(--radius-full);
            color: var(--color-white);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--color-border-subtle);
            text-decoration: none;
        }
    }
</style>

<nav class="nav-center" id="nav-center">
    <ul class="nav-links">
        <li><a href="#solucoes">SOLUÇÕES</a></li>
        <li><a href="#base-tecnica">BASE TÉCNICA</a></li>
        <li><a href="#planos">PLANOS</a></li>
    </ul>

    <div class="drawer-social">
        <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
        </a>
        <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
                <rect x="2" y="9" width="4" height="12"></rect>
                <circle cx="4" cy="4" r="2"></circle>
            </svg>
        </a>
        <a href="https://wa.me" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
        </a>
    </div>
</nav>

<script>
    // Fecha o menu mobile ao clicar em um link interno
    const mobileNav = document.getElementById('nav-center');
    const navLinks = mobileNav ? mobileNav.querySelectorAll('.nav-links a') : [];

    navLinks.forEach(link => {
        link.addEventListener('click', () => {
            if (mobileNav && mobileNav.classList.contains('active')) {
                mobileNav.classList.remove('active');
                const toggle = document.getElementById('nav-toggle');
                if (toggle) {
                    toggle.classList.remove('active');
                    toggle.setAttribute('aria-expanded', 'false');
                }
                document.body.style.overflow = '';
            }
        });
    });
</script>
