<!-- ==========================================================================
   Component: Btn CTA (Global Reutilizável)
   Botão de CTA institucional com suporte a hover iluminado e animação de aura
   ========================================================================== -->
<style>
    .btn-cta-wrapper {
        margin-top: 0.25rem;
        display: flex;
        justify-content: center;
        align-items: center;
        animation: btnCtaFadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
        opacity: 0;
    }

    .btn-cta-element {
        position: relative;
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        font-family: var(--font-main, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
        font-weight: 600;
        background-color: #121810;
        border: 1.2px solid var(--color-orange, #f28e13);
        border-radius: var(--radius-btn, 10px);
        color: var(--color-white, #fefcf8);
        gap: 0.75rem;
        padding: 0.75rem 1.85rem;
        font-size: clamp(0.92rem, 1.05vw, 1.05rem);
        letter-spacing: 0.2px;
        cursor: pointer;
        z-index: 1;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5),
                    0 0 16px var(--color-orange-glow, rgba(242, 142, 19, 0.25));
        transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                    background-color 0.25s ease,
                    border-color 0.25s ease,
                    box-shadow 0.35s ease;
    }

    .btn-cta-element::before {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: calc(var(--radius-btn, 10px) + 4px);
        border: 1.5px solid var(--color-orange, #f28e13);
        opacity: 0;
        animation: btnCtaAuraPulse 3.2s cubic-bezier(0.25, 1, 0.5, 1) infinite;
        pointer-events: none;
        z-index: -1;
    }

    .btn-cta-element:hover {
        transform: translateY(-2px) scale(1.02);
        background-color: #182015;
        border-color: var(--color-orange-hover, #ff9b26);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.65),
                    0 0 28px var(--color-orange-glow, rgba(242, 142, 19, 0.55));
        color: #ffffff;
    }

    .btn-cta-icon {
        width: 22px;
        height: 22px;
        object-fit: contain;
        transition: var(--transition-smooth, all 0.4s cubic-bezier(0.16, 1, 0.3, 1));
    }

    .btn-cta-element:hover .btn-cta-icon {
        transform: scale(1.12) rotate(8deg);
    }

    .btn-cta-label {
        color: var(--color-white, #fefcf8);
        transition: var(--transition-smooth, all 0.4s cubic-bezier(0.16, 1, 0.3, 1));
    }

    .btn-cta-element:hover .btn-cta-label {
        color: #ffffff;
    }

    .btn-cta-arrow {
        transition: transform 0.3s ease, color 0.3s ease;
        color: var(--color-orange, #f28e13);
    }

    .btn-cta-element:hover .btn-cta-arrow {
        transform: translateX(4px);
        color: #ffffff;
    }

    @keyframes btnCtaAuraPulse {
        0% {
            transform: scale(0.96);
            opacity: 0.85;
            box-shadow: 0 0 12px var(--color-orange-glow, rgba(242, 142, 19, 0.4));
        }
        50% {
            transform: scale(1.18);
            opacity: 0;
            box-shadow: 0 0 24px var(--color-orange-glow, rgba(242, 142, 19, 0));
        }
        100% {
            transform: scale(1.18);
            opacity: 0;
            box-shadow: 0 0 24px var(--color-orange-glow, rgba(242, 142, 19, 0));
        }
    }

    @keyframes btnCtaFadeInUp {
        from {
            opacity: 0;
            transform: translateY(24px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 600px) {
        .btn-cta-element {
            padding: 0.65rem 1.45rem;
            font-size: 0.88rem;
            gap: 0.6rem;
        }

        .btn-cta-icon {
            width: 18px;
            height: 18px;
        }
    }
</style>

<div class="btn-cta" id="btn-cta">
    <button class="btn-cta-element cta-btn-base" id="main-cta-button" onclick="openAuthDrawer()">
        <img src="assets/icos/ico-logo-go2apply.png" alt="" class="btn-cta-icon" aria-hidden="true">
        <span class="btn-cta-label">Conheça a Ferramenta</span>
        <svg class="btn-cta-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M12 5l7 7-7 7" />
        </svg>
    </button>
</div>
