<!-- ==========================================================================
   Component: Btn CTA (Global Reutilizável)
   Botão de CTA institucional com suporte a hover iluminado e animação de aura
   ========================================================================== -->
<style>
    .btn-cta {
        margin-top: 0.35rem;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        background: transparent !important;
        border: none !important;
        padding: 0 !important;
        box-shadow: none !important;
        animation: btnCtaFadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
        opacity: 0;
        pointer-events: auto;
    }

    .btn-cta-element {
        position: relative;
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        font-family: var(--font-main, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
        font-weight: 600;
        background-color: var(--color-dark-surface, #121810);
        border: 2px solid var(--color-orange, #f28e13);
        border-radius: var(--radius-btn, 10px);
        color: var(--color-white, #fefcf8);
        gap: 0.75rem;
        padding: 0.75rem 1.85rem;
        font-size: clamp(0.92rem, 1.05vw, 1.05rem);
        letter-spacing: 0.2px;
        cursor: pointer;
        z-index: 1;
        /* Pulsação fluida, suave e contínua do botão */
        animation: btnCtaFluidGlow 3.6s ease-in-out infinite;
        transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                    background-color 0.25s ease;
    }

    .btn-cta-element::before {
        content: '';
        position: absolute;
        inset: -6px;
        border-radius: calc(var(--radius-btn, 10px) + 6px);
        border: 2px solid var(--color-orange, #f28e13);
        opacity: 0;
        pointer-events: none;
        z-index: -1;
        animation: btnCtaFluidAura 3.6s cubic-bezier(0.25, 1, 0.5, 1) infinite;
    }

    .btn-cta-element:hover {
        transform: translateY(-2px) scale(1.02);
        background-color: #1c2718;
        color: #ffffff;
    }

    .btn-cta-icon {
        width: 22px;
        height: 22px;
        object-fit: contain;
        transition: var(--transition-smooth, all 0.4s cubic-bezier(0.16, 1, 0.3, 1));
        animation: btnCtaFluidIcon 3.6s ease-in-out infinite;
    }

    .btn-cta-element:hover .btn-cta-icon {
        transform: scale(1.12) rotate(8deg);
    }

    .btn-cta-label {
        color: var(--color-white, #fefcf8);
        transition: var(--transition-smooth, all 0.4s cubic-bezier(0.16, 1, 0.3, 1));
    }

    .btn-cta-element:hover .btn-cta-label {
        color: #ffffff;
    }

    .btn-cta-arrow {
        font-size: 16px;
        transition: transform 0.3s ease, color 0.3s ease;
        color: var(--color-orange, #f28e13);
    }

    .btn-cta-element:hover .btn-cta-arrow {
        transform: translateX(4px);
        color: #ffffff;
    }

    /* Animação suave e fluida do ícone */
    @keyframes btnCtaFluidIcon {
        0%, 100% {
            filter: drop-shadow(0 0 0 transparent);
            transform: scale(1);
        }
        50% {
            filter: drop-shadow(0 0 8px rgba(242, 142, 19, 0.75));
            transform: scale(1.08);
        }
    }

    /* Brilho fluido e orgânico do botão */
    @keyframes btnCtaFluidGlow {
        0%, 100% {
            background-color: var(--color-dark-surface, #121810);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5), 0 0 8px rgba(242, 142, 19, 0.15);
        }
        50% {
            background-color: #1a2416;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.65), 0 0 26px rgba(242, 142, 19, 0.6);
        }
    }

    /* Aura expandida com transição suave */
    @keyframes btnCtaFluidAura {
        0% {
            opacity: 0.75;
            transform: scale(0.98);
        }
        60% {
            opacity: 0;
            transform: scale(1.12);
        }
        100% {
            opacity: 0;
            transform: scale(1.12);
        }
    }

    @keyframes btnCtaFadeInUp {
        from {
            opacity: 0;
            transform: translateY(24px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 600px) {
        .btn-cta-element {
            padding: 0.65rem 1.45rem;
            font-size: 0.88rem;
            gap: 0.6rem;
        }

        .btn-cta-icon {
            width: 18px;
            height: 18px;
        }
    }
</style>

<div class="btn-cta">
    <button type="button" class="btn-cta-element cta-btn-base" aria-label="Acessar o go2apply">
        <img src="assets/icos/ico-logo-go2apply.png" alt="" class="btn-cta-icon" aria-hidden="true" width="372" height="438">
        <span class="btn-cta-label">Acessar o go2apply</span>
        <i class="ph-fill ph-arrow-right btn-cta-arrow" aria-hidden="true"></i>
    </button>
</div>

<script>
    (function () {
        if (!window.__btnCtaGlobalListener) {
            window.__btnCtaGlobalListener = true;
            document.addEventListener('click', (e) => {
                const btn = e.target.closest('.btn-cta-element');
                if (!btn) return;

                if (typeof window.openAuthDrawerAndCloseNav === 'function') {
                    window.openAuthDrawerAndCloseNav();
                } else if (window.openAuthDrawer) {
                    window.openAuthDrawer();
                } else if (window.authDrawer) {
                    window.authDrawer.open();
                }
            });
        }
    })();
</script>
