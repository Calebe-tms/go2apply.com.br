<!-- ==========================================================================
   Component: Btn CTA (Global Reutilizável)
   Botão de CTA institucional com suporte a hover iluminado e animação de aura
   ========================================================================== -->
<style>
    .btn-cta {
        margin-top: 0.35rem;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        background: transparent !important;
        border: none !important;
        padding: 0 !important;
        box-shadow: none !important;
        animation: btnCtaFadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
        opacity: 0;
        pointer-events: auto;
    }

    .btn-cta-element {
        position: relative;
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        font-family: var(--font-main, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
        font-weight: 600;
        background-color: var(--color-dark-surface, #121810);
        border: 1.2px solid var(--color-orange, #f28e13);
        border-radius: var(--radius-btn, 10px);
        color: var(--color-white, #fefcf8);
        gap: 0.75rem;
        padding: 0.75rem 1.85rem;
        font-size: clamp(0.92rem, 1.05vw, 1.05rem);
        letter-spacing: 0.2px;
        cursor: pointer;
        z-index: 1;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5),
                    0 0 16px var(--color-orange-glow, rgba(242, 142, 19, 0.25));
        transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                    background-color 0.25s ease,
                    border-color 0.25s ease,
                    box-shadow 0.35s ease;
    }

    .btn-cta-element::before {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: calc(var(--radius-btn, 10px) + 4px);
        border: 1.5px solid var(--color-orange, #f28e13);
        opacity: 0;
        /* Morse code for #apliquemais:
           #  (•••-•-), a (•-), p (•--•), l (•-••), i (••), q (--•-), u (••-), e (•), m (--), a (•-), i (••), s (•••)
           Total duration 18s com ritmo cadenciado de luz/brilho */
        animation: btnCtaMorsePulse 18s cubic-bezier(0.25, 1, 0.5, 1) infinite;
        pointer-events: none;
        z-index: -1;
    }

    .btn-cta-element:hover {
        transform: translateY(-2px) scale(1.02);
        background-color: #182015;
        border-color: var(--color-orange-hover, #ff9b26);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.65),
                    0 0 28px var(--color-orange-glow, rgba(242, 142, 19, 0.55));
        color: #ffffff;
    }

    .btn-cta-icon {
        width: 22px;
        height: 22px;
        object-fit: contain;
        transition: var(--transition-smooth, all 0.4s cubic-bezier(0.16, 1, 0.3, 1));
    }

    .btn-cta-element:hover .btn-cta-icon {
        transform: scale(1.12) rotate(8deg);
    }

    .btn-cta-label {
        color: var(--color-white, #fefcf8);
        transition: var(--transition-smooth, all 0.4s cubic-bezier(0.16, 1, 0.3, 1));
    }

    .btn-cta-element:hover .btn-cta-label {
        color: #ffffff;
    }

    .btn-cta-arrow {
        font-size: 16px;
        transition: transform 0.3s ease, color 0.3s ease;
        color: var(--color-orange, #f28e13);
    }

    .btn-cta-element:hover .btn-cta-arrow {
        transform: translateX(4px);
        color: #ffffff;
    }

    /* Keyframes com o ritmo de Morse Code para "#apliquemais" */
    @keyframes btnCtaMorsePulse {
        0%, 100% { opacity: 0; transform: scale(1); box-shadow: 0 0 0 rgba(242, 142, 19, 0); }
        /* # (•••-•-) */
        0.5% { opacity: 0.8; transform: scale(1.06); box-shadow: 0 0 14px var(--color-orange-glow, rgba(242, 142, 19, 0.5)); }
        1.2% { opacity: 0; transform: scale(1); }
        1.7% { opacity: 0.8; transform: scale(1.06); }
        2.4% { opacity: 0; transform: scale(1); }
        2.9% { opacity: 0.8; transform: scale(1.06); }
        3.6% { opacity: 0; transform: scale(1); }
        4.1% { opacity: 0.9; transform: scale(1.1); box-shadow: 0 0 18px var(--color-orange-glow, rgba(242, 142, 19, 0.6)); }
        5.8% { opacity: 0; transform: scale(1); }
        6.3% { opacity: 0.8; transform: scale(1.06); }
        7.0% { opacity: 0; transform: scale(1); }
        7.5% { opacity: 0.9; transform: scale(1.1); }
        9.2% { opacity: 0; transform: scale(1); }
        /* a (•-) */
        10.5% { opacity: 0.8; transform: scale(1.06); }
        11.2% { opacity: 0; transform: scale(1); }
        11.7% { opacity: 0.9; transform: scale(1.1); }
        13.4% { opacity: 0; transform: scale(1); }
        /* p (•--•) */
        14.7% { opacity: 0.8; transform: scale(1.06); }
        15.4% { opacity: 0; transform: scale(1); }
        15.9% { opacity: 0.9; transform: scale(1.1); }
        17.6% { opacity: 0; transform: scale(1); }
        18.1% { opacity: 0.9; transform: scale(1.1); }
        19.8% { opacity: 0; transform: scale(1); }
        20.3% { opacity: 0.8; transform: scale(1.06); }
        21.0% { opacity: 0; transform: scale(1); }
        /* l (•-••) */
        22.3% { opacity: 0.8; transform: scale(1.06); }
        23.0% { opacity: 0; transform: scale(1); }
        23.5% { opacity: 0.9; transform: scale(1.1); }
        25.2% { opacity: 0; transform: scale(1); }
        25.7% { opacity: 0.8; transform: scale(1.06); }
        26.4% { opacity: 0; transform: scale(1); }
        26.9% { opacity: 0.8; transform: scale(1.06); }
        27.6% { opacity: 0; transform: scale(1); }
        /* i (••) */
        28.9% { opacity: 0.8; transform: scale(1.06); }
        29.6% { opacity: 0; transform: scale(1); }
        30.1% { opacity: 0.8; transform: scale(1.06); }
        30.8% { opacity: 0; transform: scale(1); }
        /* q (--•-) */
        32.1% { opacity: 0.9; transform: scale(1.1); }
        33.8% { opacity: 0; transform: scale(1); }
        34.3% { opacity: 0.9; transform: scale(1.1); }
        36.0% { opacity: 0; transform: scale(1); }
        36.5% { opacity: 0.8; transform: scale(1.06); }
        37.2% { opacity: 0; transform: scale(1); }
        37.7% { opacity: 0.9; transform: scale(1.1); }
        39.4% { opacity: 0; transform: scale(1); }
        /* u (••-) */
        40.7% { opacity: 0.8; transform: scale(1.06); }
        41.4% { opacity: 0; transform: scale(1); }
        41.9% { opacity: 0.8; transform: scale(1.06); }
        42.6% { opacity: 0; transform: scale(1); }
        43.1% { opacity: 0.9; transform: scale(1.1); }
        44.8% { opacity: 0; transform: scale(1); }
        /* e (•) */
        46.1% { opacity: 0.8; transform: scale(1.06); }
        46.8% { opacity: 0; transform: scale(1); }
        /* m (--) */
        48.1% { opacity: 0.9; transform: scale(1.1); }
        49.8% { opacity: 0; transform: scale(1); }
        50.3% { opacity: 0.9; transform: scale(1.1); }
        52.0% { opacity: 0; transform: scale(1); }
        /* a (•-) */
        53.3% { opacity: 0.8; transform: scale(1.06); }
        54.0% { opacity: 0; transform: scale(1); }
        54.5% { opacity: 0.9; transform: scale(1.1); }
        56.2% { opacity: 0; transform: scale(1); }
        /* i (••) */
        57.5% { opacity: 0.8; transform: scale(1.06); }
        58.2% { opacity: 0; transform: scale(1); }
        58.7% { opacity: 0.8; transform: scale(1.06); }
        59.4% { opacity: 0; transform: scale(1); }
        /* s (•••) */
        60.7% { opacity: 0.8; transform: scale(1.06); }
        61.4% { opacity: 0; transform: scale(1); }
        61.9% { opacity: 0.8; transform: scale(1.06); }
        62.6% { opacity: 0; transform: scale(1); }
        63.1% { opacity: 0.8; transform: scale(1.06); }
        63.8% { opacity: 0; transform: scale(1); }
        /* Pausa / Silêncio antes do próximo ciclo */
        65%, 100% { opacity: 0; transform: scale(1); }
    }

    @keyframes btnCtaFadeInUp {
        from {
            opacity: 0;
            transform: translateY(24px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 600px) {
        .btn-cta-element {
            padding: 0.65rem 1.45rem;
            font-size: 0.88rem;
            gap: 0.6rem;
        }

        .btn-cta-icon {
            width: 18px;
            height: 18px;
        }
    }
</style>

<div class="btn-cta">
    <button class="btn-cta-element cta-btn-base" type="button">
        <img src="assets/icos/ico-logo-go2apply.png" alt="" class="btn-cta-icon" aria-hidden="true" width="372" height="438">
        <span class="btn-cta-label">Acessar o go2apply</span>
        <i class="ph-fill ph-arrow-right btn-cta-arrow" aria-hidden="true"></i>
    </button>
</div>

<script>
    (function () {
        // Escuta cliques em todos os botões btn-cta (suporta múltiplas instâncias no DOM)
        if (!window.__btnCtaGlobalListener) {
            window.__btnCtaGlobalListener = true;
            document.addEventListener('click', (e) => {
                const btn = e.target.closest('.btn-cta-element, .cta-btn-base');
                if (btn) {
                    if (window.openAuthDrawer) {
                        window.openAuthDrawer();
                    } else {
                        window.addEventListener('components:ready', () => window.openAuthDrawer?.(), { once: true });
                    }
                }
            });
        }

    })();
</script>
