<!-- ==========================================================================
   Component: Trial Banner (Global Reutilizável)
   Banner promocional de 7 Dias de Teste Grátis que aciona o auth-drawer
   ========================================================================== -->
<style>
    .trial-banner {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        width: 100%;
        box-sizing: border-box;
        padding: 0.75rem 0.95rem;
        border-radius: 12px;
        background: linear-gradient(135deg, rgba(242, 142, 19, 0.18) 0%, rgba(91, 140, 69, 0.18) 100%);
        border: 1.2px solid rgba(242, 142, 19, 0.45);
        box-shadow: 0 4px 16px rgba(242, 142, 19, 0.15);
        cursor: pointer;
        text-align: left;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
        overflow: hidden;
        margin: 0.35rem 0;
    }

    .trial-banner::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.18), transparent);
        transition: left 0.6s ease;
    }

    .trial-banner:hover::before {
        left: 100%;
    }

    .trial-banner:hover {
        transform: translateY(-2px) scale(1.01);
        border-color: var(--color-orange, #f28e13);
        box-shadow: 0 6px 22px rgba(242, 142, 19, 0.35);
    }

    .trial-banner-badge {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: linear-gradient(135deg, var(--color-orange, #f28e13) 0%, #e07d08 100%);
        color: #ffffff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        flex-shrink: 0;
        box-shadow: 0 2px 8px rgba(242, 142, 19, 0.4);
    }

    .trial-banner-content {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
    }

    .trial-banner-title {
        font-size: 0.88rem;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 0.2px;
        line-height: 1.2;
    }

    .trial-banner-sub {
        font-size: 0.72rem;
        color: rgba(255, 255, 255, 0.75);
        font-weight: 500;
        margin-top: 2px;
    }

    .trial-banner-arrow {
        font-size: 15px;
        color: var(--color-orange, #f28e13);
        transition: transform 0.3s ease;
        flex-shrink: 0;
    }

    .trial-banner:hover .trial-banner-arrow {
        transform: translateX(4px);
        color: #ffffff;
    }
</style>

<button type="button" class="trial-banner cta-btn-base" aria-label="7 Dias de Teste Grátis">
    <span class="trial-banner-badge">
        <i class="ph-fill ph-sparkle" aria-hidden="true"></i>
    </span>
    <span class="trial-banner-content">
        <span class="trial-banner-title">7 Dias de Teste Grátis</span>
        <span class="trial-banner-sub">Acesse todas as ferramentas agora</span>
    </span>
    <i class="ph-fill ph-arrow-right trial-banner-arrow" aria-hidden="true"></i>
</button>

<script>
    (function () {
        // Manipula o clique em instâncias do trial-banner fora do auth-drawer
        document.addEventListener('click', (e) => {
            const banner = e.target.closest('.trial-banner');
            if (!banner) return;

            // Se o banner estiver dentro do próprio auth-drawer, não faz nada ao clicar
            if (banner.closest('#auth-drawer') || banner.closest('.auth-drawer')) return;

            window.openAuthDrawerAndCloseNav();
        });
    })();
</script>
