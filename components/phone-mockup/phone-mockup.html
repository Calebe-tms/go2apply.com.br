<!-- ==========================================================================
   Component: Phone Mockup
   Moldura de smartphone desenhada em CSS puro (sem imagem de mockup):
   corpo fosco sólido, bisel de vidro, câmera frontal discreta, botões
   laterais em relevo e indicador de gesto.

   Encaixe pixel-perfect da screenshot:
   - a tela é uma janela com `overflow: hidden` cujo raio é derivado do
     corpo (raio do corpo - espessura da moldura), então a imagem acompanha
     exatamente a curva sem vazar e sem precisar de blur ou gradiente pra
     disfarçar emenda;
   - as screenshots do app têm 738x1600 e carregam cromo do sistema
     (status bar, barra do navegador, barra de navegação do Android). A
     janela usa o recorte útil de 738x1344 e cada screenshot informa
     quanto cortar no topo pela variável `--shot-crop`.

   Tokens customizáveis pelo consumidor: `--phone-width`, `--phone-frame`,
   `--phone-radius` e `--phone-glass-ratio`.
   ========================================================================== -->
<style>
    .phone-mockup {
        /* Todos múltiplos de 4px. Entram como fallback e não como definição
           própria, senão a declaração local venceria a do consumidor e a
           escala deixaria de ser customizável de fora */
        position: relative;
        width: var(--phone-width, 264px);
        padding: var(--phone-frame, 8px);
        box-sizing: border-box;
        border-radius: var(--phone-radius, 40px);
        background-color: var(--color-dark);
        /* Bisel de vidro na borda interna + sombra em camadas difusas, todas
           no tom neutro escuro do DS: dá peso ao objeto sem chapar nem
           colorir o fundo */
        box-shadow:
            inset 0 0 0 1px rgba(var(--color-white-rgb), 0.06),
            0 2px 4px rgba(var(--color-dark-rgb), 0.08),
            0 8px 16px rgba(var(--color-dark-rgb), 0.07),
            0 24px 48px rgba(var(--color-dark-rgb), 0.1),
            0 48px 80px rgba(var(--color-dark-rgb), 0.08);
    }

    /* Botões laterais: saliências finas fora do corpo, na mesma cor, então
       aparecem só pela silhueta contra o fundo claro. São pseudo-elementos
       pra acompanharem o corpo de graça em qualquer animação */
    .phone-mockup::before,
    .phone-mockup::after {
        content: '';
        position: absolute;
        width: 4px;
        border-radius: var(--radius-full);
        background-color: var(--color-dark);
    }

    /* Volume */
    .phone-mockup::before {
        top: 96px;
        left: -4px;
        height: 32px;
    }

    /* Power */
    .phone-mockup::after {
        top: 112px;
        right: -4px;
        height: 48px;
    }

    .phone-mockup-screen {
        position: relative;
        display: block;
        /* Recorte útil da screenshot: 738x1344 dos 738x1600 originais,
           descontando o cromo do sistema operacional */
        aspect-ratio: var(--phone-glass-ratio, 738 / 1344);
        overflow: hidden;
        /* Raio interno = raio do corpo - moldura. É essa subtração que faz
           a screenshot fechar na curva da tela sem folga nem sobra */
        border-radius: calc(var(--phone-radius, 40px) - var(--phone-frame, 8px));
        background-color: var(--color-dark-surface);
    }

    .phone-mockup-shot {
        --shot-crop: 65.625%;

        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        /* A janela é mais curta que a imagem, então sobram 256px verticais
           pra distribuir. `--shot-crop` é quanto desses 256px sai do topo:
           65.625% = 168px (status bar + barra do navegador),
           25% = 64px (só status bar) */
        object-position: 50% var(--shot-crop);
    }

    /* Câmera frontal: furo discreto de 8px no topo da tela, como num
       aparelho real rodando o app em tela cheia */
    .phone-mockup-camera {
        position: absolute;
        top: 8px;
        left: 50%;
        z-index: 2;
        width: 8px;
        height: 8px;
        margin-left: -4px;
        border-radius: var(--radius-full);
        background-color: rgba(var(--color-dark-rgb), 0.92);
        box-shadow: inset 0 0 0 1px rgba(var(--color-white-rgb), 0.1);
    }

    /* Indicador de gesto do sistema, sutil sobre o conteúdo do app */
    .phone-mockup-indicator {
        position: absolute;
        bottom: 8px;
        left: 50%;
        z-index: 2;
        width: 96px;
        height: 4px;
        margin-left: -48px;
        border-radius: var(--radius-full);
        background-color: rgba(var(--color-dark-rgb), 0.28);
    }
</style>

<div class="phone-mockup" id="phone-mockup" aria-hidden="true">
    <span class="phone-mockup-screen">
        <!-- Decorativa: quem descreve a tela pra leitor de tela é o
             consumidor do componente (no showcase, a galeria de telas e a
             legenda com aria-live) -->
        <img class="phone-mockup-shot" src="assets/imagens/prints-go2apply/tebuconazol.webp" alt="" loading="lazy"
            decoding="async" width="738" height="1600" style="--shot-crop: 25%">
        <span class="phone-mockup-camera"></span>
        <span class="phone-mockup-indicator"></span>
    </span>
</div>
