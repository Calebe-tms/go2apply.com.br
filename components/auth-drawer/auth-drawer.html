                <button type="button" class="auth-chip" data-value="all"><i class="ph-fill ph-plus-circle auth-chip-icon"></i>Todos</button>
              </div>
              <input type="hidden" name="interest">
            </div>
          </div>
        </div>

        <div class="auth-form-section">
          <div class="auth-form-checkbox">
            <input type="checkbox" name="terms" id="termsCheckbox" required>
            <label for="termsCheckbox">
              Li e concordo com os <a href="#" onclick="return false;">Termos de Uso</a> e a <a href="#" onclick="return false;">Política de Privacidade</a> do go2apply.
            </label>
          </div>
        </div>

        <div class="auth-form-actions">
          <button type="submit" class="auth-btn auth-btn-primary">Criar conta</button>
          <button type="button" class="auth-btn auth-btn-secondary" id="prevStep">
            <i class="ph-fill ph-arrow-left"></i>
            Voltar
          </button>
        </div>

        <div class="auth-trust-signal">
          <i class="ph-fill ph-shield-check auth-trust-signal-icon"></i>
          <span>Seus dados estão protegidos pela LGPD</span>
        </div>
      </form>

      <div class="auth-switch-row" style="text-align: center;">
        <div class="auth-divider">Já tem conta?</div>
        <div data-component="components/btn-login/btn-login.html" style="margin-top: 0.65rem; display: inline-block;"></div>
      </div>

      <div class="auth-social-row">
        <p class="auth-social-label">Nos acompanhe</p>
        <div data-component="components/social-links/social-links.html"></div>
      </div>
    </div>
  </div>
</div>

<script>
class AuthDrawer {
  constructor() {
    this.drawer = document.getElementById('auth-drawer');
    this.backdrop = document.getElementById('authBackdrop');
    this.step1Form = document.getElementById('step1Form');
    this.step2Form = document.getElementById('step2Form');
    this.currentStep = 1;
    this.formData = {};
    this.init();
  }

  init() {
    document.getElementById('authClose')?.addEventListener('click', () => this.close());
    this.backdrop?.addEventListener('click', () => this.close());
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') this.close();
    });

    document.getElementById('nextStep')?.addEventListener('click', (e) => {
      e.preventDefault();
      if (this.validateStep1()) this.goToStep(2);
    });

    document.getElementById('prevStep')?.addEventListener('click', (e) => {
      e.preventDefault();
      this.goToStep(1);
    });

    document.querySelectorAll('.auth-stepper-tab').forEach((tab) => {
      const step = Number(tab.dataset.stepper);
      tab.addEventListener('click', () => this.goToStep(step));
      tab.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          this.goToStep(step);
        }
      });
    });

    this.step2Form?.addEventListener('submit', (e) => {
      e.preventDefault();
      this.submitForm();
    });

    this.attachValidation();
    this.attachPasswordToggle();
    this.attachPhoneMask();
    this.attachCpfMask();
    this.attachChipGroups();
  }

  attachChipGroups() {
    const setChipIcon = (chip, selected) => {
      const icon = chip.querySelector('.auth-chip-icon');
      if (!icon) return;
      icon.classList.toggle('ph-plus-circle', !selected);
      icon.classList.toggle('ph-check-circle', selected);
    };

    document.querySelectorAll('.auth-chip-group').forEach((group) => {
      const hiddenInput = group.parentElement.querySelector(`input[type="hidden"][name="${group.dataset.chipGroup}"]`);
      group.querySelectorAll('.auth-chip').forEach((chip) => {
        chip.addEventListener('click', () => {
          const alreadySelected = chip.classList.contains('is-selected');
          group.querySelectorAll('.auth-chip').forEach((c) => {
            c.classList.remove('is-selected');
            setChipIcon(c, false);
          });
          if (alreadySelected) {
            if (hiddenInput) hiddenInput.value = '';
          } else {
            chip.classList.add('is-selected');
            setChipIcon(chip, true);
            if (hiddenInput) hiddenInput.value = chip.dataset.value;
          }
        });
      });
    });
  }

  attachValidation() {
    const inputs = this.step1Form ? this.step1Form.querySelectorAll('input[required]') : [];
    inputs.forEach(input => {
      input.addEventListener('input', () => this.validateField(input));
      input.addEventListener('blur', () => this.validateField(input));
    });

    const step2Inputs = this.step2Form ? this.step2Form.querySelectorAll('input[required]') : [];
    step2Inputs.forEach(input => {
      input.addEventListener('input', () => this.validateField(input));
      input.addEventListener('blur', () => this.validateField(input));
    });
  }

  validateField(input) {
    const value = input.value.trim();
    const container = input.closest('.auth-form-input');
    if (!container) return false;
    let isValid = false;

    switch (input.name) {
      case 'fullName':
        isValid = value.length >= 3;
        break;
      case 'email':
        isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
        break;
      case 'password':
        isValid = value.length >= 6;
        this.updatePasswordStrength(value);
        break;
      case 'confirmPassword':
        const password = this.step1Form.querySelector('input[name="password"]').value;
        isValid = value === password && value.length >= 6;
        break;
      case 'phone':
        isValid = /^\(\d{2}\)\s9\d{4}-\d{4}$|^\(\d{2}\)\s\d{4}-\d{4}$/.test(value);
        break;
      case 'cpf':
        isValid = this.validateCPF(value);
        break;
      default:
        isValid = value.length > 0;
    }

    if (isValid) {
      container.classList.add('auth-form-input-valid');
    } else {
      container.classList.remove('auth-form-input-valid');
    }

    return isValid;
  }

  validateStep1() {
    const fullName = this.step1Form.querySelector('input[name="fullName"]');
    const email = this.step1Form.querySelector('input[name="email"]');
    const password = this.step1Form.querySelector('input[name="password"]');
    const confirmPassword = this.step1Form.querySelector('input[name="confirmPassword"]');

    return (
      this.validateField(fullName) &&
      this.validateField(email) &&
      this.validateField(password) &&
      this.validateField(confirmPassword)
    );
  }

  updatePasswordStrength(password) {
    const strength = document.querySelector('.auth-strength-fill');
    const text = document.getElementById('strengthText');
    const container = document.getElementById('passwordStrength');

    if (!container || !strength || !text) return;

    if (password.length === 0) {
      container.classList.remove('active');
      return;
    }

    container.classList.add('active');

    const hasUpper = /[A-Z]/.test(password);
    const hasLower = /[a-z]/.test(password);
    const hasNumber = /\d/.test(password);
    const hasSpecial = /[!@#$%^&*]/.test(password);

    let score = 0;
    if (password.length >= 6) score++;
    if (password.length >= 10) score++;
    if (hasUpper && hasLower) score++;
    if (hasNumber) score++;
    if (hasSpecial) score++;

    if (score < 2) {
      strength.className = 'auth-strength-fill';
      text.textContent = 'Fraca';
    } else if (score < 4) {
      strength.className = 'auth-strength-fill medium';
      text.textContent = 'Média';
    } else {
      strength.className = 'auth-strength-fill strong';
      text.textContent = 'Forte';
    }
  }

  validateCPF(cpf) {
    const cleaned = cpf.replace(/\D/g, '');
    if (cleaned.length !== 11) return false;

    let sum = 0;
    let remainder;

    for (let i = 1; i <= 9; i++) {
      sum += parseInt(cleaned.substring(i - 1, i)) * (11 - i);
    }

    remainder = (sum * 10) % 11;
    if (remainder === 10 || remainder === 11) remainder = 0;
    if (remainder !== parseInt(cleaned.substring(9, 10))) return false;

    sum = 0;
    for (let i = 1; i <= 10; i++) {
      sum += parseInt(cleaned.substring(i - 1, i)) * (12 - i);
    }

    remainder = (sum * 10) % 11;
    if (remainder === 10 || remainder === 11) remainder = 0;
    if (remainder !== parseInt(cleaned.substring(10, 11))) return false;

    return true;
  }

  attachPasswordToggle() {
    document.querySelectorAll('.auth-password-toggle').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const inputName = btn.dataset.toggle;
        const input = document.querySelector(`input[name="${inputName}"]`);
        const icon = btn.querySelector('i');
        if (!input || !icon) return;
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        icon.classList.toggle('ph-eye', !isPassword);
        icon.classList.toggle('ph-eye-slash', isPassword);
      });
    });
  }

  attachPhoneMask() {
    const phoneInput = document.querySelector('input[name="phone"]');
    if (phoneInput) {
      phoneInput.addEventListener('input', (e) => {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length > 11) value = value.slice(0, 11);

        if (value.length > 0) {
          if (value.length <= 2) {
            value = `(${value}`;
          } else if (value.length <= 7) {
            value = `(${value.slice(0, 2)}) ${value.slice(2)}`;
          } else {
            const isMobile = value[2] === '9';
            const start = isMobile ? 3 : 2;
            const mid = value.slice(start, start + 4);
            const end = value.slice(start + 4, start + 8);
            value = `(${value.slice(0, 2)}) ${isMobile ? '9' : ''}${mid}${end ? '-' + end : ''}`;
          }
        }

        e.target.value = value;
        this.validateField(phoneInput);
      });
    }
  }

  attachCpfMask() {
    const cpfInput = document.querySelector('input[name="cpf"]');
    if (cpfInput) {
      cpfInput.addEventListener('input', (e) => {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length > 11) value = value.slice(0, 11);

        if (value.length > 0) {
          if (value.length <= 3) {
            value = value;
          } else if (value.length <= 6) {
            value = `${value.slice(0, 3)}.${value.slice(3)}`;
          } else if (value.length <= 9) {
            value = `${value.slice(0, 3)}.${value.slice(3, 6)}.${value.slice(6)}`;
          } else {
            value = `${value.slice(0, 3)}.${value.slice(3, 6)}.${value.slice(6, 9)}-${value.slice(9)}`;
          }
        }

        e.target.value = value;
        this.validateField(cpfInput);
      });
    }
  }

  goToStep(step) {
    if (step === this.currentStep) return;
    const goingForward = step > this.currentStep;
    this.currentStep = step;
    const outgoing = step === 1 ? this.step2Form : this.step1Form;
    const incoming = step === 1 ? this.step1Form : this.step2Form;

    const swap = () => {
      outgoing.classList.remove('active');
      incoming.classList.add('active');
    };

    if (window.gsap && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const distance = goingForward ? 24 : -24;
      gsap.to(outgoing, {
        opacity: 0,
        x: -distance,
        duration: 0.18,
        ease: 'power2.in',
        onComplete: () => {
          swap();
          gsap.fromTo(incoming, { opacity: 0, x: distance }, { opacity: 1, x: 0, duration: 0.28, ease: 'power2.out' });
        }
      });
    } else {
      swap();
    }

    this.updateStepper(step);
  }

  updateStepper(step) {
    const stepper = document.getElementById('authStepper');
    if (!stepper) return;
    const step1El = stepper.querySelector('[data-stepper="1"]');
    const step2El = stepper.querySelector('[data-stepper="2"]');

    if (step === 1) {
      step1El?.classList.add('is-active');
      step1El?.classList.remove('is-complete');
      step2El?.classList.remove('is-active', 'is-complete');
    } else {
      step1El?.classList.remove('is-active');
      step1El?.classList.add('is-complete');
      step2El?.classList.add('is-active');
    }
  }

  submitForm() {
    const termsCheckbox = this.step2Form.querySelector('input[name="terms"]');
    if (!termsCheckbox.checked) {
      alert('Você deve concordar com os Termos de Uso e Política de Privacidade');
      return;
    }

    const formData = new FormData(this.step1Form);
    const step2Data = new FormData(this.step2Form);

    for (let [key, value] of step2Data) {
      if (value) formData.append(key, value);
    }

    console.log('Formulário submetido:', Object.fromEntries(formData));
    alert('Cadastro realizado com sucesso!');
    this.close();
  }

  open() {
    if (!this.drawer) return;
    this.drawer.classList.add('active');
    if (this.backdrop) this.backdrop.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  close() {
    if (!this.drawer) return;
    this.drawer.classList.remove('active');
    if (this.backdrop) this.backdrop.classList.remove('active');
    document.body.style.overflow = '';
  }

  toggle() {
    if (!this.drawer) return;
    if (this.drawer.classList.contains('active')) {
      this.close();
    } else {
      this.open();
    }
  }
}

window.authDrawer = new AuthDrawer();

window.openAuthDrawer = () => window.authDrawer.open();
window.closeAuthDrawer = () => window.authDrawer.close();
</script>
