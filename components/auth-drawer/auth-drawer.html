<style>
.auth-drawer-backdrop {
  position: fixed;
  inset: 0;
  z-index: 9998;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(8px);
  opacity: 0;
  pointer-events: none;

}

.auth-drawer-backdrop.active {
  opacity: 1;
  pointer-events: auto;
}

.auth-drawer.active {
  transform: translateX(0);
}

.auth-drawer-header {
  display: flex;
  align-items: center;

  border-bottom: 1px solid rgba(254, 252, 248, 0.04);

.auth-drawer-logo {

}

.auth-drawer-close {

}

.auth-drawer-close:hover {
  opacity: 1;
}

.auth-drawer-content {

  overflow-y: auto;
  padding: 2rem 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.auth-drawer-title {

}

.auth-drawer-subtitle {

}

.auth-form-step {
  display: none;
  animation: fadeIn 300ms ease;
}

.auth-form-step.active {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

@keyframes fadeIn {

.auth-form-field {

}

.auth-form-label {

}

.auth-form-label-icon {
  width: 18px;
  height: 18px;
  opacity: 0.6;
  transition: opacity 200ms ease;
}

.auth-form-input {
  position: relative;

  align-items: center;
}

.auth-form-input input,
.auth-form-input select {
  flex: 1;
  background: rgba(254, 252, 248, 0.04);
  border: 1px solid rgba(254, 252, 248, 0.08);

  padding: 0.75rem 1rem;
  color: var(--color-white, #fefcf8);

.auth-form-input input::placeholder {

.auth-form-input input:focus,

.auth-form-check {

.auth-strength-fill.medium {

.auth-strength-fill.strong {

.auth-form-section {

<script>
class AuthDrawer {
  constructor() {
    this.drawer = document.getElementById('auth-drawer') || document.getElementById('authDrawer');
    this.backdrop = document.getElementById('authBackdrop');
    this.step1Form = document.getElementById('step1Form');
    this.step2Form = document.getElementById('step2Form');
    this.currentStep = 1;
    this.formData = {};
    this.init();
  }

  init() {
    document.getElementById('authClose')?.addEventListener('click', () => this.close());
    this.backdrop?.addEventListener('click', () => this.close());
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') this.close();
    });

    document.getElementById('nextStep')?.addEventListener('click', (e) => {
      e.preventDefault();
      if (this.validateStep1()) this.goToStep(2);
    });

    document.getElementById('prevStep')?.addEventListener('click', (e) => {
      e.preventDefault();
      this.goToStep(1);
    });

    document.getElementById('switchToLogin')?.addEventListener('click', () => {
      alert('Login não implementado ainda');
    });

    this.step2Form?.addEventListener('submit', (e) => {
      e.preventDefault();
      this.submitForm();
    });

    this.attachValidation();
    this.attachPasswordToggle();
    this.attachPhoneMask();
    this.attachCpfMask();
  }

  attachValidation() {
    const inputs = this.step1Form ? this.step1Form.querySelectorAll('input[required]') : [];
    inputs.forEach(input => {
      input.addEventListener('input', () => this.validateField(input));
      input.addEventListener('blur', () => this.validateField(input));
    });

    const step2Inputs = this.step2Form ? this.step2Form.querySelectorAll('input[required]') : [];
    step2Inputs.forEach(input => {
      input.addEventListener('input', () => this.validateField(input));
      input.addEventListener('blur', () => this.validateField(input));
    });
  }

  validateField(input) {
    const value = input.value.trim();
    const container = input.closest('.auth-form-input');
    if (!container) return false;
    let isValid = false;

    switch (input.name) {
      case 'fullName':
        isValid = value.length >= 3;
        break;
      case 'email':
        isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
        break;
      case 'password':
        isValid = value.length >= 6;
        this.updatePasswordStrength(value);
        break;
      case 'confirmPassword':
        const password = this.step1Form.querySelector('input[name="password"]').value;
        isValid = value === password && value.length >= 6;
        break;
      case 'phone':
        isValid = /^\(\d{2}\)\s9\d{4}-\d{4}$|^\(\d{2}\)\s\d{4}-\d{4}$/.test(value);
        break;
      case 'cpf':
        isValid = this.validateCPF(value);
        break;
      default:
        isValid = value.length > 0;
    }

    if (isValid) {
      container.classList.add('auth-form-input-valid');
    } else {
      container.classList.remove('auth-form-input-valid');
    }

    return isValid;
  }

  validateStep1() {
    const fullName = this.step1Form.querySelector('input[name="fullName"]');
    const email = this.step1Form.querySelector('input[name="email"]');
    const password = this.step1Form.querySelector('input[name="password"]');
    const confirmPassword = this.step1Form.querySelector('input[name="confirmPassword"]');

    return (
      this.validateField(fullName) &&
      this.validateField(email) &&
      this.validateField(password) &&
      this.validateField(confirmPassword)
    );
  }

  updatePasswordStrength(password) {
    const strength = document.querySelector('.auth-strength-fill');
    const text = document.getElementById('strengthText');
    const container = document.getElementById('passwordStrength');

    if (!container || !strength || !text) return;

    if (password.length === 0) {
      container.classList.remove('active');
      return;
    }

    container.classList.add('active');

    const hasUpper = /[A-Z]/.test(password);
    const hasLower = /[a-z]/.test(password);
    const hasNumber = /\d/.test(password);
    const hasSpecial = /[!@#$%^&*]/.test(password);

    let score = 0;
    if (password.length >= 6) score++;
    if (password.length >= 10) score++;
    if (hasUpper && hasLower) score++;
    if (hasNumber) score++;
    if (hasSpecial) score++;

    if (score < 2) {
      strength.className = 'auth-strength-fill';
      text.textContent = 'Fraca';
    } else if (score < 4) {
      strength.className = 'auth-strength-fill medium';
      text.textContent = 'Média';
    } else {
      strength.className = 'auth-strength-fill strong';
      text.textContent = 'Forte';
    }
  }

  validateCPF(cpf) {
    const cleaned = cpf.replace(/\D/g, '');
    if (cleaned.length !== 11) return false;

    let sum = 0;
    let remainder;

    for (let i = 1; i <= 9; i++) {
      sum += parseInt(cleaned.substring(i - 1, i)) * (11 - i);
    }

    remainder = (sum * 10) % 11;
    if (remainder === 10 || remainder === 11) remainder = 0;
    if (remainder !== parseInt(cleaned.substring(9, 10))) return false;

    sum = 0;
    for (let i = 1; i <= 10; i++) {
      sum += parseInt(cleaned.substring(i - 1, i)) * (12 - i);
    }

    remainder = (sum * 10) % 11;
    if (remainder === 10 || remainder === 11) remainder = 0;
    if (remainder !== parseInt(cleaned.substring(10, 11))) return false;

    return true;
  }

  attachPasswordToggle() {
    document.querySelectorAll('.auth-password-toggle').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const inputName = btn.dataset.toggle;
        const input = document.querySelector(`input[name="${inputName}"]`);
        if (!input) return;
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        btn.textContent = isPassword ? '👁️‍🗨️' : '👁️';
      });
    });
  }

  attachPhoneMask() {
    const phoneInput = document.querySelector('input[name="phone"]');
    if (phoneInput) {
      phoneInput.addEventListener('input', (e) => {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length > 11) value = value.slice(0, 11);

        if (value.length > 0) {
          if (value.length <= 2) {
            value = `(${value}`;
          } else if (value.length <= 7) {
            value = `(${value.slice(0, 2)}) ${value.slice(2)}`;
          } else {
            value = `(${value.slice(0, 2)}) ${value[2] === '9' ? '9' : ''}${value.slice(3, 8)}-${value.slice(8)}`;
          }
        }

        e.target.value = value;
        this.validateField(phoneInput);
      });
    }
  }

  attachCpfMask() {
    const cpfInput = document.querySelector('input[name="cpf"]');
    if (cpfInput) {
      cpfInput.addEventListener('input', (e) => {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length > 11) value = value.slice(0, 11);

        if (value.length > 0) {
          if (value.length <= 3) {
            value = value;
          } else if (value.length <= 6) {
            value = `${value.slice(0, 3)}.${value.slice(3)}`;
          } else if (value.length <= 9) {
            value = `${value.slice(0, 3)}.${value.slice(3, 6)}.${value.slice(6)}`;
          } else {
            value = `${value.slice(0, 3)}.${value.slice(3, 6)}.${value.slice(6, 9)}-${value.slice(9)}`;
          }
        }

        e.target.value = value;
        this.validateField(cpfInput);
      });
    }
  }

  goToStep(step) {
    this.currentStep = step;
    if (step === 1) {
      this.step1Form.classList.add('active');
      this.step2Form.classList.remove('active');
    } else {
      this.step1Form.classList.remove('active');
      this.step2Form.classList.add('active');
    }
  }

  submitForm() {
    const termsCheckbox = this.step2Form.querySelector('input[name="terms"]');
    if (!termsCheckbox.checked) {
      alert('Você deve concordar com os Termos de Uso e Política de Privacidade');
      return;
    }

    const formData = new FormData(this.step1Form);
    const step2Data = new FormData(this.step2Form);

    for (let [key, value] of step2Data) {
      if (value) formData.append(key, value);
    }

    console.log('Formulário submetido:', Object.fromEntries(formData));
    alert('Cadastro realizado com sucesso!');
    this.close();
  }

  open() {
    if (!this.drawer) return;
    this.drawer.classList.add('active');
    if (this.backdrop) this.backdrop.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  close() {
    if (!this.drawer) return;
    this.drawer.classList.remove('active');
    if (this.backdrop) this.backdrop.classList.remove('active');
    document.body.style.overflow = '';
  }

  toggle() {
    if (!this.drawer) return;
    if (this.drawer.classList.contains('active')) {
      this.close();
    } else {
      this.open();
    }
  }
}

window.authDrawer = new AuthDrawer();

window.openAuthDrawer = () => window.authDrawer.open();
window.closeAuthDrawer = () => window.authDrawer.close();
</script>
