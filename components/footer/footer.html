<style>
    .footer {
        position: relative;
        padding: var(--space-xl) 2rem var(--space-lg) 2rem;
        background: var(--color-dark-surface);
        border-top: 1px solid var(--color-border);
    }

    .footer__inner {
        max-width: 1400px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1.2fr 1fr 1fr;
        gap: var(--space-xl);
        padding-bottom: var(--space-lg);
        border-bottom: 1px solid var(--color-border);
    }

    .footer__brand-logo {
        height: 32px;
        width: auto;
        margin-bottom: var(--space-sm);
    }

    .footer__tagline {
        color: var(--color-white-muted);
        font-size: var(--font-size-sm);
        line-height: 1.6;
        max-width: 32ch;
    }

    .footer__col-title {
        color: var(--color-white);
        font-size: var(--font-size-xs);
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: var(--space-md);
    }

    .footer__links {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
    }

    .footer__links a {
        color: var(--color-white-muted);
        font-size: var(--font-size-base);
        transition: color 0.25s ease;
    }

    .footer__links a:hover {
        color: var(--color-orange);
    }

    .footer__social {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        margin-top: var(--space-sm);
    }

    .footer__social a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: var(--radius-full);
        color: var(--color-white);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--color-border-subtle);
        transition: var(--transition-smooth);
    }

    .footer__social a:hover {
        background: var(--color-orange);
        border-color: var(--color-orange);
        transform: translateY(-2px);
    }

    .footer__bottom {
        max-width: 1400px;
        margin: 0 auto;
        padding-top: var(--space-md);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
    }

    .footer__copy {
        color: rgba(var(--color-white-rgb), 0.4);
        font-size: var(--font-size-xs);
    }

    .footer__powered {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: rgba(var(--color-white-rgb), 0.4);
        font-size: var(--font-size-xs);
    }

    .footer__powered img {
        height: 16px;
        width: auto;
        opacity: 0.8;
    }

    @media (max-width: 768px) {
        .footer__inner {
            grid-template-columns: 1fr;
            gap: var(--space-lg);
        }

        .footer__bottom {
            flex-direction: column;
            align-items: flex-start;
        }
    }

    @media (max-width: 600px) {
        .footer {
            padding: var(--space-lg) 1.25rem var(--space-md) 1.25rem;
        }
    }
</style>

<footer class="footer">
    <div class="footer__inner">
        <div>
            <img src="assets/imagens/go2apply-logo-colorido.png" alt="Go2Apply" class="footer__brand-logo">
            <p class="footer__tagline">Tecnologia e conhecimento técnico aplicados à pulverização agrícola.</p>
        </div>

        <div>
            <div class="footer__col-title">Navegação</div>
            <nav class="footer__links">
                <a href="#solucoes">Plataforma</a>
                <a href="#diferenciais">Recursos</a>
                <a href="#planos">Planos</a>
                <a href="#faq">FAQ</a>
            </nav>
        </div>

        <div>
            <div class="footer__col-title">Redes</div>
            <div class="footer__social">
                <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                    </svg>
                </a>
                <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
                        <rect x="2" y="9" width="4" height="12"></rect>
                        <circle cx="4" cy="4" r="2"></circle>
                    </svg>
                </a>
                <a href="https://wa.me" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                    </svg>
                </a>
            </div>
        </div>
    </div>

    <div class="footer__bottom">
        <span class="footer__copy">© 2026 Go2Apply. Todos os direitos reservados.</span>
        <span class="footer__powered">
            <img src="assets/imagens/equalizagro-logo.png" alt="Equalizagro">
            <span>Um produto Equalizagro</span>
        </span>
    </div>
</footer>
