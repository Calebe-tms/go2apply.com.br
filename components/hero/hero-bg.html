<!-- ==========================================================================
   Component: Hero Background
   Carrossel contínuo de vídeos Cloudinary com Radar Circular Interativo
   ========================================================================== -->
<style>
    .hero-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        overflow: hidden;
    }

    .bg-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        z-index: 1;
        transition: opacity 1.4s cubic-bezier(0.4, 0, 0.2, 1);
        will-change: opacity;
        pointer-events: none;
    }

    .bg-video.active { opacity: 1; z-index: 2; }
    .bg-video.base   { opacity: 1; z-index: 1; }

    /* Overlay Gradiente Vinculado aos Tokens Oficiais do DS */
    .hero-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--hero-overlay-gradient);
        z-index: 3;
        pointer-events: none;
    }

    .hero-canvas {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 6;
        pointer-events: none;
    }
</style>

<div class="hero-bg">
    <video id="bg-video-1" class="bg-video active" muted playsinline autoplay></video>
    <video id="bg-video-2" class="bg-video" muted playsinline></video>
    <div class="hero-overlay"></div>
</div>
<canvas id="hero-mesh-canvas" class="hero-canvas"></canvas>

<script>
    const HERO_VIDEOS = [
        'https://res.cloudinary.com/vdgkx5jc/video/upload/f_auto,q_auto/v1787863807/13678744_1920_1080_60fps.mp4',
        'https://res.cloudinary.com/vdgkx5jc/video/upload/f_auto,q_auto/v1787863806/7542596-uhd_3840_2160_30fps.mp4'
    ];

    // Cores e fontes do radar/mini-celular: valores exatos já usados no canvas
    // (RADAR_ACCENT_RGB difere em 1 unidade de --color-orange-rgb por já estar assim hoje)
    const RADAR_ACCENT_RGB = '242, 142, 18';
    const PHONE_BG_RGB = '18, 24, 16';
    const RADAR_WHITE_RGB = '255, 255, 255';
    const PHONE_FONT_TITLE = '700 7.5px "Host Grotesk", sans-serif';
    const PHONE_FONT_LABEL = '500 7px "Host Grotesk", sans-serif';
    const PHONE_FONT_VALUE = '600 7.5px "Host Grotesk", sans-serif';
    const PHONE_FONT_FOOTER = '500 6.5px "Host Grotesk", sans-serif';
    const FIELD_MARKER_FONT = '600 10.5px "Host Grotesk", sans-serif';

    const MOBILE_BREAKPOINT = 600;
    const MAX_DPR = 2;
    const RADAR_RING_FRACTIONS = [0.12, 0.25, 0.40, 0.58, 0.76, 0.94, 1.0];
    const RADAR_ROTATION_SPEED = 0.0038;
    const RADAR_PULSE_SPEED = 0.0008;
    const RADAR_ALPHA_LERP_FACTOR = 0.04;
    const RADAR_ALPHA_IDLE = 0.50;
    const RADAR_ALPHA_ACTIVE = 0.35;
    const RADAR_ALPHA_OBSTACLE = 0.20;
    const POINTER_LERP_FACTOR = 0.1;
    const POINTER_IDLE_MS = 1000;
    const POINTER_LINK_MIN_DISTANCE = 70;
    const PHONE_GLOW_DECAY = 0.02;

    // --- 1. Carrossel de Vídeos Nativo HTML5 Resiliente em Loop Infinito ---
    function initVideoCarousel() {
        const vid1 = document.getElementById('bg-video-1');
        const vid2 = document.getElementById('bg-video-2');
        if (!vid1 || !vid2 || HERO_VIDEOS.length === 0) return;

        let currentIdx = 0;
        let actVideo = vid1;
        let inactVideo = vid2;
        let inTransition = false;
        let firstFrameFired = false;
        let transitionTimeout = null;
        let nxtIdx = (currentIdx + 1) % HERO_VIDEOS.length;

        const notifyFirstFrame = () => {
            if (firstFrameFired) return;
            firstFrameFired = true;
            window.dispatchEvent(new CustomEvent('hero:first-video-ready'));
        };

        // Troca as classes ativa/base e recicla o vídeo anterior após o crossfade
        const startFade = () => {
            actVideo.className = 'bg-video base';
            inactVideo.className = 'bg-video active';

            setTimeout(() => {
                actVideo.pause();
                actVideo.currentTime = 0;
                actVideo.className = 'bg-video';

                currentIdx = nxtIdx;
                nxtIdx = (currentIdx + 1) % HERO_VIDEOS.length;

                const temp = actVideo;
                actVideo = inactVideo;
                inactVideo = temp;

                inactVideo.src = HERO_VIDEOS[nxtIdx];
                inactVideo.load();

                inTransition = false;
                if (transitionTimeout) clearTimeout(transitionTimeout);
            }, 1400);
        };

        // Executa a transição suave de crossfade entre os dois elementos de vídeo
        const triggerCrossfade = () => {
            if (inTransition) return;
            inTransition = true;

            // Timer de segurança contra travamento de Promise
            if (transitionTimeout) clearTimeout(transitionTimeout);
            transitionTimeout = setTimeout(() => {
                inTransition = false;
            }, 3000);

            const playPromise = inactVideo.play();
            if (playPromise === undefined) {
                startFade();
                return;
            }

            playPromise
                .then(startFade)
                .catch(err => {
                    console.warn('Recuperando erro de crossfade:', err);
                    // Fallback: se o próximo falhar, reinicia o vídeo atual para nunca pausar
                    inTransition = false;
                    if (actVideo.paused) {
                        actVideo.currentTime = 0;
                        actVideo.play().catch(() => {});
                    }
                });
        };

        // Monitora o progresso do vídeo ativo para disparar o crossfade 1.5s antes do fim
        const onProgress = (e) => {
            const video = e.target;
            if (video !== actVideo || inTransition || !video.duration || isNaN(video.duration)) return;
            if (video.duration - video.currentTime <= 1.5) {
                triggerCrossfade();
            }
        };

        // Fallback no evento ended caso timeupdate tenha sido suspenso pelo navegador
        const onEnded = (e) => {
            if (e.target === actVideo) triggerCrossfade();
        };

        // Watchdog para erros de carregamento e stalls de rede
        const onVidError = () => {
            inTransition = false;
            nxtIdx = (nxtIdx + 1) % HERO_VIDEOS.length;
            inactVideo.src = HERO_VIDEOS[nxtIdx];
            inactVideo.load();
        };

        [vid1, vid2].forEach(v => {
            v.addEventListener('playing', notifyFirstFrame);
            v.addEventListener('canplay', notifyFirstFrame);
        });

        // Configuração inicial do primeiro vídeo
        actVideo.src = HERO_VIDEOS[currentIdx];
        actVideo.load();
        actVideo.play().catch(e => console.warn('Autoplay video 1:', e));

        // Pré-carrega o próximo vídeo no buffer
        inactVideo.src = HERO_VIDEOS[nxtIdx];
        inactVideo.load();

        vid1.addEventListener('timeupdate', onProgress);
        vid2.addEventListener('timeupdate', onProgress);
        vid1.addEventListener('ended', onEnded);
        vid2.addEventListener('ended', onEnded);
        vid1.addEventListener('error', onVidError);
        vid2.addEventListener('error', onVidError);

        // Retomada automática caso a aba do navegador volte a ficar ativa
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && actVideo && actVideo.paused) {
                actVideo.play().catch(() => {});
            }
        });
    }

    // --- 2. Motor do Radar no Canto Inferior Esquerdo (Oculta mini-celular no mobile) ---
    function initRadarCanvas() {
        const canvas = document.getElementById('hero-mesh-canvas');
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        let width = 0;
        let height = 0;
        let dpr = window.devicePixelRatio || 1;
        let animationFrameId = null;

        const mouse = {
            x: null,
            y: null,
            targetX: null,
            targetY: null,
            isNearObstacle: false,
            hasMoved: false
        };

        let phoneCenter = { x: 0, y: 0 };
        let phoneDim = { width: 78, height: 142, radius: 14 };
        let phoneSyncGlow = 0;

        let radarAlpha = 0.4;
        let radarAngle = -Math.PI * 0.25;

        let pulses = [
            { progress: 0.1 },
            { progress: 0.45 },
            { progress: 0.8 }
        ];

        const technicalMetrics = [
            'pH: 6.4',
            'Kow: 2.85',
            'VMD: 230µm',
            'Gotas: 215/cm²',
            'Vazão: 110 L/ha',
            'Calda: Estável',
            'Deriva: Baixa',
            'Pressão: 3.0 bar'
        ];
        let metricIndex = 0;

        let phoneTelemetryList = [
            { label: 'pH', value: '6.4' },
            { label: 'Kow', value: '2.85' },
            { label: 'VMD', value: '230µm' },
            { label: 'Vazão', value: '110 L/h' },
            { label: 'Gotas', value: '215/cm²' }
        ];

        let fieldData = [];
        let lastSpawnPos = { x: 0, y: 0 };
        let lastSpawnTime = 0;
        let lastPointerMoveTime = 0;

        function resizeCanvas() {
            width = window.innerWidth;
            const heroSection = document.getElementById('home');
            const heroHeight = heroSection ? heroSection.offsetHeight : window.innerHeight;
            const totalDocHeight = Math.max(document.documentElement.scrollHeight || 0, document.body.scrollHeight || 0, window.innerHeight * 2.5);

            height = totalDocHeight;
            dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);

            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);

            const isMobile = width <= MOBILE_BREAKPOINT;
            if (isMobile) {
                // Dimensões compactas e posicionamento simétrico próximo à borda e mais alto
                phoneDim = { width: 44, height: 78, radius: 7 };
                phoneCenter.x = 18 + phoneDim.width / 2;
                phoneCenter.y = heroHeight - 118;
            } else {
                phoneDim = { width: 78, height: 142, radius: 14 };
                phoneCenter.x = 42 + phoneDim.width / 2;
                phoneCenter.y = heroHeight - 156;
            }

            if (mouse.x === null) {
                mouse.x = width * 0.5;
                mouse.y = heroHeight * 0.38;
                mouse.targetX = mouse.x;
                mouse.targetY = mouse.y;
            }
        }

        function spawnFieldData(cursorX, cursorY) {
            const metric = technicalMetrics[metricIndex % technicalMetrics.length];
            metricIndex++;

            // Spawna os dados exatamente no rastro do mouse com leve dispersão
            const angle = Math.random() * Math.PI * 2;
            const dist = 6 + Math.random() * 14;
            const startX = cursorX + Math.cos(angle) * dist;
            const startY = cursorY + Math.sin(angle) * dist;

            fieldData.push({
                x: startX,
                y: startY,
                vx: (Math.random() - 0.5) * 0.3,
                vy: -0.32 - Math.random() * 0.28,
                text: metric,
                life: 1.0,
                decay: 0.007
            });

            if (fieldData.length > 8) {
                fieldData.shift();
            }

            const parts = metric.split(': ');
            if (parts.length === 2) {
                phoneTelemetryList.unshift({ label: parts[0], value: parts[1] });
                if (phoneTelemetryList.length > 5) {
                    phoneTelemetryList.pop();
                }
            }
            phoneSyncGlow = 1.0;
        }

        function drawPhoneFrame(x, y, w, h, r, cx, alpha) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();

            const bgAlpha = (0.42 + phoneSyncGlow * 0.15) * alpha;
            ctx.fillStyle = `rgba(${PHONE_BG_RGB}, ${bgAlpha})`;
            ctx.fill();

            const borderAlpha = (0.34 + phoneSyncGlow * 0.25) * alpha;
            ctx.strokeStyle = `rgba(${RADAR_ACCENT_RGB}, ${borderAlpha})`;
            ctx.lineWidth = 1.0;
            ctx.stroke();

            const notchW = w < 50 ? 11 : 18;
            const notchH = w < 50 ? 2.5 : 3.5;
            ctx.beginPath();
            ctx.roundRect ? ctx.roundRect(cx - notchW / 2, y + (w < 50 ? 3.5 : 5), notchW, notchH, 1.5) : ctx.rect(cx - notchW / 2, y + (w < 50 ? 3.5 : 5), notchW, notchH);
            ctx.fillStyle = `rgba(${RADAR_ACCENT_RGB}, ${0.45 * alpha})`;
            ctx.fill();

            const barW = w < 50 ? 13 : 20;
            ctx.beginPath();
            ctx.moveTo(cx - barW / 2, y + h - (w < 50 ? 4.5 : 6));
            ctx.lineTo(cx + barW / 2, y + h - (w < 50 ? 4.5 : 6));
            ctx.strokeStyle = `rgba(${RADAR_WHITE_RGB}, ${0.35 * alpha})`;
            ctx.lineWidth = 1.0;
            ctx.stroke();
        }

        function drawPhoneHeader(x, y, w, screenAlpha) {
            const isSmall = w < 50;
            ctx.font = isSmall ? '700 5.2px "Host Grotesk", sans-serif' : (w < 65 ? '700 6px "Host Grotesk", sans-serif' : PHONE_FONT_TITLE);
            ctx.fillStyle = `rgba(${RADAR_ACCENT_RGB}, ${screenAlpha})`;
            ctx.fillText('go2apply', x + (isSmall ? 4.5 : 8), y + (isSmall ? 11.5 : 19));

            ctx.beginPath();
            ctx.moveTo(x + (isSmall ? 4.5 : 8), y + (isSmall ? 14 : 23));
            ctx.lineTo(x + w - (isSmall ? 4.5 : 8), y + (isSmall ? 14 : 23));
            ctx.strokeStyle = `rgba(${RADAR_WHITE_RGB}, ${0.15 * screenAlpha})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
        }

        function drawPhoneTelemetryRows(x, y, w, screenAlpha) {
            const isSmall = w < 50;
            const startRowY = y + (isSmall ? 22 : 36);
            const rowHeight = isSmall ? 9.5 : 16;
            const maxRows = isSmall ? 4 : phoneTelemetryList.length;

            for (let idx = 0; idx < Math.min(maxRows, phoneTelemetryList.length); idx++) {
                const row = phoneTelemetryList[idx];
                const rowY = startRowY + idx * rowHeight;
                const rowAlpha = (idx === 0 ? 0.95 : Math.max(0.4, 0.75 - idx * 0.08)) * screenAlpha;

                ctx.beginPath();
                ctx.arc(x + (isSmall ? 5.5 : 10), rowY - 1.8, isSmall ? 0.8 : 1.2, 0, Math.PI * 2);
                ctx.fillStyle = idx === 0 ? `rgba(${RADAR_ACCENT_RGB}, ${rowAlpha})` : `rgba(${RADAR_WHITE_RGB}, ${rowAlpha * 0.5})`;
                ctx.fill();

                ctx.font = isSmall ? '500 4.8px "Host Grotesk", sans-serif' : (w < 65 ? '500 5.5px "Host Grotesk", sans-serif' : PHONE_FONT_LABEL);
                ctx.fillStyle = `rgba(${RADAR_WHITE_RGB}, ${rowAlpha * 0.7})`;
                ctx.fillText(row.label, x + (isSmall ? 9 : 16), rowY);

                ctx.font = isSmall ? '600 5.2px "Host Grotesk", sans-serif' : (w < 65 ? '600 6px "Host Grotesk", sans-serif' : PHONE_FONT_VALUE);
                ctx.fillStyle = idx === 0 ? `rgba(${RADAR_ACCENT_RGB}, ${rowAlpha})` : `rgba(${RADAR_WHITE_RGB}, ${rowAlpha * 0.85})`;
                ctx.textAlign = 'right';
                ctx.fillText(row.value, x + w - (isSmall ? 4.5 : 8), rowY);
                ctx.textAlign = 'left';
            }
        }

        function drawPhoneFooter(x, y, h, screenAlpha) {
            const isSmall = phoneDim.width < 50;
            ctx.beginPath();
            ctx.arc(x + (isSmall ? 5.5 : 10), y + h - (isSmall ? 7.5 : 14), isSmall ? 1.0 : 1.5, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${RADAR_ACCENT_RGB}, ${screenAlpha})`;
            ctx.fill();

            ctx.font = isSmall ? '500 4.5px "Host Grotesk", sans-serif' : (phoneDim.width < 65 ? '500 5px "Host Grotesk", sans-serif' : PHONE_FONT_FOOTER);
            ctx.fillStyle = `rgba(${RADAR_ACCENT_RGB}, ${0.75 * screenAlpha})`;
            ctx.fillText('SYNC OK', x + (isSmall ? 8.5 : 15), y + h - (isSmall ? 6.2 : 12.5));
        }

        function drawSmartphone(cx, cy, alpha) {
            const w = phoneDim.width;
            const h = phoneDim.height;
            const r = phoneDim.radius;
            const x = cx - w / 2;
            const y = cy - h / 2;
            const screenAlpha = (0.75 + phoneSyncGlow * 0.15) * alpha;

            ctx.save();
            drawPhoneFrame(x, y, w, h, r, cx, alpha);
            drawPhoneHeader(x, y, w, screenAlpha);
            drawPhoneTelemetryRows(x, y, w, screenAlpha);
            drawPhoneFooter(x, y, h, screenAlpha);
            ctx.restore();
        }

        function updatePointerLerp() {
            if (mouse.targetX === null || mouse.targetY === null) return;
            mouse.x += (mouse.targetX - mouse.x) * POINTER_LERP_FACTOR;
            mouse.y += (mouse.targetY - mouse.y) * POINTER_LERP_FACTOR;
        }

        function updateGlowState() {
            const now = performance.now();
            const isIdle = (now - lastPointerMoveTime > POINTER_IDLE_MS);
            let targetAlpha = isIdle ? RADAR_ALPHA_IDLE : RADAR_ALPHA_ACTIVE;

            if (mouse.isNearObstacle) {
                targetAlpha = RADAR_ALPHA_OBSTACLE;
            }

            radarAlpha += (targetAlpha - radarAlpha) * RADAR_ALPHA_LERP_FACTOR;

            if (phoneSyncGlow > 0) {
                phoneSyncGlow = Math.max(0, phoneSyncGlow - PHONE_GLOW_DECAY);
            }
        }

        function drawRadarRings(px, py, radarRadius) {
            for (const frac of RADAR_RING_FRACTIONS) {
                const r = radarRadius * frac;
                ctx.beginPath();
                ctx.arc(px, py, r, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(${RADAR_ACCENT_RGB}, ${0.1 * radarAlpha})`;
                ctx.lineWidth = 0.6;
                ctx.setLineDash(frac === 1.0 || frac === 0.58 ? [4, 8] : [2, 6]);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        function drawRadarPulses(px, py, radarRadius) {
            for (let i = 0; i < pulses.length; i++) {
                const p = pulses[i];
                p.progress += RADAR_PULSE_SPEED;
                if (p.progress > 1.0) p.progress = 0;

                const pRadius = radarRadius * p.progress;
                const pAlpha = (1 - p.progress) * 0.28 * radarAlpha;

                ctx.beginPath();
                ctx.arc(px, py, pRadius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(${RADAR_ACCENT_RGB}, ${pAlpha})`;
                ctx.lineWidth = 0.6;
                ctx.stroke();
            }
        }

        function drawRadarSweep(px, py, radarRadius) {
            ctx.save();
            const lineGrad = ctx.createLinearGradient(
                px, py,
                px + Math.cos(radarAngle) * radarRadius,
                py + Math.sin(radarAngle) * radarRadius
            );
            lineGrad.addColorStop(0, `rgba(${RADAR_ACCENT_RGB}, ${0.52 * radarAlpha})`);
            lineGrad.addColorStop(0.35, `rgba(${RADAR_ACCENT_RGB}, ${0.28 * radarAlpha})`);
            lineGrad.addColorStop(0.75, `rgba(${RADAR_ACCENT_RGB}, ${0.1 * radarAlpha})`);
            lineGrad.addColorStop(1, `rgba(${RADAR_ACCENT_RGB}, 0)`);

            ctx.beginPath();
            ctx.moveTo(px, py);
            ctx.lineTo(px + Math.cos(radarAngle) * radarRadius, py + Math.sin(radarAngle) * radarRadius);
            ctx.strokeStyle = lineGrad;
            ctx.lineWidth = 0.85;
            ctx.stroke();
            ctx.restore();
        }

        function drawPointerMarker() {
            const markerAlpha = Math.max(0.65, radarAlpha);

            ctx.save();
            // Anel externo no cursor do mouse
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 5.5, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(${RADAR_ACCENT_RGB}, ${0.85 * markerAlpha})`;
            ctx.lineWidth = 1.2;
            ctx.stroke();

            // Ponto central no cursor
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 1.8, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${RADAR_ACCENT_RGB}, ${0.95 * markerAlpha})`;
            ctx.fill();
            ctx.restore();
        }

        function drawFieldMarker(item) {
            let itemOpacity = 1.0;
            if (item.life > 0.8) {
                itemOpacity = (1.0 - item.life) / 0.2;
            } else if (item.life < 0.3) {
                itemOpacity = item.life / 0.3;
            }

            const currentAlpha = itemOpacity * (mouse.isNearObstacle ? 0.35 : 0.95) * radarAlpha;

            ctx.save();
            ctx.beginPath();
            ctx.arc(item.x, item.y, 2.4, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${RADAR_ACCENT_RGB}, ${0.95 * currentAlpha})`;
            ctx.shadowColor = `rgba(${RADAR_ACCENT_RGB}, 0.7)`;
            ctx.shadowBlur = 6;
            ctx.fill();

            ctx.beginPath();
            ctx.arc(item.x, item.y, 6 + (1 - item.life) * 5, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(${RADAR_ACCENT_RGB}, ${0.45 * currentAlpha})`;
            ctx.lineWidth = 0.7;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(item.x + 4, item.y);
            ctx.lineTo(item.x + 12, item.y);
            ctx.strokeStyle = `rgba(${RADAR_ACCENT_RGB}, ${0.5 * currentAlpha})`;
            ctx.lineWidth = 0.6;
            ctx.stroke();

            ctx.font = FIELD_MARKER_FONT;
            ctx.fillStyle = `rgba(${RADAR_WHITE_RGB}, ${0.9 * currentAlpha})`;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
            ctx.shadowBlur = 4;
            ctx.fillText(item.text, item.x + 16, item.y + 3.5);
            ctx.restore();
        }

        function drawFieldMarkers() {
            for (let i = fieldData.length - 1; i >= 0; i--) {
                const item = fieldData[i];
                item.x += item.vx || 0;
                item.y += item.vy || 0;
                item.life -= item.decay;

                if (item.life <= 0) {
                    fieldData.splice(i, 1);
                    continue;
                }

                drawFieldMarker(item);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            updatePointerLerp();
            updateGlowState();

            const px = phoneCenter.x;
            const py = phoneCenter.y;
            const radarRadius = Math.hypot(width, height) * 1.25;

            if (radarAlpha > 0.01) {
                drawRadarRings(px, py, radarRadius);
                drawRadarPulses(px, py, radarRadius);
                radarAngle += RADAR_ROTATION_SPEED;
                drawRadarSweep(px, py, radarRadius);

                // Desenha o mini-smartphone (adaptado proporcionalmente tanto para desktop quanto para mobile)
                drawSmartphone(px, py, radarAlpha);

                // Marcador do cursor apenas no Desktop
                if (mouse.hasMoved && mouse.x !== null && mouse.y !== null && width > MOBILE_BREAKPOINT) {
                    drawPointerMarker();
                }
            }

            drawFieldMarkers();
            updateMobileRandomTelemetry();

            animationFrameId = requestAnimationFrame(draw);
        }

        // Gera dados técnicos de forma randômica e suave na tela do mobile
        function updateMobileRandomTelemetry() {
            if (width <= MOBILE_BREAKPOINT) {
                const now = performance.now();
                if (now - lastSpawnTime > 2800) {
                    const heroSection = document.getElementById('home');
                    const heroHeight = heroSection ? heroSection.offsetHeight : window.innerHeight;
                    // Coordenadas randômicas seguras no terço visual da tela
                    const randX = width * (0.15 + Math.random() * 0.7);
                    const randY = heroHeight * (0.2 + Math.random() * 0.5);
                    spawnFieldData(randX, randY);
                    lastSpawnPos.x = randX;
                    lastSpawnPos.y = randY;
                    lastSpawnTime = now;
                }
            }
        }

        function onPointerMove(e) {
            // Desativa rastreamento de mouse/ponteiro no mobile
            if (width <= MOBILE_BREAKPOINT) return;

            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX;
            const clientY = e.clientY;

            if (clientY <= rect.bottom && clientY >= rect.top) {
                lastPointerMoveTime = performance.now();
                mouse.targetX = clientX - rect.left;
                mouse.targetY = clientY - rect.top;
                mouse.hasMoved = true;

                const targetElement = document.elementFromPoint(clientX, clientY);
                if (targetElement) {
                    const isObstacle = targetElement.closest('a, button, .header, .btn-cta, .nav-toggle, .social-link, h1, h2, h3, .hero-title, .main-logo, .hero-footer, .diff-card, p, input, select, textarea');
                    mouse.isNearObstacle = !!isObstacle || clientY < 80;
                }

                const now = performance.now();
                const distMoved = Math.hypot(mouse.targetX - lastSpawnPos.x, mouse.targetY - lastSpawnPos.y);

                if ((distMoved > 55 && now - lastSpawnTime > 400) && !mouse.isNearObstacle) {
                    spawnFieldData(mouse.targetX, mouse.targetY);
                    lastSpawnPos.x = mouse.targetX;
                    lastSpawnPos.y = mouse.targetY;
                    lastSpawnTime = now;
                }
            }
        }

        // Listener de mouse exclusivo para Desktop
        window.addEventListener('mousemove', onPointerMove, { passive: true });

        window.addEventListener('resize', resizeCanvas, { passive: true });
        window.addEventListener('components:ready', resizeCanvas, { passive: true });
        window.addEventListener('load', resizeCanvas, { passive: true });
        resizeCanvas();
        draw();
    }

    initVideoCarousel();
    initRadarCanvas();
</script>
