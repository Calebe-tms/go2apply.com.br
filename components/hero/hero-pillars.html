<!-- ==========================================================================
   Component: Hero Pillars / Solutions Floating Bar
   Pilares flutuantes minimalistas com ícones coloridos e tipografia elegante
   em harmonia 1:1 com a identidade visual do Hero
   ========================================================================== -->
<style>
    .hero-pillars {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        gap: 0.85rem;
        width: fit-content;
        margin: 0 auto;
        padding: 0 1rem;
        transform: translateY(-24px);
    }

    .pillar-item {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        color: var(--color-white, #fefcf8);
        text-decoration: none;
        font-family: var(--font-main);
        font-size: clamp(0.7rem, 0.8vw, 0.8rem);
        font-weight: 500;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
        transition: var(--transition-smooth);
        cursor: default;
    }

    /* Micro-box individual para os ícones com fundo branco quente */
    .pillar-icon-box {
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--color-white, #fefcf8);
        border-radius: 5px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
        transition: var(--transition-smooth);
        flex-shrink: 0;
    }

    .pillar-icon {
        width: 13px;
        height: 13px;
        object-fit: contain;
        transition: var(--transition-smooth);
    }

    /* --- Mini-Identidade 1: Formação de Caldas (Borda Verde) --- */
    .pillar-caldas .pillar-icon-box {
        border: 1.2px solid var(--color-caldas, #0e603b);
    }
    .pillar-caldas:hover {
        color: #ffffff;
        text-shadow: 0 0 12px var(--color-caldas-glow), 0 2px 8px rgba(0, 0, 0, 0.9);
    }
    .pillar-caldas:hover .pillar-icon-box {
        transform: translateY(-2px) scale(1.08);
        box-shadow: 0 0 14px var(--color-caldas-glow), 0 4px 10px rgba(0, 0, 0, 0.35);
        border-color: var(--color-caldas-light, #168653);
    }

    /* --- Mini-Identidade 2: Pulverização (Borda Âmbar Solar) --- */
    .pillar-pulver .pillar-icon-box {
        border: 1.2px solid var(--color-pulver, #eeb319);
    }
    .pillar-pulver:hover {
        color: #ffffff;
        text-shadow: 0 0 12px var(--color-pulver-glow), 0 2px 8px rgba(0, 0, 0, 0.9);
    }
    .pillar-pulver:hover .pillar-icon-box {
        transform: translateY(-2px) scale(1.08);
        box-shadow: 0 0 14px var(--color-pulver-glow), 0 4px 10px rgba(0, 0, 0, 0.35);
        border-color: var(--color-pulver-light, #f5c43d);
    }

    /* --- Mini-Identidade 3: pH e Kow (Borda Ciano/Teal) --- */
    .pillar-kow .pillar-icon-box {
        border: 1.2px solid var(--color-kow, #028a9b);
    }
    .pillar-kow:hover {
        color: #ffffff;
        text-shadow: 0 0 12px var(--color-kow-glow), 0 2px 8px rgba(0, 0, 0, 0.9);
    }
    .pillar-kow:hover .pillar-icon-box {
        transform: translateY(-2px) scale(1.08);
        box-shadow: 0 0 14px var(--color-kow-glow), 0 4px 10px rgba(0, 0, 0, 0.35);
        border-color: var(--color-kow-light, #03a9be);
    }

    @media (max-width: 768px) {
        .hero-pillars {
            gap: 0.65rem;
            padding: 0 1rem;
            transform: translateY(-14px);
        }

        .pillar-item {
            font-size: 0.65rem;
            letter-spacing: 1px;
            gap: 0.45rem;
        }

        .pillar-icon-box {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .pillar-icon {
            width: 11px;
            height: 11px;
        }
    }
</style>

<div class="hero-pillars">
    <!-- Pilar 1: Formação de Caldas -->
    <div class="pillar-item pillar-caldas">
        <span class="pillar-icon-box">
            <img src="assets/icos/ico-caldas.png" alt="Formação de Caldas" class="pillar-icon">
        </span>
        <span class="pillar-text">Formação de Caldas</span>
    </div>

    <!-- Pilar 2: pH & Kow -->
    <div class="pillar-item pillar-kow">
        <span class="pillar-icon-box">
            <img src="assets/icos/ico-kow.png" alt="pH & Kow" class="pillar-icon">
        </span>
        <span class="pillar-text">pH & Kow</span>
    </div>

    <!-- Pilar 3: Pulverização -->
    <div class="pillar-item pillar-pulver">
        <span class="pillar-icon-box">
            <img src="assets/icos/ico-pulver.png" alt="Pulverização" class="pillar-icon">
        </span>
        <span class="pillar-text">Pulverização</span>
    </div>
</div>
