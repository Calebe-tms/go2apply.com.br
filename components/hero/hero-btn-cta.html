<!-- ==========================================================================
   Component: Hero Button CTA (btn-cta)
   Botão principal de chamada para ação da seção Hero
   ========================================================================== -->
<style>
    .hero-cta-wrapper {
        margin-top: 0.25rem;
        display: flex;
        justify-content: center;
        align-items: center;
        animation: heroBtnFadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
        opacity: 0;
    }

    .hero-cta-btn {
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        font-family: var(--font-main, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
        font-weight: 600;
        border: 1.2px solid var(--color-orange, #f28e13);
        border-radius: var(--radius-btn, 10px);
        color: var(--color-white, #fefcf8);
        gap: 0.75rem;
        background: rgba(var(--color-dark-surface-rgb, 18, 24, 16), 0.85);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        padding: 0.75rem 1.85rem;
        font-size: clamp(0.92rem, 1.05vw, 1.05rem);
        letter-spacing: 0.2px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 18px rgba(242, 142, 19, 0.2);
        transition: var(--transition-smooth, all 0.4s cubic-bezier(0.16, 1, 0.3, 1));
        cursor: pointer;
    }

    .hero-cta-btn:hover {
        transform: translateY(-3px) scale(1.02);
        background: rgba(var(--color-dark-surface-rgb, 18, 24, 16), 0.96);
        border-color: var(--color-orange-hover, #e07d08);
        box-shadow: 0 8px 28px rgba(242, 142, 18, 0.45), 0 0 24px rgba(242, 142, 18, 0.35);
        color: #ffffff;
    }

    .hero-cta-icon {
        width: 22px;
        height: 22px;
        object-fit: contain;
        transition: var(--transition-smooth, all 0.4s cubic-bezier(0.16, 1, 0.3, 1));
    }

    .hero-cta-btn:hover .hero-cta-icon {
        transform: scale(1.12) rotate(8deg);
    }

    .hero-cta-label {
        color: var(--color-white, #fefcf8);
        transition: var(--transition-smooth, all 0.4s cubic-bezier(0.16, 1, 0.3, 1));
    }

    .hero-cta-btn:hover .hero-cta-label {
        color: #ffffff;
    }

    .hero-cta-arrow {
        transition: transform 0.3s ease;
        color: var(--color-orange, #f28e13);
    }

    .hero-cta-btn:hover .hero-cta-arrow {
        transform: translateX(4px);
        color: #ffffff;
    }

    @keyframes heroBtnFadeInUp {
        from {
            opacity: 0;
            transform: translateY(24px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

<div class="hero-cta-wrapper">
    <a href="#solucoes" class="hero-cta-btn cta-btn-base" id="hero-main-cta">
        <img src="assets/icos/ico-logo-go2apply.png" alt="" class="hero-cta-icon" aria-hidden="true">
        <span class="hero-cta-label">Conheça a Ferramenta</span>
        <svg class="hero-cta-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M12 5l7 7-7 7" />
        </svg>
    </a>
</div>
