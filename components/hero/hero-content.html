<style>
    .hero-content {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100dvh;
        width: 100%;
        padding: clamp(0rem, 10vh, 7.5rem) 1.5rem clamp(8.5rem, 12vh, 8.5rem);
        pointer-events: none;
    }

    .hero-content a,
    .hero-content button,
    .hero-content h1,
    .hero-content p,
    .hero-content img {
        pointer-events: auto;
    }

    .main-content {
        position: relative;
        width: 100%;
        max-width: 1100px;
        margin: auto 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        gap: 1.35rem;
        padding: 0.5rem 1rem;
    }

    .main-content::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(94vw, 960px);
        height: 120%;
        background: radial-gradient(ellipse 65% 60% at 50% 50%,
                rgba(var(--color-dark-surface-rgb), 0.62) 0%,
                rgba(var(--color-dark-rgb), 0.32) 48%,
                rgba(var(--color-dark-rgb), 0) 85%);
        pointer-events: none;
        z-index: -1;
        border-radius: 50%;
        filter: blur(24px);
    }

    @media (max-width: 992px) {
        .hero-content {
            padding-top: clamp(4.5rem, 8vh, 6rem);
            padding-bottom: clamp(5.5rem, 10vh, 7.5rem);
            padding-left: 1.25rem;
            padding-right: 1.25rem;
        }
    }

    @media (max-width: 600px) {
        .hero-content {
            /* Alinhamento pelo Ponto de Ouro (~38% da viewport) */
            padding-top: max(4.2rem, 11dvh);
            padding-bottom: max(5.5rem, 17dvh);
            padding-left: 1.15rem;
            padding-right: 1.15rem;
            min-height: 100dvh;
            justify-content: flex-start;
        }

        .main-content {
            margin: auto 0;
            gap: 1.15rem;
            padding: 0.5rem 0.25rem;
            transform: translateY(-2.5vh);
        }

        .main-content::before {
            width: 100%;
            height: 100%;
            filter: blur(16px);
        }
    }
</style>

<div class="hero-content">
    <main class="main-content">
        <div data-component="components/hero/hero-cta.html"></div>
        <div data-component="components/hero/hero-btn-cta.html"></div>
    </main>
    <div data-component="components/hero/hero-scroll-indicator.html"></div>
    <div data-component="components/hero/hero-ticker.html"></div>
</div>
