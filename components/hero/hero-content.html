<!-- ==========================================================================
   Component: Hero Content
   Logo principal animado, título com destaque e CTA principal
   ========================================================================== -->
<style>
    .hero-content {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 100vh;
        width: 100%;
        padding: 2.5rem 2rem 2.5rem 2rem;
        pointer-events: none;
        /* Permite que o mouse passe livremente para a camada de fundo */
    }

    .hero-content a,
    .hero-content button,
    .hero-content h1,
    .hero-content p,
    .hero-content img {
        pointer-events: auto;
    }

    .main-content {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        gap: 1.5rem;
        transform: translateY(-2vh);
        padding: 2rem 1rem;
    }

    /* Sombra sutil com bordas que esvanecem em transparência atrás do texto */
    .main-content::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(94vw, 960px);
        height: 120%;
        background: radial-gradient(ellipse 65% 60% at 50% 50%,
                rgba(var(--color-dark-surface-rgb), 0.62) 0%,
                rgba(var(--color-dark-rgb), 0.32) 48%,
                rgba(var(--color-dark-rgb), 0) 85%);
        pointer-events: none;
        z-index: -1;
        border-radius: 50%;
        filter: blur(24px);
    }

    .logo-container {
        display: flex;
        justify-content: center;
        align-items: center;
        animation: fadeInDown 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .main-logo {
        max-width: 520px;
        width: min(88vw, 520px);
        height: auto;
        filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.45));
    }

    .hero-title {
        color: var(--color-white);
        font-family: var(--font-main);
        font-size: clamp(1.35rem, 2.1vw, 2.15rem);
        font-weight: 500;
        line-height: 1.36;
        letter-spacing: -0.2px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7), 0 1px 3px rgba(0, 0, 0, 0.85);
        max-width: 900px;
        margin: 0 auto;
        animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        opacity: 0;
    }

    .hero-title .highlight {
        color: var(--color-orange);
        font-weight: 600;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6), 0 0 16px rgba(242, 142, 18, 0.35);
    }

    /* Botão CTA Principal da Hero */
    .hero-cta-wrapper {
        margin-top: 0.25rem;
        display: flex;
        justify-content: center;
        align-items: center;
        animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
        opacity: 0;
    }

    .hero-cta-btn {
        gap: 0.75rem;
        background: rgba(var(--color-dark-surface-rgb), 0.85);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        padding: 0.75rem 1.85rem;
        font-size: clamp(0.92rem, 1.05vw, 1.05rem);
        letter-spacing: 0.2px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 18px rgba(242, 142, 19, 0.2);
        transition: var(--transition-smooth);
        cursor: pointer;
    }

    .hero-cta-btn:hover {
        transform: translateY(-3px) scale(1.02);
        background: rgba(var(--color-dark-surface-rgb), 0.96);
        border-color: var(--color-orange-hover);
        box-shadow: 0 8px 28px rgba(242, 142, 18, 0.45), 0 0 24px rgba(242, 142, 18, 0.35);
        color: #ffffff;
    }

    .hero-cta-icon {
        width: 22px;
        height: 22px;
        object-fit: contain;
        transition: var(--transition-smooth);
    }

    .hero-cta-btn:hover .hero-cta-icon {
        transform: scale(1.12) rotate(8deg);
    }

    .hero-cta-arrow {
        transition: transform 0.3s ease;
        color: var(--color-orange);
    }

    .hero-cta-btn:hover .hero-cta-arrow {
        transform: translateX(4px);
        color: #ffffff;
    }

    @keyframes fadeInDown {
        from {
            opacity: 0;
            transform: translateY(-24px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(24px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 992px) {
        .hero-content {
            padding: 5rem 1.5rem 2rem 1.5rem;
        }

        .main-logo {
            max-width: 400px;
        }
    }

    @media (max-width: 600px) {
        .hero-content {
            padding: 4.5rem 1rem 1.5rem 1rem;
            min-height: 100dvh;
        }

        .main-content {
            transform: none;
            gap: 0.9rem;
            padding: 1rem 0.25rem;
        }

        .main-content::before {
            width: 100%;
            height: 100%;
            filter: blur(16px);
        }

        .main-logo {
            max-width: 250px;
        }

        .hero-title {
            font-size: 1.08rem;
            line-height: 1.34;
        }
    }
</style>

<div class="hero-content">
    <main class="main-content">
        <div class="logo-container">
            <img src="assets/imagens/go2apply-logo-colorido.png" alt="go2apply logo" class="main-logo">
        </div>

        <h1 class="hero-title">
            Da formação da calda à aplicação,<br>
            decisões com <span class="highlight">base técnica</span>.
        </h1>

        <!-- Botão CTA Principal da Hero -->
        <div class="hero-cta-wrapper">
            <a href="#solucoes" class="hero-cta-btn cta-btn-base" id="hero-main-cta">
                <img src="assets/icos/ico-logo-go2apply.png" alt="" class="hero-cta-icon" aria-hidden="true">
                <span class="hero-cta-label">Conheça a Ferramenta</span>
                <svg class="hero-cta-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                    stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </a>
        </div>
    </main>

    <div data-component="components/hero/hero-scroll-indicator.html"></div>

    <div data-component="components/hero/hero-ticker.html"></div>
</div>
