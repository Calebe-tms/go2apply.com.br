<!-- ==========================================================================
   Component: Hero Content
   Logo principal animado, título com destaque e rodapé institucional
   ========================================================================== -->
<style>
    .hero-content {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 100vh;
        width: 100%;
        padding: 5.5rem 2rem 2.5rem 2rem;
        pointer-events: none; /* Permite que o mouse passe livremente para a camada de fundo */
    }

    .hero-content a,
    .hero-content button,
    .hero-content h1,
    .hero-content p,
    .hero-content img {
        pointer-events: auto;
    }

    .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        gap: 1.25rem;
        transform: translateY(-3vh);
    }

    .logo-container {
        display: flex;
        justify-content: center;
        align-items: center;
        animation: fadeInDown 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .main-logo {
        max-width: 520px;
        width: min(88vw, 520px);
        height: auto;
        filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.45));
    }

    .hero-title {
        color: var(--color-white);
        font-family: var(--font-main);
        font-size: clamp(1.35rem, 2.1vw, 2.15rem);
        font-weight: 500;
        line-height: 1.36;
        letter-spacing: -0.2px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7), 0 1px 3px rgba(0, 0, 0, 0.85);
        max-width: 900px;
        margin: 0 auto;
        animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        opacity: 0;
    }

    .hero-title .highlight {
        color: var(--color-orange);
        font-weight: 600;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6), 0 0 16px rgba(242, 142, 18, 0.35);
    }

    .hero-footer {
        text-align: center;
        padding-bottom: 0.5rem;
        animation: fadeIn 1.2s ease 0.5s forwards;
        opacity: 0;
    }

    .hero-footer-text {
        color: rgba(255, 255, 255, 0.95);
        font-family: var(--font-main);
        font-size: clamp(0.85rem, 1.1vw, 1.05rem);
        font-weight: 500;
        letter-spacing: 1.8px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.75), 0 1px 2px rgba(0, 0, 0, 0.9);
        margin: 0;
        text-transform: uppercase;
    }

    @keyframes fadeInDown {
        from {
            opacity: 0;
            transform: translateY(-24px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(24px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
        }
        to {
            opacity: 1;
        }
    }

    @media (max-width: 992px) {
        .hero-content {
            padding: 5rem 1.5rem 2rem 1.5rem;
        }

        .main-logo {
            max-width: 400px;
        }
    }

    @media (max-width: 600px) {
        .main-logo {
            max-width: 290px;
        }

        .hero-title {
            font-size: 1.18rem;
            line-height: 1.34;
        }

        .hero-footer-text {
            font-size: 0.75rem;
            letter-spacing: 1.2px;
        }
    }
</style>

<div class="hero-content">
    <main class="main-content">
        <div class="logo-container">
            <img src="assets/imagens/go2apply-logo-colorido.png" alt="go2apply logo" class="main-logo">
        </div>

        <h1 class="hero-title">
            Ferramentas e <span class="highlight">informações</span><br>
            <span class="highlight">técnicas</span> para apoiar suas decisões,<br>
            da formação da calda à aplicação.
        </h1>
    </main>

    <footer class="hero-footer">
        <div data-component="components/hero/hero-pillars.html"></div>
    </footer>
</div>
