<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 100" width="1300" height="100">
  <!-- Container para cada ícone (100x100 cada) -->

  <!-- 1. Formação de Caldas - Beaker -->
  <g id="icon-caldas">
    <path d="M 30 20 L 35 20 L 35 60 Q 35 70 25 70 Q 15 70 15 60 L 15 20 L 20 20 M 20 40 L 35 40"
          fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 2. Alertas de Incompatibilidade - Warning Triangle -->
  <g id="icon-alerta" transform="translate(100, 0)">
    <path d="M 25 15 L 40 50 Q 42 56 25 56 Q 8 56 10 50 L 25 15 Z"
          fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="25" cy="48" r="1.5" fill="currentColor"/>
    <line x1="25" y1="40" x2="25" y2="45" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- 3. Kow - Leaf -->
  <g id="icon-kow" transform="translate(200, 0)">
    <path d="M 25 18 Q 35 25 35 40 Q 35 55 25 60 Q 15 55 15 40 Q 15 25 25 18 Z"
          fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="25" y1="18" x2="25" y2="60" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 4. Dimensionamento de Gotas - Droplet -->
  <g id="icon-gotas" transform="translate(300, 0)">
    <path d="M 25 18 Q 30 25 30 32 Q 30 45 25 52 Q 20 45 20 32 Q 20 25 25 18 Z"
          fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 5. Delta T - Thermometer -->
  <g id="icon-delta-t" transform="translate(400, 0)">
    <path d="M 25 18 L 25 48 Q 25 60 20 65 Q 30 60 30 48 L 30 18"
          fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="25" cy="55" r="4" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <line x1="25" y1="45" x2="25" y2="55" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 6. Pressão e Vazão - Gauge -->
  <g id="icon-pressao" transform="translate(500, 0)">
    <circle cx="25" cy="35" r="15" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <path d="M 25 35 L 25 22" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="25" cy="35" r="2" fill="currentColor"/>
  </g>

  <!-- 7. Fluxômetro - Gauge with Line -->
  <g id="icon-fluxometro" transform="translate(600, 0)">
    <circle cx="25" cy="35" r="15" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <path d="M 25 20 Q 35 30 32 40" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="25" cy="35" r="2" fill="currentColor"/>
  </g>

  <!-- 8. Calibração - Wrench -->
  <g id="icon-calibracao" transform="translate(700, 0)">
    <path d="M 18 25 L 28 35 Q 32 38 35 35 L 38 32 Q 35 30 32 27"
          fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="20" cy="23" r="3" fill="none" stroke="currentColor" stroke-width="2.5"/>
  </g>

  <!-- 9. Uniformidade - Bar Chart -->
  <g id="icon-uniformidade" transform="translate(800, 0)">
    <rect x="16" y="38" width="5" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="23" y="32" width="5" height="26" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="30" y="25" width="5" height="33" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="37" y="40" width="5" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- 10. Relatórios - Document -->
  <g id="icon-relatorios" transform="translate(900, 0)">
    <rect x="16" y="18" width="18" height="42" rx="2" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="28" x2="30" y2="28" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="35" x2="30" y2="35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="42" x2="30" y2="42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="49" x2="25" y2="49" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 11. Comunidade - Users -->
  <g id="icon-comunidade" transform="translate(1000, 0)">
    <circle cx="18" cy="28" r="4" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <circle cx="32" cy="28" r="4" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <path d="M 14 35 Q 14 32 18 32 Q 22 32 22 35 L 22 45 Q 22 48 18 48 L 18 48 Q 14 48 14 45 Z"
          fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 28 35 Q 28 32 32 32 Q 36 32 36 35 L 36 45 Q 36 48 32 48 L 32 48 Q 28 48 28 45 Z"
          fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 12. Sistema - Sliders/Settings -->
  <g id="icon-sistema" transform="translate(1100, 0)">
    <line x1="15" y1="30" x2="35" y2="30" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="28" cy="30" r="2.5" fill="currentColor"/>
    <line x1="15" y1="45" x2="35" y2="45" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="20" cy="45" r="2.5" fill="currentColor"/>
  </g>

  <!-- 13. Telegram/Comunidade - Paper Plane -->
  <g id="icon-telegram" transform="translate(1200, 0)">
    <path d="M 16 35 L 35 20 L 20 40 Q 19 45 18 50 L 35 32"
          fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>