<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>go2apply - Informações Técnicas</title>
    <meta name="description" content="Ferramentas e informações técnicas para apoiar suas decisões, da formação da calda à aplicação.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="hero">
        <!-- Video Background Container -->
        <div class="hero-bg">
            <video id="bg-video-1" class="bg-video active" muted playsinline></video>
            <video id="bg-video-2" class="bg-video" muted playsinline></video>
            <div class="overlay"></div>
        </div>

        <div class="hero-content">
            <!-- Header Navigation -->
            <header class="header">
                <nav class="nav-container">
                    <ul class="nav-links">
                        <li><a href="#solucoes">SOLUÇÕES</a></li>
                        <li><a href="#diferenciais">DIFERENCIAIS</a></li>
                        <li><a href="#base-tecnica">BASE TÉCNICA</a></li>
                        <li><a href="#planos">PLANOS</a></li>
                    </ul>
                    <a href="#conheca" class="btn-cta">
                        <img src="assets/imagens/ico-1.png" alt="Ícone" class="btn-icon">
                        Conheça a Ferramenta
                    </a>
                </nav>
            </header>

            <!-- Main Content -->
            <main class="main-content">
                <div class="logo-container">
                    <img src="assets/imagens/go2apply-logo-colorido.png" alt="go2apply logo" class="main-logo">
                </div>
                
                <h1 class="hero-title">
                    Ferramentas e <span class="highlight">informações</span><br>
                    <span class="highlight">técnicas</span> para apoiar suas decisões,<br>
                    da formação da calda à aplicação.
                </h1>
            </main>

            <!-- Footer Text -->
            <footer class="hero-footer">
                <p>FORMAÇÃO DE CALDAS &bull; PULVERIZAÇÃO &bull; PH E KOW</p>
            </footer>
        </div>
    </div>

    <!-- Script for video carousel -->
    <script src="js/main.js"></script>
</body>
</html>
