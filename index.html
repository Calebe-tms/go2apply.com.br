    <style>
    /* ==========================================================================
       Loading Screen — go2apply
       Bloqueia render até components:ready, então faz fade-out + slide-up.
       ========================================================================== */
    #app-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #fefcf8;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;

        /* Saída: fade + slide sutil */
        transition:
            opacity  0.7s cubic-bezier(0.22, 1, 0.36, 1),
            transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #app-loader.is-hidden {
        opacity: 0;
        transform: translateY(-12px);
        pointer-events: none;
    }

    /* Marca SVG centralizada */
    .loader__logo {
        width: clamp(80px, 12vw, 120px);
        height: auto;
        animation: loader-breathe 2.4s ease-in-out infinite;
    }

    @keyframes loader-breathe {
        0%,100% { transform: scale(1);   opacity: 1;    }
        50%      { transform: scale(1.06); opacity: 0.75; }
    }

    /* Barra de progresso fina */
    .loader__bar {
        width: clamp(140px, 20vw, 200px);
        height: 2px;
        border-radius: 9999px;
        background: rgba(23, 30, 20, 0.08);
        overflow: hidden;
    }

    .loader__bar-fill {
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: linear-gradient(
            to right,
            #5b8c45,
            #f28e13
        );
        animation: loader-progress 1.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes loader-progress {
        0%   { width: 0%;   }
        60%  { width: 75%;  }
        100% { width: 100%; }
    }

    /* Label de versão */
    .loader__label {
        font-family: -apple-system, 'Host Grotesk', sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(23, 30, 20, 0.35);
    }

    @media (prefers-reduced-motion: reduce) {
        .loader__logo { animation: none; }
        .loader__bar-fill { animation: none; width: 100%; }
        #app-loader { transition: opacity 300ms ease; }
    }
    </style>

    <script>
    // Esconde o loading screen somente quando:
    // 1. Todos os componentes HTML foram montados (components:ready)
    // 2. O primeiro vídeo do hero começou a reproduzir (hero:first-video-ready)
    (function () {
        var loader = document.getElementById('app-loader');
        if (!loader) return;

        window.__loaderStart = Date.now();

        // Converte cada evento em uma Promise que resolve ao disparar
        function waitFor(eventName, timeoutMs) {
            return new Promise(function (resolve) {
                var done = false;

                // Fallback: resolve mesmo se o evento nunca vir (ex: erro de rede)
                var timer = setTimeout(function () {
                    if (!done) { done = true; resolve(); }
                }, timeoutMs || 12000);

                window.addEventListener(eventName, function handler() {
                    if (!done) {
                        done = true;
                        clearTimeout(timer);
                        window.removeEventListener(eventName, handler);
                        resolve();
                    }
                }, { once: true });
            });
        }

        function dismiss() {
            // Garante ao menos 700ms para a barra de progresso completar
            var elapsed = Date.now() - window.__loaderStart;
            var delay   = Math.max(0, 700 - elapsed);

            setTimeout(function () {
                loader.classList.add('is-hidden');
                loader.addEventListener('transitionend', function () {
                    loader.remove();
                }, { once: true });
            }, delay);
        }

        // Aguarda os DOIS sinais em paralelo antes de liberar
        Promise.all([
            waitFor('components:ready',       10000),  // Timeout: 10s
            waitFor('hero:first-video-ready', 12000)   // Timeout: 12s (YouTube pode demorar)
        ]).then(dismiss);

    })();
    </script>
