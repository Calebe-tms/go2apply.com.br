    <style>
    /* ==========================================================================
       Loading Screen — go2apply
       Bloqueia render até components:ready, então faz fade-out + slide-up.
       ========================================================================== */
    #app-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #fefcf8;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;

        /* Saída: fade + slide sutil */
        transition:
            opacity  0.7s cubic-bezier(0.22, 1, 0.36, 1),
            transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #app-loader.is-hidden {
        opacity: 0;
        transform: translateY(-12px);
        pointer-events: none;
    }

    /* Marca SVG centralizada */
    .loader__logo {
        width: clamp(80px, 12vw, 120px);
        height: auto;
        animation: loader-breathe 2.4s ease-in-out infinite;
    }

    @keyframes loader-breathe {
        0%,100% { transform: scale(1);   opacity: 1;    }
        50%      { transform: scale(1.06); opacity: 0.75; }
    }

    /* Barra de progresso real */
    .loader__bar {
        width: clamp(160px, 22vw, 220px);
        height: 3px;
        border-radius: 9999px;
        background: rgba(23, 30, 20, 0.08);
        overflow: hidden;
        position: relative;
    }

    .loader__bar-fill {
        height: 100%;
        width: 0%;
        border-radius: inherit;
        background: linear-gradient(
            to right,
            #5b8c45,
            #f28e13
        );
        transition: width 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Status e Porcentagem Real */
    .loader__status {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-family: -apple-system, 'Host Grotesk', sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(23, 30, 20, 0.45);
    }

    .loader__percent {
        font-variant-numeric: tabular-nums;
        color: #5b8c45;
        font-weight: 700;
    }

    @media (prefers-reduced-motion: reduce) {
        .loader__logo { animation: none; }
        .loader__bar-fill { transition: none; }
        #app-loader { transition: opacity 300ms ease; }
    }
    </style>

    <script>
    // Gerenciador de Progresso Real do Carregamento
    (function () {
        var loader = document.getElementById('app-loader');
        var barFill = document.getElementById('loader-bar-fill');
        var percentText = document.getElementById('loader-percent');
        if (!loader || !barFill) return;

        var currentPercent = 0;
        var isDismissed = false;

        function updateProgress(targetPercent) {
            targetPercent = Math.max(0, Math.min(100, Math.round(targetPercent)));
            if (targetPercent > currentPercent) {
                currentPercent = targetPercent;
                barFill.style.width = currentPercent + '%';
                if (percentText) {
                    percentText.textContent = currentPercent + '%';
                }
            }
        }

        // Progresso inicial ao renderizar a casca HTML
        updateProgress(15);

        // 1. Escuta o progresso real de cada componente HTML baixado e montado
        window.addEventListener('loader:progress', function (e) {
            if (e.detail && typeof e.detail.percentage === 'number') {
                // Componentes compõem 15% -> 85% da carga total
                var progress = 15 + (e.detail.percentage * 0.70);
                updateProgress(progress);
            }
        });

        function dismiss() {
            if (isDismissed) return;
            isDismissed = true;
            updateProgress(100);

            setTimeout(function () {
                loader.classList.add('is-hidden');
                loader.addEventListener('transitionend', function () {
                    loader.remove();
                }, { once: true });
            }, 300);
        }

        // 2. Quando todos os componentes HTML estiverem montados
        window.addEventListener('components:ready', function () {
            updateProgress(90);

            // Aguarda o primeiro vídeo estar pronto na tela antes de desaparecer o loader
            var videoReady = false;
            window.addEventListener('hero:first-video-ready', function () {
                videoReady = true;
                updateProgress(100);
                setTimeout(dismiss, 180);
            }, { once: true });

            // Fallback com timeout (caso vídeo demore muito)
            setTimeout(function () {
                if (!videoReady) {
                    updateProgress(100);
                    setTimeout(dismiss, 180);
                }
            }, 3000);
        }, { once: true });

        // Salvaguarda máxima (timeout de 5s caso ocorra instabilidade de rede externa)
        setTimeout(function () {
            dismiss();
        }, 5000);

    })();
    </script>
